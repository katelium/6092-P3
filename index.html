d:var(--card);border-radius:18px;box-shadow:0 4px 12px rgba(0,0,0,.08);padding:16px 18px;margin:14px 0}\n.qhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}\n.qtag{font-family:'Fredoka One';color:#5b4b8a;font-size:1.05rem}.marks{font-weight:800;color:#6a6f85;font-size:.85rem}\n.badge{font-weight:800;font-size:.8rem;padding:4px 10px;border-radius:999px;white-space:nowrap}\n.b-good{background:var(--goodbg);color:var(--good)}.b-mix{background:var(--mixbg);color:var(--mix)}.b-bad{background:var(--badbg);color:var(--bad)}.b-na{background:var(--nabg);color:var(--na)}\n.reveal{background:#fff;border:2px solid var(--teal);box-shadow:0 4px 0 var(--teal);border-radius:12px;font-weight:700;padding:8px 14px;margin-top:8px}\n.reveal:active{transform:translateY(4px);box-shadow:0 0 0 var(--teal)}\n.reveal.ex-btn{border-color:var(--pink);box-shadow:0 4px 0 var(--pink)}.reveal.ex-btn:active{box-shadow:0 0 0 var(--pink)}\n.reveal.why-btn{border-color:#f2d16b;box-shadow:0 4px 0 #f2d16b;font-size:.88rem}.reveal.why-btn:active{box-shadow:0 0 0 #f2d16b}\n.answer,.examples,.whywrap{display:none}.answer.show,.examples.show,.whywrap.show{display:block}\n.answer{margin-top:12px;background:#f7f9ff;border-left:6px solid var(--purple);border-radius:10px;padding:12px 14px}\n.answer h4{margin:.2rem 0 .4rem;color:#5b4b8a;font-family:'Fredoka One';font-weight:400;font-size:.95rem}\n.err{margin-top:10px;background:var(--badbg);border-radius:10px;padding:10px 12px;font-size:.92rem}.err b{color:var(--bad)}\n.examples{margin-top:10px}\n.exrow{border:1px solid #eef0f6;border-radius:12px;padding:10px;margin:10px 0;background:#fcfdff}\n.exlab{font-weight:800;color:#6a6f85;font-size:.78rem;margin-bottom:6px}\n.strip{border-radius:8px;padding:7px 10px;margin:5px 0;font-size:.92rem}\n.strip.w{background:var(--badbg)}.strip.y{background:var(--mixbg)}.strip.c{background:var(--goodbg)}\n.chip{display:inline-block;background:var(--nabg);border-radius:8px;padding:1px 7px;font-size:.8rem;font-weight:700;margin-left:4px}\n.board{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:640px){.board{grid-template-columns:1fr}}\n.col{border-radius:16px;padding:14px 16px}.col.g{background:var(--goodbg)}.col.b{background:var(--badbg)}\n.col h3{margin:.2rem 0 .6rem;font-family:'Fredoka One';font-weight:400}.col.g h3{color:var(--good)}.col.b h3{color:var(--bad)}\n.col ul{margin:0;padding-left:18px}.col li{margin:5px 0}\n.row{display:flex;align-items:center;gap:8px;margin:7px 0}.row .lab{flex:0 0 92px;font-weight:700;font-size:.85rem}\n.track{flex:1;background:#eef0f6;border-radius:999px;height:20px;overflow:hidden}\n.fill{height:100%;border-radius:999px;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;color:#fff;font-weight:800;font-size:.72rem}\n.legend,.note{font-size:.83rem;color:#6a6f85;margin-top:8px}\nfooter{text-align:center;color:#9aa0b3;font-size:.8rem;padding:20px}\n</style></head><body><div class=\"wrap\">\n<header><h1>\u2697\ufe0f 2019 O-Level Chemistry Paper 3 \u2014 Review Walkthrough</h1><div class=\"sub\">Model answers, class performance & real examples | 6092 Practical | Evergreen Secondary School</div><div class=\"credit\">Created by Priscilia \u00b7 Evergreen Secondary School</div></header>\n<div class=\"bar-top\" id=\"tabs\"></div>\n<div id=\"ov\" class=\"page active\"></div>\n<div id=\"qpages\"></div>\n<footer>Examples are anonymised \u2014 the script number lets you pull the paper. Facility % = average marks earned \u00f7 max, across all 39 scripts.</footer></div>\n<script>\nconst CFG={\"title\": \"\u2697\ufe0f 2019 O-Level Chemistry Paper 3 \u2014 Review Walkthrough\", \"subtitle\": \"Model answers, class performance & real examples | 6092 Practical | Evergreen Secondary School\", \"credit\": \"Created by Priscilia \u00b7 Evergreen Secondary School\", \"avg\": \"26.5 / 40 (66.3%) across the class of 39\", \"note\": \"Examples are anonymised \u2014 the script number lets you pull the paper. Facility % = average marks earned \u00f7 max, across all 39 scripts.\", \"good\": 75, \"mixed\": 60, \"questions\": [{\"id\": \"Q1\", \"tab\": \"Question 1\", \"name\": \"Question 1 \u2014 Enthalpy titration (P + Q)\", \"parts\": [{\"t\": \"1(a) Table of 7 experiments\", \"m\": 4, \"fac\": 92, \"ans\": \"A table for all 7 experiments showing: vol P, vol Q, initial temp of P, highest temp reached, and temp rise. Temperatures recorded to the nearest 0.5\u00b0C; temp rise = highest \u2212 initial for each row. The rise should climb to a peak at <b>Experiment 5</b>, then fall, with every value within \u00b12.0\u00b0C of the supervisor's results (Exp1 3.5, Exp2 5.0, Exp3 7.0, Exp4 9.0, Exp5 11.5, Exp6 9.0, Exp7 6.5).\", \"err\": \"Arithmetic slips in the temp-rise column, or a trend that peaks at the wrong experiment.\", \"ex\": [{\"s\": \"1288\", \"w\": \"Exp2/4 rise wrong (34.5\u221230.5 written as 4.5)\", \"y\": \"arithmetic errors plus an erratic trend \u2014 2 experiments fall outside the \u00b12\u00b0C tolerance\", \"c\": \"temp rise = highest \u2212 initial for each row; the rise should climb smoothly then fall, peaking at Exp5\"}, {\"s\": \"1295\", \"w\": \"rises peak at Exp3 (11.0\u00b0C), with several values outside supervisor tolerance\", \"y\": \"the trend and tolerance marks both need the peak at Exp5, within \u00b12\u00b0C of the supervisor's figures\", \"c\": \"rise then fall, highest at Exp5, close to the supervisor's values\"}, {\"s\": \"1312\", \"w\": \"rise dips at Exp5, with two separate peaks (Exp4 and Exp6)\", \"y\": \"the peak must be a single one at Exp5; the Exp5 value is also 4.5\u00b0C off tolerance\", \"c\": \"peak should be at Exp5, with all values within \u00b12\u00b0C of the scheme\"}]}, {\"t\": \"1(b) Graph: temp rise vs vol Q\", \"m\": 4, \"fac\": 94, \"ans\": \"Plot temperature rise (y-axis) against volume of Q (x-axis) for all 7 experiments, matching your own table exactly. Draw two straight best-fit lines through the rising and falling sets of points \u2014 they should intersect at or above your own highest recorded temperature rise.\", \"err\": \"Intersection drawn below the highest point, or points plotted against the wrong volume column.\", \"ex\": [{\"s\": \"1307\", \"w\": \"points plotted using the Vol P values instead of Vol Q\", \"y\": \"the x-axis is Volume of Q \u2014 her points followed the P column instead\", \"c\": \"plot each temperature rise against that experiment's own Vol Q\"}, {\"s\": \"1310\", \"w\": \"points plotted correctly, two lines drawn, but intersection sits below the highest point (30, 11)\", \"y\": \"the two lines must cross at or above the highest recorded rise\", \"c\": \"redraw so the intersection sits at or above (Vol Q, 11.0)\"}, {\"s\": \"1317\", \"w\": \"two lines drawn, intersecting around (28.75, ~10.3)\", \"y\": \"the intersection sits below the highest recorded rise of 11.0\u00b0C\", \"c\": \"the intersection point should be at or above 11.0\u00b0C\"}]}, {\"t\": \"1(c) Volume of Q at intersection (own graph)\", \"m\": 1, \"fac\": 100, \"ans\": \"Read the intersection volume directly off your own graph (scheme value \u2248 29.5 cm\u00b3, but marked against the student's own lines).\", \"err\": null}, {\"t\": \"1(d) Moles of NaOH\", \"m\": 1, \"fac\": 90, \"ans\": \"mol NaOH = (Vol Q from own (c) \u00f7 1000) \u00d7 1.25.\", \"err\": \"Dividing by the wrong number (e.g. by Mr, or by 24) instead of multiplying by 1.25.\", \"ex\": [{\"s\": \"1299\", \"w\": \"30/1000 divided by 24 = 0.00125 mol\", \"y\": \"wrong method \u2014 divided by 24 instead of multiplying by 1.25\", \"c\": \"0.030 \u00d7 1.25 = 0.0375 mol\"}, {\"s\": \"1296\", \"w\": \"0.00375 mol\", \"y\": \"1.25 \u00d7 30/1000 actually gives 0.0375 mol \u2014 the decimal point is misplaced\", \"c\": \"0.0375 mol\"}, {\"s\": \"1305\", \"w\": \"divided the volume by the Mr of NaOH instead of using \u00d71.25\", \"y\": \"wrong method \u2014 this step is a simple \u00d71.25, not a division by Mr\", \"c\": \"(Vol Q \u00f7 1000) \u00d7 1.25\"}]}, {\"t\": \"1(e) Volume of P to neutralise\", \"m\": 1, \"fac\": 44, \"ans\": \"Vol P = 50 \u2212 Vol Q(c). This paper keeps P + Q = 50 cm\u00b3 in every experiment, so subtraction \u2014 not concentration \u00d7 volume \u2014 is the required method. ECF from own (c).\", \"err\": \"Using conc \u00d7 vol (e.g. 0.75 \u00d7 Vol Q) instead of the required 50 \u2212 Vol Q(c) subtraction \u2014 by far the most common slip in the whole paper.\", \"ex\": [{\"s\": \"1289\", \"w\": \"Vol P = 0.75 \u00f7 0.0375\", \"y\": \"this is conc \u00f7 mol, not the 50 \u2212 Vol Q(c) subtraction this paper needs\", \"c\": \"Vol P = 50 \u2212 Vol Q(c)\"}, {\"s\": \"1321\", \"w\": \"Vol P = 0.75 \u00d7 Vol Q(c), giving 281.25 cm\u00b3\", \"y\": \"concentration \u00d7 volume is the wrong method \u2014 the answer is also chemically impossible, since P + Q must total 50 cm\u00b3\", \"c\": \"Vol P = 50 \u2212 Vol Q(c)\"}, {\"s\": \"1302\", \"w\": \"Vol P = conc \u00d7 mol of NaOH\", \"y\": \"conc \u00d7 mol is not a valid method for this step\", \"c\": \"Vol P = 50 \u2212 Vol Q(c)\"}]}, {\"t\": \"1(f) [H+] concentration in P\", \"m\": 2, \"fac\": 21, \"ans\": \"[H+] = mol NaOH (from own d) \u00f7 Vol P in dm\u00b3 (from own e, i.e. (e)/1000). 1 mark for correct method/setup, 1 mark for the correct final answer with ECF from (d) and (e). If (e) used the wrong method, (f) built on it also fails unless the ECF value stays internally consistent.\", \"err\": \"Almost the whole class lost this \u2014 mostly because it's built on the wrong-method (e), but some also restated a given concentration or used an unrelated method.\", \"ex\": [{\"s\": \"1294\", \"w\": \"used Avogadro's number in the calculation\", \"y\": \"wrong method entirely \u2014 this step is a simple division of mol \u00f7 volume\", \"c\": \"[H+] = mol NaOH (d) \u00f7 Vol P in dm\u00b3 (e)\"}, {\"s\": \"1296\", \"w\": \"wrote 0.75 mol/dm\u00b3\", \"y\": \"this just restates the given concentration of P, not a value derived from (d) and (e)\", \"c\": \"[H+] = mol NaOH (d) \u00f7 Vol P in dm\u00b3 (e)\"}, {\"s\": \"1306\", \"w\": \"wrote 1.25 mol/dm\u00b3 with no working shown\", \"y\": \"this just restates the concentration of Q, not a calculated value\", \"c\": \"[H+] = mol NaOH (d) \u00f7 Vol P in dm\u00b3 (e)\"}]}, {\"t\": \"1(g) Identity of acid in P + explanation\", \"m\": 1, \"fac\": 13, \"ans\": \"Sulfuric acid, because the calculated [H+] is about DOUBLE the concentration of P (0.75), showing it is a diprotic acid. Both the identity AND the doubling reasoning are needed for the mark \u2014 identity alone, or reasoning alone, earns no credit.\", \"err\": \"The lowest-scoring part on the paper. Most students named hydrochloric acid; even students who correctly named sulfuric acid usually gave no doubling reasoning at all.\", \"ex\": [{\"s\": \"1285\", \"w\": \"Hydrochloric acid \u2014 dissociates completely\", \"y\": \"wrong acid, and no doubling-of-concentration reasoning given\", \"c\": \"Sulfuric acid \u2014 [H+] is about double the concentration of P\"}, {\"s\": \"1298\", \"w\": \"Sulfuric acid \u2014 no explanation given\", \"y\": \"identity is correct, but the doubling reasoning is still required and none was shown\", \"c\": \"Sulfuric acid \u2014 [H+] is about double the concentration of P\"}, {\"s\": \"1302\", \"w\": \"Sulfuric acid \u2014 'it is a strong acid'\", \"y\": \"correct identity, but the reasoning must link to the calculated [H+] being double P's concentration, not just 'strong acid'\", \"c\": \"Sulfuric acid \u2014 [H+] is about double the concentration of P\"}]}, {\"t\": \"1(h) Two changes to improve accuracy\", \"m\": 2, \"fac\": 46, \"ans\": \"Accept any 2 of: (1) put a lid on the Styrofoam cup to reduce heat loss, (2) repeat the experiment(s) and average the temperature readings, (3) use a burette (not a measuring cylinder) to measure Q precisely. No credit for 'use a more precise thermometer' \u2014 the standard thermometer already reads to the needed 0.5\u00b0C.\", \"err\": \"'Use a digital/more precise thermometer' was the single most common wrong answer across the whole class \u2014 it isn't a real source of error here.\", \"ex\": [{\"s\": \"1300\", \"w\": \"Use a more precise thermometer\", \"y\": \"the standard thermometer already reads to the needed 0.5\u00b0C \u2014 this isn't a real source of error\", \"c\": \"Use a burette (not a measuring cylinder) to measure Q precisely\"}, {\"s\": \"1297\", \"w\": \"Burette under conical flask; add NaOH dropwise to an end point\", \"y\": \"wrong apparatus/technique \u2014 there's no flask or titration end point in this experiment\", \"c\": \"Use a burette (not a measuring cylinder) to measure Q precisely\"}, {\"s\": \"1289\", \"w\": \"Use smaller increments of P/Q; switch off fans in the room\", \"y\": \"neither matches the 3 scheme-accepted improvements\", \"c\": \"Lid on cup / repeat & average / use a burette for Q\"}]}]}, {\"id\": \"Q2\", \"tab\": \"Question 2\", \"name\": \"Question 2 \u2014 Solid R (NaHCO\u2083 + NaCl mixture)\", \"parts\": [{\"t\": \"2(a)(i) Mass table\", \"m\": 4, \"fac\": 91, \"ans\": \"A results table recorded to the nearest 0.01 g, with units, showing: the mass of the empty tube (or tube + contents before heating), and the mass after heating.\", \"err\": \"Missing units, wrong precision (1 d.p. instead of 2), or recording the mass loss instead of the actual tube+residue reading.\", \"ex\": [{\"s\": \"1288\", \"w\": \"table with no units on any recorded mass\", \"y\": \"the scheme requires units shown throughout the table\", \"c\": \"label all masses in g\"}, {\"s\": \"1295\", \"w\": \"results as single values, mass before heating given to 1 d.p. only (1.5 g)\", \"y\": \"precision needed is the nearest 0.01 g, e.g. 1.50 g\", \"c\": \"record all masses to 2 decimal places\"}, {\"s\": \"1297\", \"w\": \"mass after heating recorded as 0.60 g\", \"y\": \"that's the mass loss, not the actual tube+residue reading after heating\", \"c\": \"record the actual tube + residue mass (~16.60 g)\"}]}, {\"t\": \"2(a)(ii) Mass of R before heating + change in mass\", \"m\": 2, \"fac\": 78, \"ans\": \"Mass of R before heating = mass(tube+R) \u2212 mass(empty tube). Change in mass = mass before heating \u2212 mass after heating. ECF from own table.\", \"err\": \"Forgetting to subtract the empty-tube mass, or a final answer that doesn't actually follow from the student's own table.\", \"ex\": [{\"s\": \"1288\", \"w\": \"mass of R before heating given as 15.45 g\", \"y\": \"that's the tube+contents mass \u2014 the tube mass (13.57 g) was never subtracted\", \"c\": \"15.45 \u2212 13.57 = 1.88 g\"}, {\"s\": \"1290\", \"w\": \"wrote 15.37 g and 14.94 g directly, with no subtraction\", \"y\": \"both values need the empty-tube mass subtracted first\", \"c\": \"mass R = 15.37 \u2212 13.87 = 1.50 g; change = 15.37 \u2212 14.94 = 0.43 g\"}, {\"s\": \"1311\", \"w\": \"mass of R before heating = 1.51 g\", \"y\": \"her own data gives 15.42 \u2212 14.2 = 1.22 g, not 1.51 g\", \"c\": \"1.22 g, from her own recorded masses\"}]}, {\"t\": \"2(b)(i) Mass of NaHCO\u2083 present\", \"m\": 2, \"fac\": 42, \"ans\": \"Mass NaHCO\u2083 = mass loss \u00d7 (168/62), using the ratio of Mr(2\u00d7NaHCO\u2083) : Mr(CO\u2082+H\u2082O). ECF from own mass loss in (a)(ii).\", \"err\": \"By far the most common mistake: treating the whole mass loss as CO\u2082 only (ignoring that H\u2082O is also lost), which skips the \u00d7(168/62) ratio entirely.\", \"ex\": [{\"s\": \"1291\", \"w\": \"treated the entire 0.38 g mass loss as CO2 only\", \"y\": \"the equation shows H2O is also lost on heating, not just CO2\", \"c\": \"mass NaHCO3 = mass loss \u00d7 (168/62) = 1.03 g\"}, {\"s\": \"1294\", \"w\": \"0.00839 \u00d7 84 = 0.7 g\", \"y\": \"missing a factor of 2 in the NaHCO3 stoichiometry\", \"c\": \"0.00839 \u00d7 168 = 1.41 g\"}, {\"s\": \"1305\", \"w\": \"used a combined-gas : NaHCO3 ratio of 2:1, giving 0.271 g\", \"y\": \"the ratio is inverted \u2014 it should be NaHCO3 : combined-gas = 2:1, not the reverse\", \"c\": \"mass loss \u00d7 (168/62) = 0.4 \u00d7 2.71 = 1.08 g\"}]}, {\"t\": \"2(b)(ii) Percentage by mass of NaHCO\u2083 in R\", \"m\": 2, \"fac\": 45, \"ans\": \"% = (mass NaHCO\u2083 \u00f7 mass R before heating) \u00d7 100, given to 3 s.f. ECF from (b)(i). Values over 100% usually flag a measurement error in the student's own raw data \u2014 this doesn't lose the method mark if the arithmetic from their own figures is correct.\", \"err\": \"Inverting the formula, or the mark being blocked by a wrong-method answer already carried in from (b)(i).\", \"ex\": [{\"s\": \"1302\", \"w\": \"% = 1.5 \u00f7 1.64 \u00d7 100 = 91.4%\", \"y\": \"the formula is inverted, and 1.5 isn't even her own mass-of-R figure\", \"c\": \"% = mass NaHCO3 \u00f7 mass R before heating \u00d7 100\"}, {\"s\": \"1309\", \"w\": \"40.2%, using the wrong-method mass carried from (b)(i)\", \"y\": \"this is blocked by the (b)(i) wrong-method error, per the ECF rule\", \"c\": \"0.434 \u00f7 1.52 \u00d7 100 = 28.6% (3 s.f.), once (b)(i) is corrected\"}, {\"s\": \"1320\", \"w\": \"74%\", \"y\": \"the method is correct, but the answer isn't given to 3 significant figures\", \"c\": \"74.1% to 3 significant figures\"}]}, {\"t\": \"2(c)(i) Why one 3-minute heating may be inaccurate\", \"m\": 1, \"fac\": 90, \"ans\": \"Not all the NaHCO\u2083 may have fully decomposed in that time.\", \"err\": \"Confusing this with water not fully evaporating, rather than the NaHCO\u2083 itself not fully decomposing.\", \"ex\": [{\"s\": \"1305\", \"w\": \"not all the water may have evaporated, water left in the tube\", \"y\": \"wrong concept \u2014 the question is about NaHCO3 decomposing, not water evaporating\", \"c\": \"not all the NaHCO3 may have fully decomposed\"}, {\"s\": \"1307\", \"w\": \"the flame may not reach 100\u00b0C, so water isn't fully evaporated\", \"y\": \"this is a different concept to 'NaHCO3 not fully decomposed'\", \"c\": \"not all the NaHCO3 may have fully decomposed\"}, {\"s\": \"1294\", \"w\": \"water left in the tube makes the result inaccurate\", \"y\": \"wrong reason \u2014 the scheme wants incomplete decomposition of the solid, not residual water\", \"c\": \"not all the NaHCO3 may have fully decomposed\"}]}, {\"t\": \"2(c)(ii) How to improve accuracy\", \"m\": 1, \"fac\": 15, \"ans\": \"Heat, cool, and reweigh repeatedly until a constant mass is obtained.\", \"err\": \"One of the two worst-scoring parts on the paper \u2014 nearly everyone wrote 'heat for longer' or 'repeat and average' instead of the specific heat-cool-reweigh-to-constant-mass cycle.\", \"ex\": [{\"s\": \"1288\", \"w\": \"heat the sample for ten minutes\", \"y\": \"a fixed longer heating time doesn't confirm that decomposition is actually complete\", \"c\": \"heat, cool, reweigh repeatedly to constant mass\"}, {\"s\": \"1305\", \"w\": \"repeat the experiment 3 times and average the 3 results\", \"y\": \"repeating separate experiments isn't the same as the reweigh-to-constant-mass cycle\", \"c\": \"heat, cool, reweigh repeatedly until a constant mass is obtained\"}, {\"s\": \"1309\", \"w\": \"use a gas syringe / electronic balance instead\", \"y\": \"this misses the required heat-cool-reweigh-to-constant-mass cycle entirely\", \"c\": \"heat, cool, reweigh repeatedly until constant mass\"}]}, {\"t\": \"2(d) Observations: S + dilute HNO\u2083\", \"m\": 3, \"fac\": 68, \"ans\": \"Any 3 of: (1) white solid S reacts with dilute nitric acid to form a colourless solution, (2) bubbles/effervescence produced, (3) the gas turns limewater a white precipitate/milky (must specifically describe testing the gas with limewater), (4) gas identified as carbon dioxide. Claiming a precipitate forms directly from S + acid contradicts point 1 and earns no credit.\", \"err\": \"Claiming a white precipitate forms directly with the acid (contradicting the colourless-solution observation), or leaving out the limewater test and CO2 naming.\", \"ex\": [{\"s\": \"1297\", \"w\": \"effervescence, and a white precipitate forms\", \"y\": \"S + acid gives a colourless solution, not a precipitate \u2014 that only appears with the separate limewater test\", \"c\": \"bubble the gas through limewater \u2014 it turns milky/white\"}, {\"s\": \"1301\", \"w\": \"bubble the gas into limewater (only line written)\", \"y\": \"no reaction, effervescence, result, or gas identification stated\", \"c\": \"effervescence, colourless solution; gas turns limewater milky = CO2\"}, {\"s\": \"1321\", \"w\": \"burning splint extinguished over the test-tube mouth\", \"y\": \"this is not the limewater test, and the gas is never named CO2\", \"c\": \"colourless solution, bubbles, gas turns limewater milky\"}]}, {\"t\": \"2(e)(i) S-solution + AgNO\u2083\", \"m\": 1, \"fac\": 95, \"ans\": \"White precipitate formed (confirms chloride).\", \"err\": \"The rare wrong answers said no visible change at all.\", \"ex\": [{\"s\": \"1311\", \"w\": \"no precipitate formed\", \"y\": \"AgNO3 + chloride gives a white precipitate \u2014 this is the opposite of what should be seen\", \"c\": \"white precipitate formed (confirms chloride)\"}, {\"s\": \"1312\", \"w\": \"no visible change with silver nitrate\", \"y\": \"should show a white precipitate, confirming chloride is present\", \"c\": \"white precipitate formed with AgNO3\"}]}, {\"t\": \"2(e)(ii) S-solution + Ba(NO\u2083)\u2082\", \"m\": 1, \"fac\": 79, \"ans\": \"No observable change (confirms no sulfate present).\", \"err\": \"Wrongly predicting a white precipitate, as if by pattern-matching to the AgNO3 test in (e)(i).\", \"ex\": [{\"s\": \"1288\", \"w\": \"milky-white precipitate forms, increasing in depth\", \"y\": \"this contradicts the expected result and implies sulfate is present when it isn't\", \"c\": \"no observable change (confirms no sulfate)\"}, {\"s\": \"1296\", \"w\": \"crossed out the correct answer and wrote 'white precipitate forms' instead\", \"y\": \"the original answer was actually right \u2014 there should be no change, since no sulfate is present\", \"c\": \"no observable change\"}, {\"s\": \"1309\", \"w\": \"claims a white precipitate forms with Ba(NO3)2\", \"y\": \"wrong observation \u2014 there should be no visible change here\", \"c\": \"no observable change \u2014 confirms no sulfate present\"}]}, {\"t\": \"2(f) Identify the impurity\", \"m\": 1, \"fac\": 54, \"ans\": \"Sodium chloride / NaCl \u2014 confirmed by the (e)(i) and (e)(ii) tests.\", \"err\": \"Naming a decomposition product, an ion instead of the compound, or an unrelated substance rather than reasoning from the (e) test results.\", \"ex\": [{\"s\": \"1291\", \"w\": \"sodium carbonate\", \"y\": \"that's the decomposition product of NaHCO3, not the impurity confirmed by the (e) tests\", \"c\": \"sodium chloride \u2014 shown by the (e)(i)/(e)(ii) tests\"}, {\"s\": \"1310\", \"w\": \"chlorine\", \"y\": \"chlorine (Cl2) is not the same as chloride \u2014 the compound name is needed\", \"c\": \"sodium chloride / NaCl\"}, {\"s\": \"1314\", \"w\": \"carbon dioxide\", \"y\": \"that's the decomposition gas, not the impurity present in R\", \"c\": \"sodium chloride (confirmed by the AgNO3 white precipitate)\"}]}, {\"t\": \"2(g)(i) Why excess acid is added before (e)\", \"m\": 1, \"fac\": 79, \"ans\": \"To remove carbonate (and/or hydroxide) ions that may interfere with the anion tests in (e).\", \"err\": \"Vague answers about 'ensuring full reaction' without naming the specific ions being removed.\", \"ex\": [{\"s\": \"1291\", \"w\": \"to produce salt/water/CO2, to prepare to test for CO2\", \"y\": \"doesn't address removing carbonate/hydroxide ions before (e)\", \"c\": \"removes carbonate/hydroxide ions that interfere with (e)\"}, {\"s\": \"1295\", \"w\": \"to ensure full reaction of the nitric acid\", \"y\": \"too vague \u2014 doesn't mention the carbonate/hydroxide ions being removed\", \"c\": \"removes carbonate/hydroxide ions interfering with the tests\"}, {\"s\": \"1316\", \"w\": \"the AgNO3/Ba(NO3)2 reagents must be acidified first\", \"y\": \"reasoning is about the test reagents, not about removing ions from S itself\", \"c\": \"removes carbonate/hydroxide ions from S itself\"}]}, {\"t\": \"2(g)(ii) Why nitric acid rather than HCl/H\u2082SO\u2084\", \"m\": 1, \"fac\": 15, \"ans\": \"Using HCl or H2SO4 would introduce Cl\u207b or SO4\u00b2\u207b ions, which would interfere with (give false positives in) the anion tests in (e). No credit for 'nitric acid is a weak acid' \u2014 HNO3 is a strong acid.\", \"err\": \"The other worst-scoring part on the paper. Two recurring misconceptions: calling nitric acid 'weak' (it's strong), or a bare 'nitrate salts are soluble' claim never linked to the anion tests.\", \"ex\": [{\"s\": \"1286\", \"w\": \"nitric acid is a weaker acid than HCl\", \"y\": \"nitric acid is a strong acid, not weaker \u2014 this is factually wrong\", \"c\": \"HCl/H2SO4 add Cl\u207b/SO4\u00b2\u207b ions that interfere with the tests in (e)\"}, {\"s\": \"1297\", \"w\": \"nitric acid is weak, partially dissociates\", \"y\": \"nitric acid is a strong acid \u2014 this reasoning is factually wrong\", \"c\": \"HCl/H2SO4 add Cl\u207b/SO4\u00b2\u207b ions interfering with the tests\"}, {\"s\": \"1289\", \"w\": \"all salts formed with nitrate ions are soluble\", \"y\": \"a true fact, but never linked to why it prevents interference with the anion tests in (e)\", \"c\": \"HCl/H2SO4 add Cl\u207b/SO4\u00b2\u207b ions that interfere with (e)\"}]}]}, {\"id\": \"Q3\", \"tab\": \"Question 3\", \"name\": \"Question 3 \u2014 Preparing NaHSO\u2084 crystals\", \"parts\": [{\"t\": \"3 Outline a method to prepare crystals of NaHSO\u2084\", \"m\": 4, \"fac\": 50, \"ans\": \"1 mark each: (1) pipette a measured 25.0 cm\u00b3 of 1.0 mol/dm\u00b3 H2SO4 into a conical flask, add a suitable indicator (e.g. methyl orange); (2) titrate with NaOH to the end point and record the volume used (V1); (3) react 25.0 cm\u00b3 of the acid with HALF (V1/2) of that NaOH volume, with no indicator this time, to form NaHSO4 \u2014 the 'half' detail is essential, no credit without it even if the repeat is otherwise well described; (4) heat to get a hot saturated solution, cool to crystallise, then filter and dry the crystals.\", \"err\": \"By far the most common gap: describing the repeat reaction using the FULL titration volume rather than HALF of it \u2014 this gives Na2SO4, not NaHSO4.\", \"ex\": [{\"s\": \"1296\", \"w\": \"mixed acid and NaOH directly with no titration step, then evaporated until all liquid was gone\", \"y\": \"no titration/indicator/end point to find V1 at all, no half-volume step, and evaporating to dryness loses the crystals\", \"c\": \"titrate for V1 first, react with V1/2, then heat to saturation, cool, filter and dry\"}, {\"s\": \"1307\", \"w\": \"used a universal indicator, counted drops, then vaguely said 'less NaOH' with no filtering step\", \"y\": \"universal indicator has no sharp end point, no V1 volume was recorded, the half-volume detail is missing, and there's no filtration\", \"c\": \"use a suitable single-colour-change indicator, record V1, react with V1/2, then filter and dry\"}, {\"s\": \"1291\", \"w\": \"used a universal indicator for the titration, then repeated the reaction but left out the half-volume step\", \"y\": \"universal indicator has no sharp single-colour end point, and the essential V1/2 detail is still missing\", \"c\": \"use methyl orange (a sharp-end-point indicator); react with exactly V1/2 of NaOH\"}]}]}]}; const GOOD=CFG.good, MIXED=CFG.mixed;\nfunction band(f){if(f===null||f===undefined)return{cls:\"b-na\",lab:\"Not assessed\"};if(f>=GOOD)return{cls:\"b-good\",lab:\"Did well \"+f+\"%\"};if(f>=MIXED)return{cls:\"b-mix\",lab:\"Mixed \"+f+\"%\"};return{cls:\"b-bad\",lab:\"Struggled \"+f+\"%\"};}\nfunction fc(f){return f>=GOOD?\"var(--good)\":f>=MIXED?\"var(--mix)\":\"var(--bad)\";}\n// tabs\nlet tabsH='<button class=\"tab active\" data-p=\"ov\">\ud83d\udcca Overview</button>';\nCFG.questions.forEach((q,i)=>{tabsH+=`<button class=\"tab\" data-p=\"${q.id}\">${q.tab||q.id}</button>`;});\ntabsH+='<button class=\"btn\" id=\"toggleAll\">Reveal all answers</button>';\ndocument.getElementById(\"tabs\").innerHTML=tabsH;\n// question pages\nlet idc=0, pagesH=\"\";\nCFG.questions.forEach(q=>{\n  let h=`<div class=\"page\" id=\"${q.id}\"><div class=\"card\"><div class=\"qtag\">${q.name}</div></div>`;\n  q.parts.forEach(p=>{const b=band(p.fac);const id=\"a\"+(idc++);\n    h+=`<div class=\"card\"><div class=\"qhead\"><div><span class=\"qtag\">${p.t}</span> <span class=\"marks\">[${p.m}]</span></div><span class=\"badge ${b.cls}\">${b.lab}</span></div>\n      <button class=\"reveal\" onclick=\"tog('${id}',this,0)\">Reveal model answer</button>\n      <div class=\"answer\" id=\"${id}\"><h4>Model answer</h4><div>${p.ans}</div>${p.err?`<div class=\"err\"><b>Common slip:</b> ${p.err}</div>`:``}</div>`;\n    if(p.ex&&p.ex.length){h+=`<button class=\"reveal ex-btn\" onclick=\"tog('${id}x',this,1)\">\ud83d\udd0d Class examples (${p.ex.length})</button>\n      <div class=\"examples\" id=\"${id}x\" data-n=\"${p.ex.length}\">`+p.ex.map(e=>{const xid=\"x\"+(idc++);return `<div class=\"exrow\">${e.s?`<div class=\"exlab\">Script ${e.s}</div>`:``}\n        <div class=\"strip w\">\u270d\ufe0f <b>Wrote:</b> ${e.w}</div>\n        <button class=\"reveal why-btn\" onclick=\"togWhy('${xid}',this)\">\ud83e\udd14 What's wrong with this?</button>\n        <div class=\"whywrap\" id=\"${xid}\"><div class=\"strip y\">\u274c <b>Why it\u2019s wrong:</b> ${e.y}</div><div class=\"strip c\">\u2705 <b>Model answer:</b> ${e.c}</div></div></div>`;}).join(\"\")+`</div>`;}\n    h+=`</div>`;});\n  h+=`</div>`; pagesH+=h;\n});\ndocument.getElementById(\"qpages\").innerHTML=pagesH;\nfunction tog(id,btn,isEx){const a=document.getElementById(id);const s=a.classList.toggle(\"show\");\n  if(isEx)btn.textContent=s?\"Hide class examples\":(\"\ud83d\udd0d Class examples (\"+a.dataset.n+\")\");else btn.textContent=s?\"Hide model answer\":\"Reveal model answer\";}\n// Staged exemplar reveal: the \u270d\ufe0f Wrote strip is always visible; the \u274c why + \u2705 model answer\n// stay hidden behind this button so the class can discuss each exemplar before the reveal.\nfunction togWhy(id,btn){const a=document.getElementById(id);const s=a.classList.toggle(\"show\");\n  btn.textContent=s?\"Hide explanation\":\"\ud83e\udd14 What's wrong with this?\";}\n// overview\n(function(){const all=[];CFG.questions.forEach(q=>q.parts.forEach(p=>{if(p.fac!==null&&p.fac!==undefined)all.push({t:p.t,f:p.fac,err:p.err});}));\n  const good=all.filter(x=>x.f>=GOOD).sort((a,b)=>b.f-a.f),bad=all.filter(x=>x.f<MIXED).sort((a,b)=>a.f-b.f),mix=all.filter(x=>x.f>=MIXED&&x.f<GOOD).sort((a,b)=>a.f-b.f);\n  let h=`<div class=\"card\"><div class=\"qtag\">\ud83d\udcca How the class did</div><p class=\"note\">${CFG.avg?(\"Average <b>\"+CFG.avg+\"</b>. \"):\"\"}Green = strong, red = needs re-teaching.</p>\n    <div class=\"board\"><div class=\"col g\"><h3>\u2705 Done well</h3><ul>${good.map(x=>`<li>${x.t} <span class=\"chip\">${x.f}%</span></li>`).join(\"\")}</ul></div>\n    <div class=\"col b\"><h3>\u26a0\ufe0f Struggled \u2014 re-teach</h3><ul>${bad.map(x=>`<li>${x.t} <span class=\"chip\">${x.f}%</span><br><span class=\"note\">${x.err||\"\"}</span></li>`).join(\"\")}</ul></div></div></div>`;\n  h+=`<div class=\"card\"><div class=\"qtag\">Facility by part <span class=\"note\">(% of marks earned)</span></div><div>`;\n  all.forEach(x=>{h+=`<div class=\"row\"><div class=\"lab\">${x.t.split(\" \")[0]}</div><div class=\"track\"><div class=\"fill\" style=\"width:${Math.max(x.f,8)}%;background:${fc(x.f)}\">${x.f}%</div></div></div>`;});\n  h+=`</div><div class=\"legend\">\ud83d\udfe2 \u2265${GOOD}% did well&nbsp;&nbsp;\ud83d\udfe1 ${MIXED}\u2013${GOOD-1}% mixed&nbsp;&nbsp;\ud83d\udd34 &lt;${MIXED}% struggled</div></div>`;\n  if(mix.length)h+=`<div class=\"card\"><div class=\"qtag\">\ud83d\udfe1 In between</div><ul>${mix.map(x=>`<li>${x.t} <span class=\"chip\">${x.f}%</span></li>`).join(\"\")}</ul></div>`;\n  document.getElementById(\"ov\").innerHTML=h;})();\n// tab switching + reveal all\ndocument.querySelectorAll(\".tab\").forEach(t=>t.addEventListener(\"click\",()=>{document.querySelectorAll(\".tab\").forEach(x=>x.classList.remove(\"active\"));document.querySelectorAll(\".page\").forEach(x=>x.classList.remove(\"active\"));t.classList.add(\"active\");document.getElementById(t.dataset.p).classList.add(\"active\");window.scrollTo({top:0,behavior:\"smooth\"});}));\nlet allShown=false;document.getElementById(\"toggleAll\").addEventListener(\"click\",function(){allShown=!allShown;document.querySelectorAll(\".answer\").forEach(a=>a.classList.toggle(\"show\",allShown));document.querySelectorAll(\".reveal:not(.ex-btn)\").forEach(b=>b.textContent=allShown?\"Hide model answer\":\"Reveal model answer\");this.textContent=allShown?\"Hide all answers\":\"Reveal all answers\";});\n<\/script></body></html>";
document.getElementById("t2020").srcdoc = "<!DOCTYPE html><html lang=\"en\"><head><meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"><title>\u2697\ufe0f 2020 Practical Paper 3 \u2014 Review Walkthrough</title>\n<link href=\"https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap\" rel=\"stylesheet\">\n<style>\n:root{--bg:#f0f4ff;--card:#fff;--ink:#1a1a2e;--pink:#ffb3c6;--purple:#c9b8f0;--teal:#b2e8e0;--mint:#c3f0d4;--yellow:#fff1b0;\n--good:#3aa76d;--goodbg:#e5f6ec;--mix:#c9962b;--mixbg:#fff6df;--bad:#d9556b;--badbg:#fce8ec;--na:#9aa0b3;--nabg:#eef0f6;}\n*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito',sans-serif;line-height:1.55}\n.wrap{max-width:960px;margin:0 auto;padding:16px}header{text-align:center;padding:18px 12px 6px}\nh1{font-family:'Fredoka One',cursive;font-size:clamp(1.5rem,5vw,2.3rem);margin:0;color:#5b4b8a}\n.sub{font-weight:700;color:#6a6f85;margin-top:4px;font-size:.95rem}.credit{font-style:italic;color:#8b6fc7;font-size:.8rem;margin-top:6px}\n.bar-top{position:sticky;top:0;z-index:20;background:rgba(240,244,255,.92);backdrop-filter:blur(6px);display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:10px;margin:8px 0;border-radius:16px}\n.tab,.btn,.reveal{font-family:'Nunito';font-weight:800;color:var(--ink);cursor:pointer;min-height:44px;transition:transform .05s,box-shadow .05s}\n.tab{background:#fff;border:2px solid var(--purple);box-shadow:0 4px 0 var(--purple);border-radius:12px;padding:9px 16px;font-size:.95rem}\n.tab:active{transform:translateY(4px);box-shadow:0 0 0 var(--purple)}.tab.active{background:var(--purple)}\n.btn{background:#fff;border:2px solid var(--purple);box-shadow:0 4px 0 var(--purple);border-radius:12px;padding:9px 16px;font-weight:700}\n.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--purple)}\n.page{display:none}.page.active{display:block}\n.card{background:var(--card);border-radius:18px;box-shadow:0 4px 12px rgba(0,0,0,.08);padding:16px 18px;margin:14px 0}\n.qhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}\n.qtag{font-family:'Fredoka One';color:#5b4b8a;font-size:1.05rem}.marks{font-weight:800;color:#6a6f85;font-size:.85rem}\n.badge{font-weight:800;font-size:.8rem;padding:4px 10px;border-radius:999px;white-space:nowrap}\n.b-good{background:var(--goodbg);color:var(--good)}.b-mix{background:var(--mixbg);color:var(--mix)}.b-bad{background:var(--badbg);color:var(--bad)}.b-na{background:var(--nabg);color:var(--na)}\n.reveal{background:#fff;border:2px solid var(--teal);box-shadow:0 4px 0 var(--teal);border-radius:12px;font-weight:700;padding:8px 14px;margin-top:8px}\n.reveal:active{transform:translateY(4px);box-shadow:0 0 0 var(--teal)}\n.reveal.ex-btn{border-color:var(--pink);box-shadow:0 4px 0 var(--pink)}.reveal.ex-btn:active{box-shadow:0 0 0 var(--pink)}\n.answer,.examples{display:none}.answer.show,.examples.show{display:block}\n.answer{margin-top:12px;background:#f7f9ff;border-left:6px solid var(--purple);border-radius:10px;padding:12px 14px}\n.answer h4{margin:.2rem 0 .4rem;color:#5b4b8a;font-family:'Fredoka One';font-weight:400;font-size:.95rem}\n.err{margin-top:10px;background:var(--badbg);border-radius:10px;padding:10px 12px;font-size:.92rem}.err b{color:var(--bad)}\n.examples{margin-top:10px}\n.exrow{border:1px solid #eef0f6;border-radius:12px;padding:10px;margin:10px 0;background:#fcfdff}\n.exlab{font-weight:800;color:#6a6f85;font-size:.78rem;margin-bottom:6px}\n.strip{border-radius:8px;padding:7px 10px;margin:5px 0;font-size:.92rem}\n.strip.w{background:var(--badbg)}.strip.y{background:var(--mixbg)}.strip.c{background:var(--goodbg)}\n.chip{display:inline-block;background:var(--nabg);border-radius:8px;padding:1px 7px;font-size:.8rem;font-weight:700;margin-left:4px}\n.board{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:640px){.board{grid-template-columns:1fr}}\n.col{border-radius:16px;padding:14px 16px}.col.g{background:var(--goodbg)}.col.b{background:var(--badbg)}\n.col h3{margin:.2rem 0 .6rem;font-family:'Fredoka One';font-weight:400}.col.g h3{color:var(--good)}.col.b h3{color:var(--bad)}\n.col ul{margin:0;padding-left:18px}.col li{margin:5px 0}\n.row{display:flex;align-items:center;gap:8px;margin:7px 0}.row .lab{flex:0 0 92px;font-weight:700;font-size:.85rem}\n.track{flex:1;background:#eef0f6;border-radius:999px;height:20px;overflow:hidden}\n.fill{height:100%;border-radius:999px;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;color:#fff;font-weight:800;font-size:.72rem}\n.legend,.note{font-size:.83rem;color:#6a6f85;margin-top:8px}\nfooter{text-align:center;color:#9aa0b3;font-size:.8rem;padding:20px}\n</style></head><body><div class=\"wrap\">\n<header><h1>\u2697\ufe0f 2020 Practical Paper 3 \u2014 Review Walkthrough</h1><div class=\"sub\">Model answers, class performance &amp; real examples | O-Level Chemistry 6092 | Evergreen Secondary School</div><div class=\"credit\">Created by Ms Teng</div></header>\n<div class=\"bar-top\" id=\"tabs\"></div>\n<div id=\"ov\" class=\"page active\"></div>\n<div id=\"qpages\"></div>\n<footer>Class data from 32 fully-marked scripts. Examples are anonymised \u2014 the script number lets you pull the paper.</footer></div>\n<script>\nconst CFG={\"title\": \"\u2697\ufe0f 2020 Practical Paper 3 \u2014 Review Walkthrough\", \"subtitle\": \"Model answers, class performance &amp; real examples | O-Level Chemistry 6092 | Evergreen Secondary School\", \"credit\": \"Created by Ms Teng\", \"avg\": \"21 / 30 on the marked section (Q1c\u2013Q3)\", \"note\": \"Class data from 32 fully-marked scripts. Examples are anonymised \u2014 the script number lets you pull the paper.\", \"good\": 75, \"mixed\": 60, \"questions\": [{\"id\": \"Q1\", \"tab\": \"Question 1\", \"name\": \"Question 1 \u2014 Titration &amp; relative molecular mass\", \"parts\": [{\"t\": \"1(a) Titration results\", \"m\": 5, \"fac\": null, \"ans\": \"Marks: results table with correct <b>headings and units</b>; burette readings to <b>0.05 cm\u00b3</b>; at least <b>two titres within 0.20 cm\u00b3</b>; average titre within <b>\u00b10.20 cm\u00b3</b> (accuracy, 2).\"}, {\"t\": \"1(a)(ii) Average volume of P\", \"m\": 1, \"fac\": null, \"ans\": \"Average of concordant titres, working shown: (17.70 + 17.70) \u00f7 2 = <b>17.70 cm\u00b3</b>.\"}, {\"t\": \"1(b)(i) Moles of sulfamic acid in 25.0 cm\u00b3\", \"m\": 1, \"fac\": null, \"ans\": \"moles NaOH = 0.200 \u00d7 (17.70 \u00f7 1000) = <b>0.00354 mol</b>; ratio 1 : 1 \u2192 same moles of acid.\"}, {\"t\": \"1(b)(ii) Concentration in the cleaning product\", \"m\": 3, \"fac\": null, \"ans\": \"0.00354 \u00f7 0.0250 = 0.142 mol/dm\u00b3, then \u00d710 (dilution) \u2192 <b>1.42 mol/dm\u00b3</b>. Both to 3 s.f.\"}, {\"t\": \"1(c)(i) Method to find Mr (collect CO\u2082 over water)\", \"m\": 5, \"fac\": 85, \"ans\": \"Weigh solid acid on a balance; add to <b>excess</b> sodium carbonate, stopper immediately; collect gas over water, read V when the reaction stops. <b>moles CO\u2082 = V \u00f7 24 000</b>; moles acid = 2 \u00d7 moles CO\u2082; <b>Mr = mass \u00f7 moles</b>.\", \"err\": \"Most-dropped mark: not turning the gas volume into moles (\u00f7 24 000) before the mole ratio.\", \"ex\": [{\"s\": \"1212\", \"w\": \"\u201cmoles CO\u2082 = volume \u00f7 molecular mass\u201d\", \"y\": \"Divided by molecular mass, not the molar gas volume.\", \"c\": \"moles CO\u2082 = volume \u00f7 24 000 cm\u00b3\"}, {\"s\": \"1240\", \"w\": \"\u201cdivided the CO\u2082 volume by its Mr (44)\u201d\", \"y\": \"44 is the Mr of CO\u2082, not the molar volume.\", \"c\": \"moles CO\u2082 = volume \u00f7 24 000 cm\u00b3\"}, {\"s\": \"1234\", \"w\": \"\u201cmultiply moles with Ar to find Mr\u201d\", \"y\": \"Mr = mass \u00f7 moles, not moles \u00d7 Ar.\", \"c\": \"Mr = mass \u00f7 moles of acid\"}]}, {\"t\": \"1(c)(ii) Effect of CO\u2082 dissolving in water\", \"m\": 3, \"fac\": 52, \"ans\": \"Less gas collected \u2192 fewer moles of gas \u2192 fewer moles of acid. Since Mr = mass \u00f7 moles and mass is unchanged, the calculated Mr is <b>HIGHER</b>.\", \"err\": \"Half the class said \u2018lower\u2019 or just \u2018inaccurate\u2019.\", \"ex\": [{\"s\": \"1212\", \"w\": \"\u201cthe Mr will be lower than it should be\u201d\", \"y\": \"Fewer moles on the bottom of mass \u00f7 moles makes Mr bigger.\", \"c\": \"The calculated Mr is higher.\"}, {\"s\": \"1216\", \"w\": \"\u201cthe calculated Mr will be lower\u201d\", \"y\": \"Wrong direction \u2014 same reasoning slip.\", \"c\": \"The calculated Mr is higher.\"}, {\"s\": \"1213\", \"w\": \"\u201cthe Mr value will be inaccurate\u201d\", \"y\": \"No direction given \u2014 must state higher.\", \"c\": \"The calculated Mr is higher.\"}]}, {\"t\": \"1(c)(iii) One improvement\", \"m\": 1, \"fac\": 73, \"ans\": \"Use a <b>gas syringe</b> \u2014 the gas never touches the water so none can dissolve \u2192 accurate volume.\", \"err\": \"Explanation should be about the gas not dissolving in water.\", \"ex\": [{\"s\": \"1230\", \"w\": \"\u201cadd a lid to stop the water evaporating\u201d\", \"y\": \"The problem is CO\u2082 dissolving, not evaporation.\", \"c\": \"Use a gas syringe so the gas avoids water.\"}, {\"s\": \"1234\", \"w\": \"\u201ccollect the CO\u2082 by air displacement\u201d\", \"y\": \"Does not ensure an accurate gas volume.\", \"c\": \"Use a gas syringe \u2014 no water contact.\"}, {\"s\": \"1244\", \"w\": \"\u201cuse NaOH; it forms hydrogen gas\u201d\", \"y\": \"Changes the chemistry; NaOH gives no CO\u2082.\", \"c\": \"Use a gas syringe.\"}]}]}, {\"id\": \"Q2\", \"tab\": \"Question 2\", \"name\": \"Question 2 \u2014 Qualitative analysis of R and S\", \"parts\": [{\"t\": \"2(a) Tests on R and S\", \"m\": 8, \"fac\": 69, \"ans\": \"<b>Test 1</b>: R effervescence, gas forms a white ppt with limewater (CO\u2082), dissolves to a light blue solution; S dissolves to a light blue solution. <b>Test 2</b> (ammonia): light blue ppt, soluble in excess to dark blue solution. <b>Test 3</b> (NaOH): light blue ppt, insoluble in excess. <b>Test 4</b> (barium nitrate): white ppt. <b>Test 5</b> (silver nitrate on filtrate): R no ppt (stays light blue); S white ppt.\", \"err\": \"BaSO\u2084 ppt is WHITE; Cu(OH)\u2082 is INSOLUBLE in excess NaOH (soluble is ammonia); R no observable change; record the light-blue solution and the filtration.\", \"ex\": [{\"s\": \"1245\", \"w\": \"barium nitrate gives a \u201clight blue precipitate\u201d; NaOH copper ppt \u201cdissolves\u201d\", \"y\": \"Barium sulfate is white; copper ppt is insoluble in excess NaOH.\", \"c\": \"White ppt with barium nitrate; light blue ppt insoluble in excess NaOH.\"}, {\"s\": \"1213\", \"w\": \"ammonia gives a \u201cwhite ppt, insoluble \u2192 aluminium\u201d\", \"y\": \"That is aluminium; copper gives light blue ppt, soluble in excess.\", \"c\": \"Light blue ppt, dissolves in excess to a dark blue solution.\"}, {\"s\": \"1221\", \"w\": \"\u201cS dissolves to a green solution\u201d\", \"y\": \"Copper(II) gives a light blue solution, not green.\", \"c\": \"Dissolves to a light blue solution.\"}]}, {\"t\": \"2(b) Compound common to R and S\", \"m\": 2, \"fac\": 80, \"ans\": \"<b>Copper(II) sulfate</b> \u2014 copper(II) from NaOH ppt insoluble in excess; sulfate from the white ppt with barium nitrate.\", \"err\": \"The common compound is the sulfate, not chloride (chloride is only in S).\", \"ex\": [{\"s\": \"1212\", \"w\": \"\u201ccopper(II) chloride\u201d; copper shown by ammonia ppt insoluble\", \"y\": \"Chloride is only in S; ammonia ppt is soluble, not insoluble.\", \"c\": \"Copper(II) sulfate.\"}, {\"s\": \"1242\", \"w\": \"\u201ccopper(II) chloride\u201d\", \"y\": \"Chloride is not common to both R and S.\", \"c\": \"Copper(II) sulfate.\"}, {\"s\": \"1213\", \"w\": \"\u201ccopper \u2014 ammonia gives a ppt insoluble in excess\u201d\", \"y\": \"With ammonia the copper ppt is soluble (dark blue).\", \"c\": \"Copper from NaOH ppt insoluble in excess.\"}]}, {\"t\": \"2(c) Other compound in R\", \"m\": 2, \"fac\": 50, \"ans\": \"<b>Sodium carbonate</b>. R is a Group I compound because all Group I compounds are soluble, and Test 1 showed carbonate (CO\u2082 with acid).\", \"err\": \"Both reasons are needed; many named a copper compound or gave only one reason.\", \"ex\": [{\"s\": \"1226\", \"w\": \"\u201ccopper(II) carbonate\u201d\", \"y\": \"Copper carbonate is insoluble, but both R compounds are soluble; copper is already the common compound.\", \"c\": \"Sodium carbonate.\"}, {\"s\": \"1236\", \"w\": \"\u201ccopper(II) nitrate\u201d\", \"y\": \"No test shows nitrate; misses the carbonate from Test 1.\", \"c\": \"Sodium carbonate.\"}, {\"s\": \"1212\", \"w\": \"\u201csodium carbonate\u201d \u2014 carbonate reason only\", \"y\": \"Didn\u2019t explain why it is a Group I (soluble) compound.\", \"c\": \"Group I (all soluble) + carbonate from CO\u2082 \u2192 sodium carbonate.\"}]}, {\"t\": \"2(d) Other anion in S\", \"m\": 1, \"fac\": 75, \"ans\": \"<b>Chloride</b> (white ppt with silver nitrate in Test 5).\", \"err\": \"Watch the species: chloride, not chlorine.\", \"ex\": [{\"s\": \"1222\", \"w\": \"\u201cchlorine\u201d\", \"y\": \"Chlorine is the element/gas; the ion is chloride.\", \"c\": \"Chloride.\"}, {\"s\": \"1230\", \"w\": \"\u201chydroxide\u201d\", \"y\": \"No test showed hydroxide; the white ppt with silver nitrate shows chloride.\", \"c\": \"Chloride.\"}, {\"s\": \"1231\", \"w\": \"\u201ciodide\u201d\", \"y\": \"Iodide gives a yellow ppt with silver nitrate, not white.\", \"c\": \"Chloride.\"}]}]}, {\"id\": \"Q3\", \"tab\": \"Question 3\", \"name\": \"Question 3 \u2014 Effect of temperature on rate\", \"parts\": [{\"t\": \"3(a) Why the mass falls\", \"m\": 1, \"fac\": 91, \"ans\": \"<b>Hydrogen</b> gas is produced (Zn + 2HCl \u2192 ZnCl\u2082 + H\u2082) and escapes from the flask, so the mass decreases.\", \"err\": \"The loss is because gas leaves the flask.\", \"ex\": [{\"s\": \"1219\", \"w\": \"\u201cthe zinc dissolves and gets smaller\u201d\", \"y\": \"Mass falls because gas leaves, not because zinc shrinks.\", \"c\": \"Hydrogen gas escapes, so the mass decreases.\"}, {\"s\": \"1232\", \"w\": \"\u201cthe reactants form other products\u201d\", \"y\": \"Doesn\u2019t explain the loss \u2014 the gas must leave the system.\", \"c\": \"Hydrogen gas escapes from the flask.\"}]}, {\"t\": \"3(b) Complete the Experiment 2 column\", \"m\": 1, \"fac\": 62, \"ans\": \"loss = 81.132 \u2212 reading, in mg: <b>18, 38, 56, 63, 65</b>.\", \"err\": \"Loss is measured from the start (81.132 g), in mg.\", \"ex\": [{\"s\": \"1231\", \"w\": \"\u201c18, 20, 18, 7, 2\u201d\", \"y\": \"These are differences between successive readings, not loss from the start.\", \"c\": \"18, 38, 56, 63, 65 mg\"}, {\"s\": \"1215\", \"w\": \"\u201c0.018, 0.038, 0.056 \u2026\u201d\", \"y\": \"Correct method but not converted from g to mg.\", \"c\": \"18, 38, 56, 63, 65 mg\"}, {\"s\": \"1212\", \"w\": \"\u201c21, 41, 55, 62, 65\u201d\", \"y\": \"Arithmetic slips subtracting from 81.132.\", \"c\": \"18, 38, 56, 63, 65 mg\"}]}, {\"t\": \"3(c)(i) Plot Experiment 3 and draw the curve\", \"m\": 2, \"fac\": 50, \"ans\": \"Plot (0,0)(2,29)(5,54)(10,64)(15,66)(20,66) and draw <b>one smooth best-fit curve</b>.\", \"err\": \"A best-fit line is one smooth curve \u2014 not straight segments joining the points.\", \"ex\": [{\"s\": \"1212\", \"w\": \"straight segments joined dot-to-dot, kink at (2,29)\", \"y\": \"A best-fit line must be one smooth continuous curve.\", \"c\": \"Draw a single smooth curve through the points.\"}, {\"s\": \"1225\", \"w\": \"\u201cpoints fine but the curve kinks at (2,29)\u201d\", \"y\": \"A kink means it isn\u2019t a smooth best-fit.\", \"c\": \"One smooth curve, no corners.\"}, {\"s\": \"1216\", \"w\": \"Experiment 3 not plotted\", \"y\": \"No points or curve for Experiment 3 (check faint pencil).\", \"c\": \"Plot the points, then a smooth curve.\"}]}, {\"t\": \"3(c)(ii) Average rate over the first 7 minutes\", \"m\": 3, \"fac\": 75, \"ans\": \"Read the loss at 7 min off the Experiment 1 curve (\u2248 39 mg): rate = 39 \u00f7 7 = <b>5.57 mg/min</b>.\", \"err\": \"Read at 7 min (\u2248 39, not the 5-min value 31) and give units mg/min.\", \"ex\": [{\"s\": \"1233\", \"w\": \"\u201c5.57 g/min\u201d\", \"y\": \"Units should be mg/min \u2014 the data is in mg.\", \"c\": \"5.57 mg/min\"}, {\"s\": \"1232\", \"w\": \"\u201c39 \u00f7 7 = 5.57\u201d (no units)\", \"y\": \"No units given.\", \"c\": \"5.57 mg/min\"}, {\"s\": \"1214\", \"w\": \"\u201cused 60 mg, rate = 8.57\u201d\", \"y\": \"Misread the graph \u2014 loss at 7 min is \u2248 39 mg.\", \"c\": \"39 \u00f7 7 = 5.57 mg/min\"}]}, {\"t\": \"3(d) How the student knew it had finished\", \"m\": 1, \"fac\": 94, \"ans\": \"The <b>loss in mass stays constant</b> (66 mg after 15 min), so no more gas is produced.\", \"err\": \"Conclude from the recorded data (constant mass).\", \"ex\": [{\"s\": \"1212\", \"w\": \"\u201cthe effervescence stopped\u201d\", \"y\": \"Bubbling wasn\u2019t measured; use the mass data.\", \"c\": \"The loss in mass stays constant (66 mg).\"}, {\"s\": \"1231\", \"w\": \"\u201cthe temperature reached a constant\u201d\", \"y\": \"Temperature was fixed, not measured over time.\", \"c\": \"The loss in mass stays constant.\"}]}]}], \"embeds\": [{\"id\": \"ws1\", \"tab\": \"\ud83e\uddea Titration Worksheet\", \"caption\": \"Interactive Q1 titration worksheet \u2014 students enter their titration data and calculations here, then use the Question 1 tab to check against the model answers.\", \"html\": \"<!DOCTYPE html>\\n<html lang=\\\"en\\\">\\n<head>\\n<meta charset=\\\"UTF-8\\\">\\n<meta name=\\\"viewport\\\" content=\\\"width=device-width, initial-scale=1.0\\\">\\n<title>2020 O-Level Chemistry Practical \u2013 Q1 Titration</title>\\n<link href=\\\"https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Nunito+Sans:wght@400;600&display=swap\\\" rel=\\\"stylesheet\\\">\\n<style>\\n  :root {\\n    --bg: #f4f8ff;\\n    --card: #fff;\\n    --border: #e8edf5;\\n    --mint: #b8f0d8;\\n    --md: #2aaa78;\\n    --md-dark: #1a8055;\\n    --sky: #c8e8ff;\\n    --sd: #70b8f0;\\n    --lav: #d8d0f8;\\n    --ld: #9b8ee8;\\n    --lem: #fef0b8;\\n    --led: #e8c840;\\n    --tx: #1e293b;\\n    --tm: #64748b;\\n    --red: #fee2e2;\\n    --red-b: #ef4444;\\n    --green-b: #22c55e;\\n  }\\n  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }\\n  body { font-family: 'Nunito Sans', sans-serif; background: var(--bg); color: var(--tx); font-size: 15px; line-height: 1.6; }\\n  h1, h2, h3, .badge { font-family: 'Nunito', sans-serif; }\\n\\n  /* \u2500\u2500 PROGRESS BAR \u2500\u2500 */\\n  #progress-bar {\\n    position: sticky; top: 0; z-index: 200;\\n    background: #1e293b; color: #fff;\\n    padding: 10px 20px; display: flex; align-items: center; gap: 14px;\\n    box-shadow: 0 2px 12px rgba(0,0,0,.25);\\n  }\\n  #progress-bar .label { font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 13px; white-space: nowrap; }\\n  #prog-track { flex: 1; background: rgba(255,255,255,.15); border-radius: 99px; height: 10px; overflow: hidden; }\\n  #prog-fill { height: 100%; background: linear-gradient(90deg,#2aaa78,#70b8f0); border-radius: 99px; transition: width .4s ease; width: 0%; }\\n  #prog-text { font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 13px; white-space: nowrap; min-width: 80px; text-align: right; }\\n\\n  /* \u2500\u2500 HEADER \u2500\u2500 */\\n  header {\\n    background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #0e6e55 100%);\\n    color: #fff; padding: 36px 24px 28px; text-align: center;\\n  }\\n  header h1 { font-size: clamp(1.3rem,3.5vw,2rem); font-weight: 900; letter-spacing: -0.5px; margin-bottom: 8px; }\\n  header .eq-box {\\n    display: inline-block; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.2);\\n    border-radius: 12px; padding: 8px 22px; font-size: 1.05rem; font-weight: 700; margin: 10px 0 6px;\\n    font-family: 'Nunito', sans-serif; letter-spacing: 0.5px;\\n  }\\n  header .sub { font-size: 0.82rem; opacity: .65; margin-top: 4px; }\\n\\n  /* \u2500\u2500 LAYOUT \u2500\u2500 */\\n  .container { max-width: 900px; margin: 0 auto; padding: 24px 16px 60px; }\\n\\n  /* \u2500\u2500 CARDS \u2500\u2500 */\\n  .card {\\n    background: var(--card); border-radius: 18px; padding: 24px;\\n    box-shadow: 0 2px 16px rgba(30,41,59,.07); margin-bottom: 22px;\\n    border: 1.5px solid var(--border);\\n  }\\n  .card-blue { border-top: 4px solid var(--sd); }\\n  .card-purple { border-top: 4px solid var(--ld); }\\n  .card-green { border-top: 4px solid var(--md); }\\n\\n  /* \u2500\u2500 SECTION BADGE \u2500\u2500 */\\n  .badge {\\n    display: inline-flex; align-items: center; gap: 6px;\\n    padding: 4px 14px; border-radius: 99px; font-size: 0.78rem; font-weight: 800;\\n    margin-bottom: 14px; letter-spacing: 0.3px;\\n  }\\n  .badge-blue { background: var(--sky); color: #1565c0; }\\n  .badge-purple { background: var(--lav); color: #5e35b1; }\\n  .badge-green { background: var(--mint); color: var(--md-dark); }\\n\\n  /* \u2500\u2500 INFO PILLS \u2500\u2500 */\\n  .pill-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }\\n  .pill {\\n    background: var(--lem); border: 1.5px solid var(--led); border-radius: 99px;\\n    padding: 5px 14px; font-size: 0.82rem; font-weight: 600; color: #78350f;\\n  }\\n\\n  /* \u2500\u2500 STUDENT DETAILS \u2500\u2500 */\\n  .details-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }\\n  @media(max-width:580px){ .details-grid { grid-template-columns: 1fr; } }\\n  .field-label { font-weight: 700; font-size: 0.8rem; color: var(--tm); margin-bottom: 4px; }\\n  .field-input {\\n    width: 100%; border: 1.5px solid var(--border); border-radius: 10px;\\n    padding: 9px 13px; font-family: 'Nunito Sans', sans-serif; font-size: 0.95rem;\\n    color: var(--tx); background: var(--bg); outline: none; transition: border-color .2s;\\n  }\\n  .field-input:focus { border-color: var(--sd); background: #fff; }\\n\\n  /* \u2500\u2500 TITRATION TABLE \u2500\u2500 */\\n  .tbl-wrap { overflow-x: auto; }\\n  table.titration-tbl {\\n    width: 100%; border-collapse: collapse; font-size: 0.88rem; min-width: 560px;\\n  }\\n  table.titration-tbl th, table.titration-tbl td {\\n    border: 1.5px solid var(--border); padding: 7px 6px; text-align: center;\\n  }\\n  table.titration-tbl th.row-hdr {\\n    background: var(--sky); color: #1565c0; font-weight: 700; text-align: left;\\n    padding-left: 10px; min-width: 180px;\\n  }\\n  table.titration-tbl th.col-hdr { background: #1e3a5f; color: #fff; font-weight: 800; font-size: 0.82rem; }\\n  table.titration-tbl .titre-cell { color: var(--md-dark); font-weight: 800; font-size: 0.95rem; }\\n\\n  .burette-input {\\n    width: 80px; border: 1.5px solid var(--border); border-radius: 8px;\\n    padding: 6px 4px; text-align: center; font-family: 'Nunito Sans', sans-serif;\\n    font-size: 0.92rem; color: var(--tx); outline: none; transition: border-color .2s;\\n  }\\n  .burette-input:focus { border-color: var(--sd); }\\n  .burette-input.precision-err { border-color: var(--red-b); background: #fff5f5; }\\n\\n  .check-cell input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--md); cursor: pointer; }\\n  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-left: 4px; vertical-align: middle; }\\n  .dot-green { background: var(--md); }\\n  .dot-red { background: var(--red-b); }\\n\\n  /* concordance info */\\n  #concordance-info {\\n    margin-top: 12px; padding: 10px 16px; border-radius: 10px;\\n    font-size: 0.85rem; font-weight: 600; display: none;\\n  }\\n  #concordance-info.ok { background: var(--mint); color: var(--md-dark); border: 1.5px solid var(--md); }\\n  #concordance-info.warn { background: var(--red); color: #991b1b; border: 1.5px solid var(--red-b); }\\n\\n  /* average box */\\n  #avg-box {\\n    margin-top: 14px; background: var(--sky); border-radius: 12px;\\n    padding: 12px 18px; display: none; font-weight: 700;\\n    border: 1.5px solid var(--sd); color: #1565c0; font-size: 0.95rem;\\n  }\\n\\n  /* precision warning area */\\n  .precision-warn { color: var(--red-b); font-size: 0.78rem; margin-top: 3px; display: none; }\\n\\n  /* \u2500\u2500 CHECKLIST \u2500\u2500 */\\n  .checklist-item {\\n    display: flex; align-items: flex-start; gap: 12px;\\n    padding: 12px 14px; border-radius: 12px; margin-bottom: 10px;\\n    border: 1.5px solid var(--border); background: var(--bg); cursor: pointer;\\n    transition: background .2s;\\n  }\\n  .checklist-item:hover { background: #eef4ff; }\\n  .checklist-item input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--md); margin-top: 2px; flex-shrink: 0; }\\n  .checklist-item label { cursor: pointer; font-size: 0.9rem; line-height: 1.5; }\\n  .checklist-score { margin-top: 10px; font-weight: 700; font-size: 0.88rem; color: var(--tm); }\\n\\n  /* \u2500\u2500 CALCULATION CARDS \u2500\u2500 */\\n  .calc-card {\\n    border: 2px solid var(--lav); border-radius: 16px; padding: 20px;\\n    margin-bottom: 18px; background: #faf9ff; position: relative;\\n  }\\n  .calc-card.locked { opacity: 0.5; pointer-events: none; }\\n  .calc-card.correct { border-color: var(--md); background: #f0fdf7; }\\n  .step-label { font-family: 'Nunito', sans-serif; font-weight: 900; color: var(--ld); font-size: 0.8rem; letter-spacing: 0.5px; margin-bottom: 6px; }\\n  .step-q { font-weight: 700; font-size: 0.95rem; color: var(--tx); margin-bottom: 10px; }\\n  .formula-pill {\\n    display: inline-block; background: var(--lav); border-radius: 8px;\\n    padding: 4px 12px; font-size: 0.82rem; font-weight: 600; color: #5e35b1;\\n    margin-bottom: 12px; cursor: pointer; border: none;\\n    font-family: 'Nunito Sans', sans-serif;\\n  }\\n  .hint-box {\\n    background: var(--lav); border-radius: 10px; padding: 12px 14px;\\n    margin-bottom: 12px; font-size: 0.85rem; color: #5e35b1; display: none; font-weight: 600;\\n  }\\n  .ans-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }\\n  .ans-input {\\n    border: 1.5px solid var(--border); border-radius: 10px; padding: 9px 13px;\\n    font-family: 'Nunito Sans', sans-serif; font-size: 0.95rem; width: 200px;\\n    outline: none; transition: border-color .2s; color: var(--tx);\\n  }\\n  .ans-input:focus { border-color: var(--ld); }\\n  .ans-input.correct { border-color: var(--md); background: #f0fdf7; }\\n  .ans-input.wrong { border-color: var(--red-b); background: #fff5f5; }\\n  .unit-tag { font-weight: 700; color: var(--tm); font-size: 0.9rem; }\\n  .btn { font-family: 'Nunito', sans-serif; font-weight: 800; border: none; border-radius: 10px; padding: 9px 18px; cursor: pointer; font-size: 0.88rem; transition: all .15s; }\\n  .btn-check { background: var(--ld); color: #fff; }\\n  .btn-check:hover { background: #7c3aed; }\\n  .btn-hint { background: var(--lav); color: #5e35b1; }\\n  .btn-hint:hover { background: #c4b5fd; }\\n  .feedback { margin-top: 10px; font-size: 0.85rem; font-weight: 600; padding: 8px 14px; border-radius: 8px; display: none; }\\n  .feedback.ok { background: var(--mint); color: var(--md-dark); }\\n  .feedback.err { background: var(--red); color: #991b1b; }\\n  .attempts-tag { font-size: 0.78rem; color: var(--tm); margin-top: 6px; }\\n  .lock-icon { position: absolute; top: 14px; right: 16px; font-size: 1.1rem; color: var(--tm); }\\n\\n  /* \u2500\u2500 COMPLETION SUMMARY \u2500\u2500 */\\n  #completion-card { display: none; }\\n  .summary-tbl { width: 100%; border-collapse: collapse; font-size: 0.88rem; margin: 14px 0; }\\n  .summary-tbl th { background: var(--mint); color: var(--md-dark); padding: 9px 12px; text-align: left; }\\n  .summary-tbl td { padding: 9px 12px; border-bottom: 1px solid var(--border); }\\n  .summary-tbl tr:last-child td { border-bottom: none; }\\n  .conclusion-box {\\n    background: var(--mint); border: 2px solid var(--md); border-radius: 12px;\\n    padding: 14px 18px; font-weight: 700; color: var(--md-dark); font-size: 0.95rem; margin-top: 10px;\\n  }\\n  .btn-reset { background: #f1f5f9; color: var(--tx); border: 1.5px solid var(--border); margin-top: 14px; }\\n  .btn-reset:hover { background: #e2e8f0; }\\n\\n  /* \u2500\u2500 TEACHER REPORT \u2500\u2500 */\\n  #teacher-btn-wrap { text-align: center; margin-top: 40px; }\\n  #teacher-btn {\\n    background: none; border: 1.5px solid #cbd5e1; color: var(--tm); border-radius: 10px;\\n    padding: 7px 18px; font-size: 0.78rem; cursor: pointer; font-family: 'Nunito', sans-serif;\\n    font-weight: 700; transition: all .2s;\\n  }\\n  #teacher-btn:hover { border-color: var(--ld); color: var(--ld); }\\n  #teacher-report {\\n    display: none; background: #fff; border: 2px solid var(--border); border-radius: 18px;\\n    padding: 28px; margin-top: 16px; font-size: 0.85rem;\\n  }\\n  #teacher-report h2 { font-size: 1.1rem; color: #1e293b; margin-bottom: 14px; }\\n  #teacher-report h3 { font-size: 0.9rem; color: var(--tm); margin: 16px 0 8px; font-family: 'Nunito', sans-serif; font-weight: 800; border-bottom: 1px solid var(--border); padding-bottom: 4px; }\\n  .report-tbl { width: 100%; border-collapse: collapse; font-size: 0.82rem; margin: 8px 0; }\\n  .report-tbl th { background: #f1f5f9; padding: 7px 10px; text-align: left; font-weight: 700; }\\n  .report-tbl td { padding: 7px 10px; border-bottom: 1px solid var(--border); }\\n  .badge-ok { background: #d1fae5; color: #065f46; padding: 2px 8px; border-radius: 99px; font-size: 0.75rem; font-weight: 700; }\\n  .badge-err { background: #fee2e2; color: #991b1b; padding: 2px 8px; border-radius: 99px; font-size: 0.75rem; font-weight: 700; }\\n  .badge-pend { background: #f1f5f9; color: var(--tm); padding: 2px 8px; border-radius: 99px; font-size: 0.75rem; font-weight: 700; }\\n  .concern-box { background: #fffbeb; border: 1.5px solid #fbbf24; border-radius: 10px; padding: 10px 14px; margin: 8px 0; font-size: 0.82rem; color: #92400e; }\\n  .log-entry { font-size: 0.78rem; padding: 4px 0; border-bottom: 1px solid #f1f5f9; }\\n  .log-entry.ok { color: var(--md-dark); }\\n  .log-entry.err { color: #991b1b; }\\n  .log-entry.hint { color: #5e35b1; }\\n  textarea.teacher-notes {\\n    width: 100%; border: 1.5px solid var(--border); border-radius: 10px;\\n    padding: 10px; font-family: 'Nunito Sans', sans-serif; font-size: 0.85rem;\\n    min-height: 80px; outline: none; margin-top: 8px;\\n  }\\n  .report-btns { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }\\n  .btn-report { font-size: 0.82rem; padding: 7px 14px; border-radius: 8px; border: 1.5px solid var(--border); background: #f8fafc; cursor: pointer; font-family: 'Nunito', sans-serif; font-weight: 700; transition: all .2s; }\\n  .btn-report:hover { background: var(--lav); border-color: var(--ld); color: #5e35b1; }\\n</style>\\n</head>\\n<body>\\n\\n<!-- \u2500\u2500 PROGRESS BAR \u2500\u2500 -->\\n<div id=\\\"progress-bar\\\">\\n  <span class=\\\"label\\\">\ud83d\udcca Progress</span>\\n  <div id=\\\"prog-track\\\"><div id=\\\"prog-fill\\\"></div></div>\\n  <span id=\\\"prog-text\\\">0 / 4 \u00b7 0%</span>\\n</div>\\n\\n<!-- \u2500\u2500 HEADER \u2500\u2500 -->\\n<header>\\n  <h1>2020 O-Level Chemistry Practical</h1>\\n  <div class=\\\"eq-box\\\">HA + NaOH \u2192 NaA + H<sub>2</sub>O</div>\\n  <p class=\\\"sub\\\">6092/03 \u00b7 Question 1 \u00b7 Sulfamic Acid Titration</p>\\n  <p class=\\\"sub\\\">EVG Chemistry \u00b7 Created by Ms Teng</p>\\n</header>\\n\\n<div class=\\\"container\\\">\\n\\n  <!-- \u2500\u2500 STUDENT DETAILS \u2500\u2500 -->\\n  <div class=\\\"card card-blue\\\">\\n    <span class=\\\"badge badge-blue\\\">\ud83d\udd35 Student Details</span>\\n    <div class=\\\"details-grid\\\">\\n      <div>\\n        <div class=\\\"field-label\\\">Student Name</div>\\n        <input class=\\\"field-input\\\" id=\\\"stu-name\\\" type=\\\"text\\\" placeholder=\\\"Enter your name\\\" autocomplete=\\\"off\\\">\\n      </div>\\n      <div>\\n        <div class=\\\"field-label\\\">Class</div>\\n        <select class=\\\"field-input\\\" id=\\\"stu-class\\\">\\n          <option value=\\\"\\\">\u2014 Select \u2014</option>\\n          <option value=\\\"4 Rsp\\\">4 Rsp</option>\\n          <option value=\\\"4 Dyn\\\">4 Dyn</option>\\n        </select>\\n      </div>\\n      <div>\\n        <div class=\\\"field-label\\\">Date</div>\\n        <input class=\\\"field-input\\\" id=\\\"stu-date\\\" type=\\\"text\\\" readonly>\\n      </div>\\n    </div>\\n  </div>\\n\\n  <!-- \u2500\u2500 GIVEN INFORMATION \u2500\u2500 -->\\n  <div class=\\\"card card-blue\\\">\\n    <span class=\\\"badge badge-blue\\\">\u2139\ufe0f Given Information</span>\\n    <div class=\\\"pill-row\\\">\\n      <span class=\\\"pill\\\">P = 0.200 mol/dm\u00b3 sodium hydroxide (NaOH)</span>\\n      <span class=\\\"pill\\\">Volume of Q = 25.0 cm\u00b3 (pipetted into conical flask)</span>\\n      <span class=\\\"pill\\\">Mole ratio HA : NaOH = 1 : 1</span>\\n      <span class=\\\"pill\\\">Indicator: thymolphthalein (T) \u2014 blue at end-point</span>\\n    </div>\\n    <p style=\\\"font-size:0.85rem;color:var(--tm);font-weight:600;\\\">\\n      <strong>Note:</strong> Q (sulfamic acid solution) was made by diluting 100 cm\u00b3 of cleaning product to 1.00 dm\u00b3 with deionised water. P (NaOH) is added from the burette.\\n    </p>\\n  </div>\\n\\n  <!-- \u2500\u2500 TITRATION TABLE \u2500\u2500 -->\\n  <div class=\\\"card card-blue\\\">\\n    <span class=\\\"badge badge-blue\\\">\ud83e\uddea Part (a)(i) \u2014 Titration Results</span>\\n    <p style=\\\"font-size:0.85rem;color:var(--tm);font-weight:600;margin-bottom:14px;\\\">\\n      Record all burette readings to 2 decimal places, with the last digit being 0 or 5 (e.g. 22.30, 0.00, 14.75). Tick the best concordant results.\\n    </p>\\n    <div class=\\\"tbl-wrap\\\">\\n      <table class=\\\"titration-tbl\\\">\\n        <thead>\\n          <tr>\\n            <th class=\\\"col-hdr\\\" style=\\\"text-align:left;padding-left:10px;\\\">Measurement</th>\\n            <th class=\\\"col-hdr\\\">Titration 1</th>\\n            <th class=\\\"col-hdr\\\">Titration 2</th>\\n            <th class=\\\"col-hdr\\\">Titration 3</th>\\n            <th class=\\\"col-hdr\\\">Titration 4</th>\\n            <th class=\\\"col-hdr\\\">Titration 5</th>\\n          </tr>\\n        </thead>\\n        <tbody>\\n          <tr id=\\\"row-final\\\">\\n            <th class=\\\"row-hdr\\\">Final burette reading / cm\u00b3</th>\\n            <td><input class=\\\"burette-input\\\" id=\\\"f1\\\" type=\\\"number\\\" step=\\\"0.05\\\" placeholder=\\\"0.00\\\"><div class=\\\"precision-warn\\\" id=\\\"pw-f1\\\">\u26a0 Must end in .00 or .05</div></td>\\n            <td><input class=\\\"burette-input\\\" id=\\\"f2\\\" type=\\\"number\\\" step=\\\"0.05\\\" placeholder=\\\"0.00\\\"><div class=\\\"precision-warn\\\" id=\\\"pw-f2\\\">\u26a0 Must end in .00 or .05</div></td>\\n            <td><input class=\\\"burette-input\\\" id=\\\"f3\\\" type=\\\"number\\\" step=\\\"0.05\\\" placeholder=\\\"0.00\\\"><div class=\\\"precision-warn\\\" id=\\\"pw-f3\\\">\u26a0 Must end in .00 or .05</div></td>\\n            <td><input class=\\\"burette-input\\\" id=\\\"f4\\\" type=\\\"number\\\" step=\\\"0.05\\\" placeholder=\\\"0.00\\\"><div class=\\\"precision-warn\\\" id=\\\"pw-f4\\\">\u26a0 Must end in .00 or .05</div></td>\\n            <td><input class=\\\"burette-input\\\" id=\\\"f5\\\" type=\\\"number\\\" step=\\\"0.05\\\" placeholder=\\\"0.00\\\"><div class=\\\"precision-warn\\\" id=\\\"pw-f5\\\">\u26a0 Must end in .00 or .05</div></td>\\n          </tr>\\n          <tr id=\\\"row-initial\\\">\\n            <th class=\\\"row-hdr\\\">Initial burette reading / cm\u00b3</th>\\n            <td><input class=\\\"burette-input\\\" id=\\\"i1\\\" type=\\\"number\\\" step=\\\"0.05\\\" placeholder=\\\"0.00\\\"><div class=\\\"precision-warn\\\" id=\\\"pw-i1\\\">\u26a0 Must end in .00 or .05</div></td>\\n            <td><input class=\\\"burette-input\\\" id=\\\"i2\\\" type=\\\"number\\\" step=\\\"0.05\\\" placeholder=\\\"0.00\\\"><div class=\\\"precision-warn\\\" id=\\\"pw-i2\\\">\u26a0 Must end in .00 or .05</div></td>\\n            <td><input class=\\\"burette-input\\\" id=\\\"i3\\\" type=\\\"number\\\" step=\\\"0.05\\\" placeholder=\\\"0.00\\\"><div class=\\\"precision-warn\\\" id=\\\"pw-i3\\\">\u26a0 Must end in .00 or .05</div></td>\\n            <td><input class=\\\"burette-input\\\" id=\\\"i4\\\" type=\\\"number\\\" step=\\\"0.05\\\" placeholder=\\\"0.00\\\"><div class=\\\"precision-warn\\\" id=\\\"pw-i4\\\">\u26a0 Must end in .00 or .05</div></td>\\n            <td><input class=\\\"burette-input\\\" id=\\\"i5\\\" type=\\\"number\\\" step=\\\"0.05\\\" placeholder=\\\"0.00\\\"><div class=\\\"precision-warn\\\" id=\\\"pw-i5\\\">\u26a0 Must end in .00 or .05</div></td>\\n          </tr>\\n          <tr id=\\\"row-titre\\\">\\n            <th class=\\\"row-hdr\\\">Volume of P used / cm\u00b3</th>\\n            <td class=\\\"titre-cell\\\" id=\\\"t1\\\">\u2014</td>\\n            <td class=\\\"titre-cell\\\" id=\\\"t2\\\">\u2014</td>\\n            <td class=\\\"titre-cell\\\" id=\\\"t3\\\">\u2014</td>\\n            <td class=\\\"titre-cell\\\" id=\\\"t4\\\">\u2014</td>\\n            <td class=\\\"titre-cell\\\" id=\\\"t5\\\">\u2014</td>\\n          </tr>\\n          <tr id=\\\"row-best\\\">\\n            <th class=\\\"row-hdr\\\">Best titration results \u2713</th>\\n            <td class=\\\"check-cell\\\"><input type=\\\"checkbox\\\" id=\\\"c1\\\" onchange=\\\"updateConcordance()\\\"></td>\\n            <td class=\\\"check-cell\\\"><input type=\\\"checkbox\\\" id=\\\"c2\\\" onchange=\\\"updateConcordance()\\\"></td>\\n            <td class=\\\"check-cell\\\"><input type=\\\"checkbox\\\" id=\\\"c3\\\" onchange=\\\"updateConcordance()\\\"></td>\\n            <td class=\\\"check-cell\\\"><input type=\\\"checkbox\\\" id=\\\"c4\\\" onchange=\\\"updateConcordance()\\\"></td>\\n            <td class=\\\"check-cell\\\"><input type=\\\"checkbox\\\" id=\\\"c5\\\" onchange=\\\"updateConcordance()\\\"></td>\\n          </tr>\\n        </tbody>\\n      </table>\\n    </div>\\n    <div id=\\\"concordance-info\\\"></div>\\n    <div id=\\\"avg-box\\\"></div>\\n  </div>\\n\\n  <!-- \u2500\u2500 SELF-CHECK CHECKLIST \u2500\u2500 -->\\n  <div class=\\\"card card-blue\\\">\\n    <span class=\\\"badge badge-blue\\\">\u2705 Self-Check Checklist</span>\\n    <p style=\\\"font-size:0.85rem;color:var(--tm);font-weight:600;margin-bottom:14px;\\\">Tick each box once you are confident you have met the criterion.</p>\\n\\n    <div class=\\\"checklist-item\\\">\\n      <input type=\\\"checkbox\\\" id=\\\"chk1\\\" onchange=\\\"updateChecklist()\\\">\\n      <label for=\\\"chk1\\\"><strong>Correct precision:</strong> All burette readings are written to 2 decimal places, with the last digit being 0 or 5 (e.g. 22.30, 0.00, 14.75). Readings like 22.3 or 22.33 would be incorrect.</label>\\n    </div>\\n    <div class=\\\"checklist-item\\\">\\n      <input type=\\\"checkbox\\\" id=\\\"chk2\\\" onchange=\\\"updateChecklist()\\\">\\n      <label for=\\\"chk2\\\"><strong>Volume of P calculated correctly</strong> for each titration (Final \u2212 Initial burette reading).</label>\\n    </div>\\n    <div class=\\\"checklist-item\\\">\\n      <input type=\\\"checkbox\\\" id=\\\"chk3\\\" onchange=\\\"updateChecklist()\\\">\\n      <label for=\\\"chk3\\\"><strong>Concordant results selected</strong> \u2014 the chosen titrations are within \u00b10.20 cm\u00b3 of each other.</label>\\n    </div>\\n    <div class=\\\"checklist-score\\\" id=\\\"checklist-score\\\">Checklist: 0 / 3 ticked</div>\\n  </div>\\n\\n  <!-- \u2500\u2500 CALCULATION STEPS \u2500\u2500 -->\\n  <div class=\\\"card card-purple\\\">\\n    <span class=\\\"badge badge-purple\\\">\ud83d\udfe3 Part (a)(ii) \u2014 Average Volume of P</span>\\n\\n    <div class=\\\"calc-card\\\" id=\\\"card-aii\\\">\\n      <div class=\\\"lock-icon\\\" id=\\\"lock-aii\\\" style=\\\"display:none;\\\">\ud83d\udd12</div>\\n      <div class=\\\"step-label\\\">STEP a(ii)</div>\\n      <div class=\\\"step-q\\\">From your titration results, calculate the <strong>average volume of P</strong> to be used in your calculations.</div>\\n      <button class=\\\"formula-pill\\\" onclick=\\\"toggleHint('hint-aii')\\\">\ud83d\udca1 Hint</button>\\n      <div class=\\\"hint-box\\\" id=\\\"hint-aii\\\">Average volume = sum of selected concordant titres \u00f7 number of titres selected. Use only the ticked \\\"best\\\" results.</div>\\n      <div class=\\\"ans-row\\\">\\n        <input class=\\\"ans-input\\\" id=\\\"ans-aii\\\" type=\\\"number\\\" step=\\\"any\\\" placeholder=\\\"Enter average\\\">\\n        <span class=\\\"unit-tag\\\">cm\u00b3</span>\\n        <button class=\\\"btn btn-check\\\" onclick=\\\"checkAii()\\\">\u2714 Check</button>\\n      </div>\\n      <div class=\\\"feedback\\\" id=\\\"fb-aii\\\"></div>\\n      <div class=\\\"attempts-tag\\\" id=\\\"att-aii\\\">Attempts: 0</div>\\n    </div>\\n  </div>\\n\\n  <div class=\\\"card card-purple\\\">\\n    <span class=\\\"badge badge-purple\\\">\ud83d\udfe3 Part (b)(i) \u2014 Moles of NaOH (P)</span>\\n\\n    <div class=\\\"calc-card locked\\\" id=\\\"card-bi\\\">\\n      <div class=\\\"lock-icon\\\" id=\\\"lock-bi\\\">\ud83d\udd12</div>\\n      <div class=\\\"step-label\\\">STEP b(i)</div>\\n      <div class=\\\"step-q\\\">Using your average volume of P, calculate the <strong>number of moles of NaOH</strong> used in the titration.</div>\\n      <button class=\\\"formula-pill\\\" onclick=\\\"toggleHint('hint-bi')\\\">\ud83d\udca1 Hint</button>\\n      <div class=\\\"hint-box\\\" id=\\\"hint-bi\\\">Moles = concentration \u00d7 volume (cm\u00b3) \u00f7 1000. Use concentration of P = 0.200 mol/dm\u00b3 and your average volume from Step a(ii).</div>\\n      <div class=\\\"ans-row\\\">\\n        <input class=\\\"ans-input\\\" id=\\\"ans-bi\\\" type=\\\"number\\\" step=\\\"any\\\" placeholder=\\\"Enter moles\\\">\\n        <span class=\\\"unit-tag\\\">mol</span>\\n        <button class=\\\"btn btn-check\\\" onclick=\\\"checkBi()\\\">\u2714 Check</button>\\n      </div>\\n      <div class=\\\"feedback\\\" id=\\\"fb-bi\\\"></div>\\n      <div class=\\\"attempts-tag\\\" id=\\\"att-bi\\\">Attempts: 0</div>\\n    </div>\\n  </div>\\n\\n  <div class=\\\"card card-purple\\\">\\n    <span class=\\\"badge badge-purple\\\">\ud83d\udfe3 Part (b)(i) \u2014 Moles of Sulfamic Acid (HA)</span>\\n\\n    <div class=\\\"calc-card locked\\\" id=\\\"card-bi2\\\">\\n      <div class=\\\"lock-icon\\\" id=\\\"lock-bi2\\\">\ud83d\udd12</div>\\n      <div class=\\\"step-label\\\">STEP b(i) cont.</div>\\n      <div class=\\\"step-q\\\">Using the mole ratio HA : NaOH = 1 : 1, calculate the <strong>number of moles of sulfamic acid (HA)</strong> in 25.0 cm\u00b3 of Q.</div>\\n      <button class=\\\"formula-pill\\\" onclick=\\\"toggleHint('hint-bi2')\\\">\ud83d\udca1 Hint</button>\\n      <div class=\\\"hint-box\\\" id=\\\"hint-bi2\\\">Since mole ratio HA : NaOH = 1 : 1, moles of HA = moles of NaOH. Carry forward your answer from Step b(i).</div>\\n      <div class=\\\"ans-row\\\">\\n        <input class=\\\"ans-input\\\" id=\\\"ans-bi2\\\" type=\\\"number\\\" step=\\\"any\\\" placeholder=\\\"Enter moles\\\">\\n        <span class=\\\"unit-tag\\\">mol</span>\\n        <button class=\\\"btn btn-check\\\" onclick=\\\"checkBi2()\\\">\u2714 Check</button>\\n      </div>\\n      <div class=\\\"feedback\\\" id=\\\"fb-bi2\\\"></div>\\n      <div class=\\\"attempts-tag\\\" id=\\\"att-bi2\\\">Attempts: 0</div>\\n    </div>\\n  </div>\\n\\n  <div class=\\\"card card-purple\\\">\\n    <span class=\\\"badge badge-purple\\\">\ud83d\udfe3 Part (b)(ii) \u2014 Concentration of Sulfamic Acid in Cleaning Product</span>\\n\\n    <div class=\\\"calc-card locked\\\" id=\\\"card-bii\\\">\\n      <div class=\\\"lock-icon\\\" id=\\\"lock-bii\\\">\ud83d\udd12</div>\\n      <div class=\\\"step-label\\\">STEP b(ii)</div>\\n      <div class=\\\"step-q\\\">\\n        Use your answer from (b)(i) to calculate the <strong>concentration of sulfamic acid (HA) in the original cleaning product</strong>, in mol/dm\u00b3.<br>\\n        <span style=\\\"font-size:0.83rem;color:var(--tm);font-weight:600;margin-top:6px;display:block;\\\">\\n          Recall: Solution Q was made by diluting <strong>100 cm\u00b3</strong> of cleaning product to <strong>1000 cm\u00b3</strong> (dilution factor = 10). You pipetted <strong>25.0 cm\u00b3</strong> of Q.\\n        </span>\\n      </div>\\n      <button class=\\\"formula-pill\\\" onclick=\\\"toggleHint('hint-bii')\\\">\ud83d\udca1 Hint</button>\\n      <div class=\\\"hint-box\\\" id=\\\"hint-bii\\\">\\n        <strong>Two-step approach:</strong><br>\\n        1. Concentration of HA in Q = moles of HA \u00f7 volume of Q in dm\u00b3 = moles \u00f7 0.0250<br>\\n        2. Concentration in cleaning product = concentration in Q \u00d7 dilution factor = concentration \u00d7 10<br><br>\\n        <em>Or in one step:</em> concentration = moles of HA \u00d7 (1000 \u00f7 25.0) \u00d7 10\\n      </div>\\n      <div class=\\\"ans-row\\\">\\n        <input class=\\\"ans-input\\\" id=\\\"ans-bii\\\" type=\\\"number\\\" step=\\\"any\\\" placeholder=\\\"Enter concentration\\\">\\n        <span class=\\\"unit-tag\\\">mol/dm\u00b3</span>\\n        <button class=\\\"btn btn-check\\\" onclick=\\\"checkBii()\\\">\u2714 Check</button>\\n      </div>\\n      <div class=\\\"feedback\\\" id=\\\"fb-bii\\\"></div>\\n      <div class=\\\"attempts-tag\\\" id=\\\"att-bii\\\">Attempts: 0</div>\\n    </div>\\n  </div>\\n\\n  <!-- \u2500\u2500 COMPLETION SUMMARY \u2500\u2500 -->\\n  <div class=\\\"card card-green\\\" id=\\\"completion-card\\\">\\n
