<style>
:root{--bg:#f0f4ff;--card:#fff;--ink:#1a1a2e;--pink:#ffb3c6;--purple:#c9b8f0;--teal:#b2e8e0;--mint:#c3f0d4;--yellow:#fff1b0;

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito',sans-serif;line-height:1.55}

.page{display:none}.page.active{display:block}

.qtag{font-family:'Fredoka One';color:#5b4b8a;font-size:1.05rem}.marks{font-weight:800;color:#6a6f85;font-size:.85rem}

.reveal{background:#fff;border:2px solid var(--teal);box-shadow:0 4px 0 var(--teal);border-radius:12px;font-weight:700;padding:8px 14px;margin-top:8px}
.reveal:active{transform:translateY(4px);box-shadow:0 0 0 var(--teal)}
.reveal.ex-btn{border-color:var(--pink);box-shadow:0 4px 0 var(--pink)}.reveal.ex-btn:active{box-shadow:0 0 0 var(--pink)}

.answer h4{margin:.2rem 0 .4rem;color:#5b4b8a;font-family:'Fredoka One';font-weight:400;font-size:.95rem}
.err{margin-top:10px;background:var(--badbg);border-radius:10px;padding:10px 12px;font-size:.92rem}.err b{color:var(--bad)}
.examples{margin-top:10px}

.strip{border-radius:8px;padding:7px 10px;margin:5px 0;font-size:.92rem}
.strip.w{background:var(--badbg)}.strip.y{background:var(--mixbg)}.strip.c{background:var(--goodbg)}
.chip{display:inline-block;background:var(--nabg);border-radius:8px;padding:1px 7px;font-size:.8rem;font-weight:700;margin-left:4px}
.board{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:640px){.board{grid-template-columns:1fr}}

<script>
const CFG={"title": "⚗️ 2020 Practical Paper 3 — Review Walkthrough", "subtitle": "Model answers, class performance &amp; real examples | O-Level Chemistry 6092 | Evergreen Secondary School", "credit": "Created by Ms Teng", "avg": "21 / 30 on the marked section (Q1c–Q3)", "note": "Class data from 32 fully-marked scripts. Examples are anonymised — the script number lets you pull the paper.", "good": 75, "mixed": 60, "questions": [{"id": "Q1", "tab": "Question 1", "name": "Question 1 — Titration &amp; relative molecular mass", "parts": [{"t": "1(a) Titration results", "m": 5, "fac": null, "ans": "Marks: results table with correct <b>headings and units</b>; burette readings to <b>0.05 cm³</b>; at least <b>two titres within 0.20 cm³</b>; average titre within <b>±0.20 cm³</b> (accuracy, 2)."}, {"t": "1(a)(ii) Average volume of P", "m": 1, "fac": null, "ans": "Average of concordant titres, working shown: (17.70 + 17.70) ÷ 2 = <b>17.70 cm³</b>."}, {"t": "1(b)(i) Moles of sulfamic acid in 25.0 cm³", "m": 1, "fac": null, "ans": "moles NaOH = 0.200 × (17.70 ÷ 1000) = <b>0.00354 mol</b>; ratio 1 : 1 → same moles of acid."}, {"t": "1(b)(ii) Concentration in the cleaning product", "m": 3, "fac": null, "ans": "0.00354 ÷ 0.0250 = 0.142 mol/dm³, then ×10 (dilution) → <b>1.42 mol/dm³</b>. Both to 3 s.f."}, {"t": "1(c)(i) Method to find Mr (collect CO₂ over water)", "m": 5, "fac": 85, "ans": "Weigh solid acid on a balance; add to <b>excess</b> sodium carbonate, stopper immediately; collect gas over water, read V when the reaction stops. <b>moles CO₂ = V ÷ 24 000</b>; moles acid = 2 × moles CO₂; <b>Mr = mass ÷ moles</b>.", "err": "Most-dropped mark: not turning the gas volume into moles (÷ 24 000) before the mole ratio.", "ex": [{"s": "1212", "w": "“moles CO₂ = volume ÷ molecular mass”", "y": "Divided by molecular mass, not the molar gas volume.", "c": "moles CO₂ = volume ÷ 24 000 cm³"}, {"s": "1240", "w": "“divided the CO₂ volume by its Mr (44)”", "y": "44 is the Mr of CO₂, not the molar volume.", "c": "moles CO₂ = volume ÷ 24 000 cm³"}, {"s": "1234", "w": "“multiply moles with Ar to find Mr”", "y": "Mr = mass ÷ moles, not moles × Ar.", "c": "Mr = mass ÷ moles of acid"}]}, {"t": "1(c)(ii) Effect of CO₂ dissolving in water", "m": 3, "fac": 52, "ans": "Less gas collected → fewer moles of gas → fewer moles of acid. Since Mr = mass ÷ moles and mass is unchanged, the calculated Mr is <b>HIGHER</b>.", "err": "Half the class said ‘lower’ or just ‘inaccurate’.", "ex": [{"s": "1212", "w": "“the Mr will be lower than it should be”", "y": "Fewer moles on the bottom of mass ÷ moles makes Mr bigger.", "c": "The calculated Mr is higher."}, {"s": "1216", "w": "“the calculated Mr will be lower”", "y": "Wrong direction — same reasoning slip.", "c": "The calculated Mr is higher."}, {"s": "1213", "w": "“the Mr value will be inaccurate”", "y": "No direction given — must state higher.", "c": "The calculated Mr is higher."}]}, {"t": "1(c)(iii) One improvement", "m": 1, "fac": 73, "ans": "Use a <b>gas syringe</b> — the gas never touches the water so none can dissolve → accurate volume.", "err": "Explanation should be about the gas not dissolving in water.", "ex": [{"s": "1230", "w": "“add a lid to stop the water evaporating”", "y": "The problem is CO₂ dissolving, not evaporation.", "c": "Use a gas syringe so the gas avoids water."}, {"s": "1234", "w": "“collect the CO₂ by air displacement”", "y": "Does not ensure an accurate gas volume.", "c": "Use a gas syringe — no water contact."}, {"s": "1244", "w": "“use NaOH; it forms hydrogen gas”", "y": "Changes the chemistry; NaOH gives no CO₂.", "c": "Use a gas syringe."}]}]}, {"id": "Q2", "tab": "Question 2", "name": "Question 2 — Qualitative analysis of R and S", "parts": [{"t": "2(a) Tests on R and S", "m": 8, "fac": 69, "ans": "<b>Test 1</b>: R fizzes, gas gives white ppt with limewater (CO₂), dissolves to a light blue solution; S dissolves to a light blue solution. <b>Test 2</b> (ammonia): light blue ppt, soluble in excess to dark blue. <b>Test 3</b> (NaOH): light blue ppt, insoluble in excess. <b>Test 4</b> (barium nitrate): white ppt. <b>Test 5</b> (silver nitrate on filtrate): R no ppt (stays light blue); S white ppt.", "err": "BaSO₄ ppt is WHITE; Cu(OH)₂ is INSOLUBLE in excess NaOH (soluble is ammonia); R has no chloride so no ppt; record the light-blue solution and the filtration.", "ex": [{"s": "1245", "w": "barium nitrate gives a “light blue precipitate”; NaOH copper ppt “dissolves”", "y": "Barium sulfate is white; copper ppt is insoluble in excess NaOH.", "c": "White ppt with barium nitrate; light blue ppt insoluble in excess NaOH."}, {"s": "1213", "w": "ammonia gives a “white ppt, insoluble → aluminium”", "y": "That is aluminium; copper gives light blue ppt, soluble in excess.", "c": "Light blue ppt, dissolves in excess to a dark blue solution."}, {"s": "1221", "w": "“S dissolves to a green solution”", "y": "Copper(II) gives a light blue solution, not green.", "c": "Dissolves to a light blue solution."}]}, {"t": "2(b) Compound common to R and S", "m": 2, "fac": 80, "ans": "<b>Copper(II) sulfate</b> — copper(II) from NaOH ppt insoluble in excess; sulfate from the white ppt with barium nitrate.", "err": "The common compound is the sulfate, not chloride (chloride is only in S).", "ex": [{"s": "1212", "w": "“copper(II) chloride”; copper shown by ammonia ppt insoluble", "y": "Chloride is only in S; ammonia ppt is soluble, not insoluble.", "c": "Copper(II) sulfate."}, {"s": "1242", "w": "“copper(II) chloride”", "y": "Chloride is not common to both R and S.", "c": "Copper(II) sulfate."}, {"s": "1213", "w": "“copper — ammonia gives a ppt insoluble in excess”", "y": "With ammonia the copper ppt is soluble (dark blue).", "c": "Copper from NaOH ppt insoluble in excess."}]}, {"t": "2(c) Other compound in R", "m": 2, "fac": 50, "ans": "<b>Sodium carbonate</b>. R is a Group I compound because all Group I compounds are soluble, and Test 1 showed carbonate (CO₂ with acid).", "err": "Both reasons are needed; many named a copper compound or gave only one reason.", "ex": [{"s": "1226", "w": "“copper(II) carbonate”", "y": "Copper carbonate is insoluble, but both R compounds are soluble; copper is already the common compound.", "c": "Sodium carbonate."}, {"s": "1236", "w": "“copper(II) nitrate”", "y": "No test shows nitrate; misses the carbonate from Test 1.", "c": "Sodium carbonate."}, {"s": "1212", "w": "“sodium carbonate” — carbonate reason only", "y": "Didn’t explain why it is a Group I (soluble) compound.", "c": "Group I (all soluble) + carbonate from CO₂ → sodium carbonate."}]}, {"t": "2(d) Other anion in S", "m": 1, "fac": 75, "ans": "<b>Chloride</b> (white ppt with silver nitrate in Test 5).", "err": "Watch the species: chloride, not chlorine.", "ex": [{"s": "1222", "w": "“chlorine”", "y": "Chlorine is the element/gas; the ion is chloride.", "c": "Chloride."}, {"s": "1230", "w": "“hydroxide”", "y": "No test showed hydroxide; the white ppt with silver nitrate shows chloride.", "c": "Chloride."}, {"s": "1231", "w": "“iodide”", "y": "Iodide gives a yellow ppt with silver nitrate, not white.", "c": "Chloride."}]}]}, {"id": "Q3", "tab": "Question 3", "name": "Question 3 — Effect of temperature on rate", "parts": [{"t": "3(a) Why the mass falls", "m": 1, "fac": 91, "ans": "<b>Hydrogen</b> gas is produced (Zn + 2HCl → ZnCl₂ + H₂) and escapes from the flask, so the mass decreases.", "err": "The loss is because gas leaves the flask.", "ex": [{"s": "1219", "w": "“the zinc dissolves and gets smaller”", "y": "Mass falls because gas leaves, not because zinc shrinks.", "c": "Hydrogen gas escapes, so the mass decreases."}, {"s": "1232", "w": "“the reactants form other products”", "y": "Doesn’t explain the loss — the gas must leave the system.", "c": "Hydrogen gas escapes from the flask."}]}, {"t": "3(b) Complete the Experiment 2 column", "m": 1, "fac": 62, "ans": "loss = 81.132 − reading, in mg: <b>18, 38, 56, 63, 65</b>.", "err": "Loss is measured from the start (81.132 g), in mg.", "ex": [{"s": "1231", "w": "“18, 20, 18, 7, 2”", "y": "These are differences between successive readings, not loss from the start.", "c": "18, 38, 56, 63, 65 mg"}, {"s": "1215", "w": "“0.018, 0.038, 0.056 …”", "y": "Correct method but not converted from g to mg.", "c": "18, 38, 56, 63, 65 mg"}, {"s": "1212", "w": "“21, 41, 55, 62, 65”", "y": "Arithmetic slips subtracting from 81.132.", "c": "18, 38, 56, 63, 65 mg"}]}, {"t": "3(c)(i) Plot Experiment 3 and draw the curve", "m": 2, "fac": 50, "ans": "Plot (0,0)(2,29)(5,54)(10,64)(15,66)(20,66) and draw <b>one smooth best-fit curve</b>.", "err": "A best-fit line is one smooth curve — not straight segments joining the points.", "ex": [{"s": "1212", "w": "straight segments joined dot-to-dot, kink at (2,29)", "y": "A best-fit line must be one smooth continuous curve.", "c": "Draw a single smooth curve through the points."}, {"s": "1225", "w": "“points fine but the curve kinks at (2,29)”", "y": "A kink means it isn’t a smooth best-fit.", "c": "One smooth curve, no corners."}, {"s": "1216", "w": "Experiment 3 not plotted", "y": "No points or curve for Experiment 3 (check faint pencil).", "c": "Plot the points, then a smooth curve."}]}, {"t": "3(c)(ii) Average rate over the first 7 minutes", "m": 3, "fac": 75, "ans": "Read the loss at 7 min off the Experiment 1 curve (≈ 39 mg): rate = 39 ÷ 7 = <b>5.57 mg/min</b>.", "err": "Read at 7 min (≈ 39, not the 5-min value 31) and give units mg/min.", "ex": [{"s": "1233", "w": "“5.57 g/min”", "y": "Units should be mg/min — the data is in mg.", "c": "5.57 mg/min"}, {"s": "1232", "w": "“39 ÷ 7 = 5.57” (no units)", "y": "No units given.", "c": "5.57 mg/min"}, {"s": "1214", "w": "“used 60 mg, rate = 8.57”", "y": "Misread the graph — loss at 7 min is ≈ 39 mg.", "c": "39 ÷ 7 = 5.57 mg/min"}]}, {"t": "3(d) How the student knew it had finished", "m": 1, "fac": 94, "ans": "The <b>loss in mass stays constant</b> (66 mg after 15 min), so no more gas is produced.", "err": "Conclude from the recorded data (constant mass).", "ex": [{"s": "1212", "w": "“the effervescence stopped”", "y": "Bubbling wasn’t measured; use the mass data.", "c": "The loss in mass stays constant (66 mg)."}, {"s": "1231", "w": "“the temperature reached a constant”", "y": "Temperature was fixed, not measured over time.", "c": "The loss in mass stays constant."}]}]}], "embeds": [{"id": "ws1", "tab": "🧪 Titration Worksheet", "caption": "Interactive Q1 titration worksheet — students enter their titration data and calculations here, then use the Question 1 tab to check against the model answers.", "html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>2020 O-Level Chemistry Practical – Q1 Titration</title>\n<link href=\"https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Nunito+Sans:wght@400;600&display=swap\" rel=\"stylesheet\">\n<style>\n  :root {\n    --bg: #f4f8ff;\n    --card: #fff;\n    --border: #e8edf5;\n    --mint: #b8f0d8;\n    --md: #2aaa78;\n    --md-dark: #1a8055;\n    --sky: #c8e8ff;\n    --sd: #70b8f0;\n    --lav: #d8d0f8;\n    --ld: #9b8ee8;\n    --lem: #fef0b8;\n    --led: #e8c840;\n    --tx: #1e293b;\n    --tm: #64748b;\n    --red: #fee2e2;\n    --red-b: #ef4444;\n    --green-b: #22c55e;\n  }\n  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }\n  body { font-family: 'Nunito Sans', sans-serif; background: var(--bg); color: var(--tx); font-size: 15px; line-height: 1.6; }\n  h1, h2, h3, .badge { font-family: 'Nunito', sans-serif; }\n\n  /* ── PROGRESS BAR ── */\n  #progress-bar {\n    position: sticky; top: 0; z-index: 200;\n    background: #1e293b; color: #fff;\n    padding: 10px 20px; display: flex; align-items: center; gap: 14px;\n    box-shadow: 0 2px 12px rgba(0,0,0,.25);\n  }\n  #progress-bar .label { font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 13px; white-space: nowrap; }\n  #prog-track { flex: 1; background: rgba(255,255,255,.15); border-radius: 99px; height: 10px; overflow: hidden; }\n  #prog-fill { height: 100%; background: linear-gradient(90deg,#2aaa78,#70b8f0); border-radius: 99px; transition: width .4s ease; width: 0%; }\n  #prog-text { font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 13px; white-space: nowrap; min-width: 80px; text-align: right; }\n\n  /* ── HEADER ── */\n  header {\n    background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #0e6e55 100%);\n    color: #fff; padding: 36px 24px 28px; text-align: center;\n  }\n  header h1 { font-size: clamp(1.3rem,3.5vw,2rem); font-weight: 900; letter-spacing: -0.5px; margin-bottom: 8px; }\n  header .eq-box {\n    display: inline-block; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.2);\n    border-radius: 12px; padding: 8px 22px; font-size: 1.05rem; font-weight: 700; margin: 10px 0 6px;\n    font-family: 'Nunito', sans-serif; letter-spacing: 0.5px;\n  }\n  header .sub { font-size: 0.82rem; opacity: .65; margin-top: 4px; }\n\n  /* ── LAYOUT ── */\n  .container { max-width: 900px; margin: 0 auto; padding: 24px 16px 60px; }\n\n  /* ── CARDS ── */\n  .card {\n    background: var(--card); border-radius: 18px; padding: 24px;\n    box-shadow: 0 2px 16px rgba(30,41,59,.07); margin-bottom: 22px;\n    border: 1.5px solid var(--border);\n  }\n  .card-blue { border-top: 4px solid var(--sd); }\n  .card-purple { border-top: 4px solid var(--ld); }\n  .card-green { border-top: 4px solid var(--md); }\n\n  /* ── SECTION BADGE ── */\n  .badge {\n    display: inline-flex; align-items: center; gap: 6px;\n    padding: 4px 14px; border-radius: 99px; font-size: 0.78rem; font-weight: 800;\n    margin-bottom: 14px; letter-spacing: 0.3px;\n  }\n  .badge-blue { background: var(--sky); color: #1565c0; }\n  .badge-purple { background: var(--lav); color: #5e35b1; }\n  .badge-green { background: var(--mint); color: var(--md-dark); }\n\n  /* ── INFO PILLS ── */\n  .pill-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }\n  .pill {\n    background: var(--lem); border: 1.5px solid var(--led); border-radius: 99px;\n    padding: 5px 14px; font-size: 0.82rem; font-weight: 600; color: #78350f;\n  }\n\n  /* ── STUDENT DETAILS ── */\n  .details-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }\n  @media(max-width:580px){ .details-grid { grid-template-columns: 1fr; } }\n  .field-label { font-weight: 700; font-size: 0.8rem; color: var(--tm); margin-bottom: 4px; }\n  .field-input {\n    width: 100%; border: 1.5px solid var(--border); border-radius: 10px;\n    padding: 9px 13px; font-family: 'Nunito Sans', sans-serif; font-size: 0.95rem;\n    color: var(--tx); background: var(--bg); outline: none; transition: border-color .2s;\n  }\n  .field-input:focus { border-color: var(--sd); background: #fff; }\n\n  /* ── TITRATION TABLE ── */\n  .tbl-wrap { overflow-x: auto; }\n  table.titration-tbl {\n    width: 100%; border-collapse: collapse; font-size: 0.88rem; min-width: 560px;\n  }\n  table.titration-tbl th, table.titration-tbl td {\n    border: 1.5px solid var(--border); padding: 7px 6px; text-align: center;\n  }\n  table.titration-tbl th.row-hdr {\n    background: var(--sky); color: #1565c0; font-weight: 700; text-align: left;\n    padding-left: 10px; min-width: 180px;\n  }\n  table.titration-tbl th.col-hdr { background: #1e3a5f; color: #fff; font-weight: 800; font-size: 0.82rem; }\n  table.titration-tbl .titre-cell { color: var(--md-dark); font-weight: 800; font-size: 0.95rem; }\n\n  .burette-input {\n    width: 80px; border: 1.5px solid var(--border); border-radius: 8px;\n    padding: 6px 4px; text-align: center; font-family: 'Nunito Sans', sans-serif;\n    font-size: 0.92rem; color: var(--tx); outline: none; transition: border-color .2s;\n  }\n  .burette-input:focus { border-color: var(--sd); }\n  .burette-input.precision-err { border-color: var(--red-b); background: #fff5f5; }\n\n  .check-cell input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--md); cursor: pointer; }\n  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-left: 4px; vertical-align: middle; }\n  .dot-green { background: var(--md); }\n  .dot-red { background: var(--red-b); }\n\n  /* concordance info */\n  #concordance-info {\n    margin-top: 12px; padding: 10px 16px; border-radius: 10px;\n    font-size: 0.85rem; font-weight: 600; display: none;\n  }\n  #concordance-info.ok { background: var(--mint); color: var(--md-dark); border: 1.5px solid var(--md); }\n  #concordance-info.warn { background: var(--red); color: #991b1b; border: 1.5px solid var(--red-b); }\n\n  /* average box */\n  #avg-box {\n    margin-top: 14px; background: var(--sky); border-radius: 12px;\n    padding: 12px 18px; display: none; font-weight: 700;\n    border: 1.5px solid var(--sd); color: #1565c0; font-size: 0.95rem;\n  }\n\n  /* precision warning area */\n  .precision-warn { color: var(--red-b); font-size: 0.78rem; margin-top: 3px; display: none; }\n\n  /* ── CHECKLIST ── */\n  .checklist-item {\n    display: flex; align-items: flex-start; gap: 12px;\n    padding: 12px 14px; border-radius: 12px; margin-bottom: 10px;\n    border: 1.5px solid var(--border); background: var(--bg); cursor: pointer;\n    transition: background .2s;\n  }\n  .checklist-item:hover { background: #eef4ff; }\n  .checklist-item input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--md); margin-top: 2px; flex-shrink: 0; }\n  .checklist-item label { cursor: pointer; font-size: 0.9rem; line-height: 1.5; }\n  .checklist-score { margin-top: 10px; font-weight: 700; font-size: 0.88rem; color: var(--tm); }\n\n  /* ── CALCULATION CARDS ── */\n  .calc-card {\n    border: 2px solid var(--lav); border-radius: 16px; padding: 20px;\n    margin-bottom: 18px; background: #faf9ff; position: relative;\n  }\n  .calc-card.locked { opacity: 0.5; pointer-events: none; }\n  .calc-card.correct { border-color: var(--md); background: #f0fdf7; }\n  .step-label { font-family: 'Nunito', sans-serif; font-weight: 900; color: var(--ld); font-size: 0.8rem; letter-spacing: 0.5px; margin-bottom: 6px; }\n  .step-q { font-weight: 700; font-size: 0.95rem; color: var(--tx); margin-bottom: 10px; }\n  .formula-pill {\n    display: inline-block; background: var(--lav); border-radius: 8px;\n    padding: 4px 12px; font-size: 0.82rem; font-weight: 600; color: #5e35b1;\n    margin-bottom: 12px; cursor: pointer; border: none;\n    font-family: 'Nunito Sans', sans-serif;\n  }\n  .hint-box {\n    background: var(--lav); border-radius: 10px; padding: 12px 14px;\n    margin-bottom: 12px; font-size: 0.85rem; color: #5e35b1; display: none; font-weight: 600;\n  }\n  .ans-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }\n  .ans-input {\n    border: 1.5px solid var(--border); border-radius: 10px; padding: 9px 13px;\n    font-family: 'Nunito Sans', sans-serif; font-size: 0.95rem; width: 200px;\n    outline: none; transition: border-color .2s; color: var(--tx);\n  }\n  .ans-input:focus { border-color: var(--ld); }\n  .ans-input.correct { border-color: var(--md); background: #f0fdf7; }\n  .ans-input.wrong { border-color: var(--red-b); background: #fff5f5; }\n  .unit-tag { font-weight: 700; color: var(--tm); font-size: 0.9rem; }\n  .btn { font-family: 'Nunito', sans-serif; font-weight: 800; border: none; border-radius: 10px; padding: 9px 18px; cursor: pointer; font-size: 0.88rem; transition: all .15s; }\n  .btn-check { background: var(--ld); color: #fff; }\n  .btn-check:hover { background: #7c3aed; }\n  .btn-hint { background: var(--lav); color: #5e35b1; }\n  .btn-hint:hover { background: #c4b5fd; }\n  .feedback { margin-top: 10px; font-size: 0.85rem; font-weight: 600; padding: 8px 14px; border-radius: 8px; display: none; }\n  .feedback.ok { background: var(--mint); color: var(--md-dark); }\n  .feedback.err { background: var(--red); color: #991b1b; }\n  .attempts-tag { font-size: 0.78rem; color: var(--tm); margin-top: 6px; }\n  .lock-icon { position: absolute; top: 14px; right: 16px; font-size: 1.1rem; color: var(--tm); }\n\n  /* ── COMPLETION SUMMARY ── */\n  #completion-card { display: none; }\n  .summary-tbl { width: 100%; border-collapse: collapse; font-size: 0.88rem; margin: 14px 0; }\n  .summary-tbl th { background: var(--mint); color: var(--md-dark); padding: 9px 12px; text-align: left; }\n  .summary-tbl td { padding: 9px 12px; border-bottom: 1px solid var(--border); }\n  .summary-tbl tr:last-child td { border-bottom: none; }\n  .conclusion-box {\n    background: var(--mint); border: 2px solid var(--md); border-radius: 12px;\n    padding: 14px 18px; font-weight: 700; color: var(--md-dark); font-size: 0.95rem; margin-top: 10px;\n  }\n  .btn-reset { background: #f1f5f9; color: var(--tx); border: 1.5px solid var(--border); margin-top: 14px; }\n  .btn-reset:hover { background: #e2e8f0; }\n\n  /* ── TEACHER REPORT ── */\n  #teacher-btn-wrap { text-align: center; margin-top: 40px; }\n  #teacher-btn {\n    background: none; border: 1.5px solid #cbd5e1; color: var(--tm); border-radius: 10px;\n    padding: 7px 18px; font-size: 0.78rem; cursor: pointer; font-family: 'Nunito', sans-serif;\n    font-weight: 700; transition: all .2s;\n  }\n  #teacher-btn:hover { border-color: var(--ld); color: var(--ld); }\n  #teacher-report {\n    display: none; background: #fff; border: 2px solid var(--border); border-radius: 18px;\n    padding: 28px; margin-top: 16px; font-size: 0.85rem;\n  }\n  #teacher-report h2 { font-size: 1.1rem; color: #1e293b; margin-bottom: 14px; }\n  #teacher-report h3 { font-size: 0.9rem; color: var(--tm); margin: 16px 0 8px; font-family: 'Nunito', sans-serif; font-weight: 800; border-bottom: 1px solid var(--border); padding-bottom: 4px; }\n  .report-tbl { width: 100%; border-collapse: collapse; font-size: 0.82rem; margin: 8px 0; }\n  .report-tbl th { background: #f1f5f9; padding: 7px 10px; text-align: left; font-weight: 700; }\n  .report-tbl td { padding: 7px 10px; border-bottom: 1px solid var(--border); }\n  .badge-ok { background: #d1fae5; color: #065f46; padding: 2px 8px; border-radius: 99px; font-size: 0.75rem; font-weight: 700; }\n  .badge-err { background: #fee2e2; color: #991b1b; padding: 2px 8px; border-radius: 99px; font-size: 0.75rem; font-weight: 700; }\n  .badge-pend { background: #f1f5f9; color: var(--tm); padding: 2px 8px; border-radius: 99px; font-size: 0.75rem; font-weight: 700; }\n  .concern-box { background: #fffbeb; border: 1.5px solid #fbbf24; border-radius: 10px; padding: 10px 14px; margin: 8px 0; font-size: 0.82rem; color: #92400e; }\n  .log-entry { font-size: 0.78rem; padding: 4px 0; border-bottom: 1px solid #f1f5f9; }\n  .log-entry.ok { color: var(--md-dark); }\n  .log-entry.err { color: #991b1b; }\n  .log-entry.hint { color: #5e35b1; }\n  textarea.teacher-notes {\n    width: 100%; border: 1.5px solid var(--border); border-radius: 10px;\n    padding: 10px; font-family: 'Nunito Sans', sans-serif; font-size: 0.85rem;\n    min-height: 80px; outline: none; margin-top: 8px;\n  }\n  .report-btns { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }\n  .btn-report { font-size: 0.82rem; padding: 7px 14px; border-radius: 8px; border: 1.5px solid var(--border); background: #f8fafc; cursor: pointer; font-family: 'Nunito', sans-serif; font-weight: 700; transition: all .2s; }\n  .btn-report:hover { background: var(--lav); border-color: var(--ld); color: #5e35b1; }\n</style>\n</head>\n<body>\n\n<!-- ── PROGRESS BAR ── -->\n<div id=\"progress-bar\">\n  <span class=\"label\">📊 Progress</span>\n  <div id=\"prog-track\"><div id=\"prog-fill\"></div></div>\n  <span id=\"prog-text\">0 / 4 · 0%</span>\n</div>\n\n<!-- ── HEADER ── -->\n<header>\n  <h1>2020 O-Level Chemistry Practical</h1>\n  <div class=\"eq-box\">HA + NaOH → NaA + H<sub>2</sub>O</div>\n  <p class=\"sub\">6092/03 · Question 1 · Sulfamic Acid Titration</p>\n  <p class=\"sub\">EVG Chemistry · Created by Ms Teng</p>\n</header>\n\n<div class=\"container\">\n\n  <!-- ── STUDENT DETAILS ── -->\n  <div class=\"card card-blue\">\n    <span class=\"badge badge-blue\">🔵 Student Details</span>\n    <div class=\"details-grid\">\n      <div>\n        <div class=\"field-label\">Student Name</div>\n        <input class=\"field-input\" id=\"stu-name\" type=\"text\" placeholder=\"Enter your name\" autocomplete=\"off\">\n      </div>\n      <div>\n        <div class=\"field-label\">Class</div>\n        <select class=\"field-input\" id=\"stu-class\">\n          <option value=\"\">— Select —</option>\n          <option value=\"4 Rsp\">4 Rsp</option>\n          <option value=\"4 Dyn\">4 Dyn</option>\n        </select>\n      </div>\n      <div>\n        <div class=\"field-label\">Date</div>\n        <input class=\"field-input\" id=\"stu-date\" type=\"text\" readonly>\n      </div>\n    </div>\n  </div>\n\n  <!-- ── GIVEN INFORMATION ── -->\n  <div class=\"card card-blue\">\n    <span class=\"badge badge-blue\">ℹ️ Given Information</span>\n    <div class=\"pill-row\">\n      <span class=\"pill\">P = 0.200 mol/dm³ sodium hydroxide (NaOH)</span>\n      <span class=\"pill\">Volume of Q = 25.0 cm³ (pipetted into conical flask)</span>\n      <span class=\"pill\">Mole ratio HA : NaOH = 1 : 1</span>\n      <span class=\"pill\">Indicator: thymolphthalein (T) — blue at end-point</span>\n    </div>\n    <p style=\"font-size:0.85rem;color:var(--tm);font-weight:600;\">\n      <strong>Note:</strong> Q (sulfamic acid solution) was made by diluting 100 cm³ of cleaning product to 1.00 dm³ with deionised water. P (NaOH) is added from the burette.\n    </p>\n  </div>\n\n  <!-- ── TITRATION TABLE ── -->\n  <div class=\"card card-blue\">\n    <span class=\"badge badge-blue\">🧪 Part (a)(i) — Titration Results</span>\n    <p style=\"font-size:0.85rem;color:var(--tm);font-weight:600;margin-bottom:14px;\">\n      Record all burette readings to 2 decimal places, with the last digit being 0 or 5 (e.g. 22.30, 0.00, 14.75). Tick the best concordant results.\n    </p>\n    <div class=\"tbl-wrap\">\n      <table class=\"titration-tbl\">\n        <thead>\n          <tr>\n            <th class=\"col-hdr\" style=\"text-align:left;padding-left:10px;\">Measurement</th>\n            <th class=\"col-hdr\">Titration 1</th>\n            <th class=\"col-hdr\">Titration 2</th>\n            <th class=\"col-hdr\">Titration 3</th>\n            <th class=\"col-hdr\">Titration 4</th>\n            <th class=\"col-hdr\">Titration 5</th>\n          </tr>\n        </thead>\n        <tbody>\n          <tr id=\"row-final\">\n            <th class=\"row-hdr\">Final burette reading / cm³</th>\n            <td><input class=\"burette-input\" id=\"f1\" type=\"number\" step=\"0.05\" placeholder=\"0.00\"><div class=\"precision-warn\" id=\"pw-f1\">⚠ Must end in .00 or .05</div></td>\n            <td><input class=\"burette-input\" id=\"f2\" type=\"number\" step=\"0.05\" placeholder=\"0.00\"><div class=\"precision-warn\" id=\"pw-f2\">⚠ Must end in .00 or .05</div></td>\n            <td><input class=\"burette-input\" id=\"f3\" type=\"number\" step=\"0.05\" placeholder=\"0.00\"><div class=\"precision-warn\" id=\"pw-f3\">⚠ Must end in .00 or .05</div></td>\n            <td><input class=\"burette-input\" id=\"f4\" type=\"number\" step=\"0.05\" placeholder=\"0.00\"><div class=\"precision-warn\" id=\"pw-f4\">⚠ Must end in .00 or .05</div></td>\n            <td><input class=\"burette-input\" id=\"f5\" type=\"number\" step=\"0.05\" placeholder=\"0.00\"><div class=\"precision-warn\" id=\"pw-f5\">⚠ Must end in .00 or .05</div></td>\n          </tr>\n          <tr id=\"row-initial\">\n            <th class=\"row-hdr\">Initial burette reading / cm³</th>\n            <td><input class=\"burette-input\" id=\"i1\" type=\"number\" step=\"0.05\" placeholder=\"0.00\"><div class=\"precision-warn\" id=\"pw-i1\">⚠ Must end in .00 or .05</div></td>\n            <td><input class=\"burette-input\" id=\"i2\" type=\"number\" step=\"0.05\" placeholder=\"0.00\"><div class=\"precision-warn\" id=\"pw-i2\">⚠ Must end in .00 or .05</div></td>\n            <td><input class=\"burette-input\" id=\"i3\" type=\"number\" step=\"0.05\" placeholder=\"0.00\"><div class=\"precision-warn\" id=\"pw-i3\">⚠ Must end in .00 or .05</div></td>\n            <td><input class=\"burette-input\" id=\"i4\" type=\"number\" step=\"0.05\" placeholder=\"0.00\"><div class=\"precision-warn\" id=\"pw-i4\">⚠ Must end in .00 or .05</div></td>\n            <td><input class=\"burette-input\" id=\"i5\" type=\"number\" step=\"0.05\" placeholder=\"0.00\"><div class=\"precision-warn\" id=\"pw-i5\">⚠ Must end in .00 or .05</div></td>\n          </tr>\n          <tr id=\"row-titre\">\n            <th class=\"row-hdr\">Volume of P used / cm³</th>\n            <td class=\"titre-cell\" id=\"t1\">—</td>\n            <td class=\"titre-cell\" id=\"t2\">—</td>\n            <td class=\"titre-cell\" id=\"t3\">—</td>\n            <td class=\"titre-cell\" id=\"t4\">—</td>\n            <td class=\"titre-cell\" id=\"t5\">—</td>\n          </tr>\n          <tr id=\"row-best\">\n            <th class=\"row-hdr\">Best titration results ✓</th>\n            <td class=\"check-cell\"><input type=\"checkbox\" id=\"c1\" onchange=\"updateConcordance()\"></td>\n            <td class=\"check-cell\"><input type=\"checkbox\" id=\"c2\" onchange=\"updateConcordance()\"></td>\n            <td class=\"check-cell\"><input type=\"checkbox\" id=\"c3\" onchange=\"updateConcordance()\"></td>\n            <td class=\"check-cell\"><input type=\"checkbox\" id=\"c4\" onchange=\"updateConcordance()\"></td>\n            <td class=\"check-cell\"><input type=\"checkbox\" id=\"c5\" onchange=\"updateConcordance()\"></td>\n          </tr>\n        </tbody>\n      </table>\n    </div>\n    <div id=\"concordance-info\"></div>\n    <div id=\"avg-box\"></div>\n  </div>\n\n  <!-- ── SELF-CHECK CHECKLIST ── -->\n  <div class=\"card card-blue\">\n    <span class=\"badge badge-blue\">✅ Self-Check Checklist</span>\n    <p style=\"font-size:0.85rem;color:var(--tm);font-weight:600;margin-bottom:14px;\">Tick each box once you are confident you have met the criterion.</p>\n\n    <div class=\"checklist-item\">\n      <input type=\"checkbox\" id=\"chk1\" onchange=\"updateChecklist()\">\n      <label for=\"chk1\"><strong>Correct precision:</strong> All burette readings are written to 2 decimal places, with the last digit being 0 or 5 (e.g. 22.30, 0.00, 14.75). Readings like 22.3 or 22.33 would be incorrect.</label>\n    </div>\n    <div class=\"checklist-item\">\n      <input type=\"checkbox\" id=\"chk2\" onchange=\"updateChecklist()\">\n      <label for=\"chk2\"><strong>Volume of P calculated correctly</strong> for each titration (Final − Initial burette reading).</label>\n    </div>\n    <div class=\"checklist-item\">\n      <input type=\"checkbox\" id=\"chk3\" onchange=\"updateChecklist()\">\n      <label for=\"chk3\"><strong>Concordant results selected</strong> — the chosen titrations are within ±0.20 cm³ of each other.</label>\n    </div>\n    <div class=\"checklist-score\" id=\"checklist-score\">Checklist: 0 / 3 ticked</div>\n  </div>\n\n  <!-- ── CALCULATION STEPS ── -->\n  <div class=\"card card-purple\">\n    <span class=\"badge badge-purple\">🟣 Part (a)(ii) — Average Volume of P</span>\n\n    <div class=\"calc-card\" id=\"card-aii\">\n      <div class=\"lock-icon\" id=\"lock-aii\" style=\"display:none;\">🔒</div>\n      <div class=\"step-label\">STEP a(ii)</div>\n      <div class=\"step-q\">From your titration results, calculate the <strong>average volume of P</strong> to be used in your calculations.</div>\n      <button class=\"formula-pill\" onclick=\"toggleHint('hint-aii')\">💡 Hint</button>\n      <div class=\"hint-box\" id=\"hint-aii\">Average volume = sum of selected concordant titres ÷ number of titres selected. Use only the ticked \"best\" results.</div>\n      <div class=\"ans-row\">\n        <input class=\"ans-input\" id=\"ans-aii\" type=\"number\" step=\"any\" placeholder=\"Enter average\">\n        <span class=\"unit-tag\">cm³</span>\n        <button class=\"btn btn-check\" onclick=\"checkAii()\">✔ Check</button>\n      </div>\n      <div class=\"feedback\" id=\"fb-aii\"></div>\n      <div class=\"attempts-tag\" id=\"att-aii\">Attempts: 0</div>\n    </div>\n  </div>\n\n  <div class=\"card card-purple\">\n    <span class=\"badge badge-purple\">🟣 Part (b)(i) — Moles of NaOH (P)</span>\n\n    <div class=\"calc-card locked\" id=\"card-bi\">\n      <div class=\"lock-icon\" id=\"lock-bi\">🔒</div>\n      <div class=\"step-label\">STEP b(i)</div>\n      <div class=\"step-q\">Using your average volume of P, calculate the <strong>number of moles of NaOH</strong> used in the titration.</div>\n      <button class=\"formula-pill\" onclick=\"toggleHint('hint-bi')\">💡 Hint</button>\n      <div class=\"hint-box\" id=\"hint-bi\">Moles = concentration × volume (cm³) ÷ 1000. Use concentration of P = 0.200 mol/dm³ and your average volume from Step a(ii).</div>\n      <div class=\"ans-row\">\n        <input class=\"ans-input\" id=\"ans-bi\" type=\"number\" step=\"any\" placeholder=\"Enter moles\">\n        <span class=\"unit-tag\">mol</span>\n        <button class=\"btn btn-check\" onclick=\"checkBi()\">✔ Check</button>\n      </div>\n      <div class=\"feedback\" id=\"fb-bi\"></div>\n      <div class=\"attempts-tag\" id=\"att-bi\">Attempts: 0</div>\n    </div>\n  </div>\n\n  <div class=\"card card-purple\">\n    <span class=\"badge badge-purple\">🟣 Part (b)(i) — Moles of Sulfamic Acid (HA)</span>\n\n    <div class=\"calc-card locked\" id=\"card-bi2\">\n      <div class=\"lock-icon\" id=\"lock-bi2\">🔒</div>\n      <div class=\"step-label\">STEP b(i) cont.</div>\n      <div class=\"step-q\">Using the mole ratio HA : NaOH = 1 : 1, calculate the <strong>number of moles of sulfamic acid (HA)</strong> in 25.0 cm³ of Q.</div>\n      <button class=\"formula-pill\" onclick=\"toggleHint('hint-bi2')\">💡 Hint</button>\n      <div class=\"hint-box\" id=\"hint-bi2\">Since mole ratio HA : NaOH = 1 : 1, moles of HA = moles of NaOH. Carry forward your answer from Step b(i).</div>\n      <div class=\"ans-row\">\n        <input class=\"ans-input\" id=\"ans-bi2\" type=\"number\" step=\"any\" placeholder=\"Enter moles\">\n        <span class=\"unit-tag\">mol</span>\n        <button class=\"btn btn-check\" onclick=\"checkBi2()\">✔ Check</button>\n      </div>\n      <div class=\"feedback\" id=\"fb-bi2\"></div>\n      <div class=\"attempts-tag\" id=\"att-bi2\">Attempts: 0</div>\n    </div>\n  </div>\n\n  <div class=\"card card-purple\">\n    <span class=\"badge badge-purple\">🟣 Part (b)(ii) — Concentration of Sulfamic Acid in Cleaning Product</span>\n\n    <div class=\"calc-card locked\" id=\"card-bii\">\n      <div class=\"lock-icon\" id=\"lock-bii\">🔒</div>\n      <div class=\"step-label\">STEP b(ii)</div>\n      <div class=\"step-q\">\n        Use your answer from (b)(i) to calculate the <strong>concentration of sulfamic acid (HA) in the original cleaning product</strong>, in mol/dm³.<br>\n        <span style=\"font-size:0.83rem;color:var(--tm);font-weight:600;margin-top:6px;display:block;\">\n          Recall: Solution Q was made by diluting <strong>100 cm³</strong> of cleaning product to <strong>1000 cm³</strong> (dilution factor = 10). You pipetted <strong>25.0 cm³</strong> of Q.\n        </span>\n      </div>\n      <button class=\"formula-pill\" onclick=\"toggleHint('hint-bii')\">💡 Hint</button>\n      <div class=\"hint-box\" id=\"hint-bii\">\n        <strong>Two-step approach:</strong><br>\n        1. Concentration of HA in Q = moles of HA ÷ volume of Q in dm³ = moles ÷ 0.0250<br>\n        2. Concentration in cleaning product = concentration in Q × dilution factor = concentration × 10<br><br>\n        <em>Or in one step:</em> concentration = moles of HA × (1000 ÷ 25.0) × 10\n      </div>\n      <div class=\"ans-row\">\n        <input class=\"ans-input\" id=\"ans-bii\" type=\"number\" step=\"any\" placeholder=\"Enter concentration\">\n        <span class=\"unit-tag\">mol/dm³</span>\n        <button class=\"btn btn-check\" onclick=\"checkBii()\">✔ Check</button>\n      </div>\n      <div class=\"feedback\" id=\"fb-bii\"></div>\n      <div class=\"attempts-tag\" id=\"att-bii\">Attempts: 0</div>\n    </div>\n  </div>\n\n  <!-- ── COMPLETION SUMMARY ── -->\n  <div class=\"card card-green\" id=\"completion-card\">\n    <span class=\"badge badge-green\">🎉 All Steps Complete!</span>\n    <h2 style=\"font-family:'Nunito',sans-serif;font-size:1.1rem;margin-bottom:12px;color:var(--md-dark);\">Summary of Your Answers</h2>\n    <table class=\"summary-tbl\">\n      <thead>\n        <tr>\n          <th>Part</th>\n          <th>What You Calculated</th>\n          <th>Your Answer</th>\n          <th>Unit</th>\n        </tr>\n      </thead>\n      <tbody>\n        <tr>\n          <td><strong>a(ii)</strong></td>\n          <td>Average volume of P (NaOH)</td>\n          <td id=\"sum-aii\">—</td>\n          <td>cm³</td>\n        </tr>\n        <tr>\n          <td><strong>b(i)</strong></td>\n          <td>Moles of NaOH used</td>\n          <td id=\"sum-bi\">—</td>\n          <td>mol</td>\n        </tr>\n        <tr>\n          <td><strong>b(i) cont.</strong></td>\n          <td>Moles of sulfamic acid (HA) in 25.0 cm³ of Q</td>\n          <td id=\"sum-bi2\">—</td>\n          <td>mol</td>\n        </tr>\n        <tr>\n          <td><strong>b(ii)</strong></td>\n          <td>Concentration of HA in cleaning product</td>\n          <td id=\"sum-bii\">—</td>\n          <td>mol/dm³</td>\n        </tr>\n      </tbody>\n    </table>\n    <div class=\"conclusion-box\" id=\"conclusion-box\"></div>\n    <button class=\"btn btn-reset\" onclick=\"resetAll()\">🔄 Reset All Answers</button>\n  </div>\n\n  <!-- ── TEACHER REPORT ── -->\n  <div id=\"teacher-btn-wrap\">\n    <button id=\"teacher-btn\" onclick=\"toggleTeacherReport()\">🔐 Teacher Report</button>\n  </div>\n  <div id=\"teacher-report\">\n    <h2>🔐 Teacher Feedback Report</h2>\n    <div id=\"report-content\"></div>\n    <h3>Teacher Notes</h3>\n    <textarea class=\"teacher-notes\" id=\"teacher-notes\" placeholder=\"Add your observations here…\"></textarea>\n    <div class=\"report-btns\">\n      <button class=\"btn-report\" onclick=\"renderReport()\">🔄 Refresh Report</button>\n      <button class=\"btn-report\" onclick=\"copyReport()\">📋 Copy as Text</button>\n      <button class=\"btn-report\" onclick=\"saveReportImage()\">📸 Save as Image</button>\n      <button class=\"btn-report\" onclick=\"window.print()\">🖨️ Print Report</button>\n    </div>\n  </div>\n\n</div><!-- /container -->\n\n<script>\n// ═══════════════════════════════════════════\n// STATE\n// ═══════════════════════════════════════════\nconst state = {\n  startTime: Date.now(),\n  correctSteps: { aii: false, bi: false, bi2: false, bii: false, checklist: false },\n  answers: { aii: null, bi: null, bi2: null, bii: null },\n  attempts: { aii: 0, bi: 0, bi2: 0, bii: 0 },\n  hintsUsed: { aii: false, bi: false, bi2: false, bii: false },\n  hintOpen: { aii: false, bi: false, bi2: false, bii: false },\n  log: []\n};\nconst TOTAL_STEPS = 5; // aii, bi, bi2, bii, checklist\n\n// ═══════════════════════════════════════════\n// LOGGING\n// ═══════════════════════════════════════════\nfunction pushLog(type, msg) {\n  if (type === 'info') return;\n  state.log.push({ type, msg, time: new Date().toLocaleTimeString() });\n}\n\n// ═══════════════════════════════════════════\n// INIT\n// ═══════════════════════════════════════════\nwindow.onload = function() {\n  const d = new Date();\n  document.getElementById('stu-date').value = d.toLocaleDateString('en-GB', {day:'2-digit',month:'short',year:'numeric'});\n\n  // Burette blur handlers\n  for (let i = 1; i <= 5; i++) {\n    ['f','i'].forEach(prefix => {\n      const el = document.getElementById(prefix + i);\n      el.addEventListener('blur', () => handleBuretteBlur(prefix + i));\n      el.addEventListener('input', () => calcTitre(i));\n    });\n  }\n  updateProgress();\n};\n\n// ═══════════════════════════════════════════\n// BURETTE PRECISION\n// ═══════════════════════════════════════════\nfunction isPrecisionOk(val) {\n  const r = Math.round(val * 100) % 5;\n  return r === 0;\n}\n\nfunction handleBuretteBlur(id) {\n  const el = document.getElementById(id);\n  const warnEl = document.getElementById('pw-' + id);\n  if (el.value === '' || el.value === null) return;\n  const v = parseFloat(el.value);\n  if (isNaN(v)) return;\n  el.value = v.toFixed(2);\n  if (!isPrecisionOk(v)) {\n    el.classList.add('precision-err');\n    warnEl.style.display = 'block';\n    pushLog('err', `Precision error: ${id} = ${el.value} (not a multiple of 0.05)`);\n  } else {\n    el.classList.remove('precision-err');\n    warnEl.style.display = 'none';\n  }\n  const idx = parseInt(id.slice(1));\n  calcTitre(idx);\n}\n\n// ═══════════════════════════════════════════\n// TITRE CALCULATION\n// ═══════════════════════════════════════════\nfunction calcTitre(idx) {\n  const fEl = document.getElementById('f' + idx);\n  const iEl = document.getElementById('i' + idx);\n  const tEl = document.getElementById('t' + idx);\n  const fv = parseFloat(fEl.value);\n  const iv = parseFloat(iEl.value);\n  if (!isNaN(fv) && !isNaN(iv) && fv > iv) {\n    const titre = (fv - iv).toFixed(2);\n    tEl.textContent = titre;\n  } else {\n    tEl.textContent = '—';\n  }\n  updateConcordance();\n}\n\n// ═══════════════════════════════════════════\n// CONCORDANCE & AVERAGE\n// ═══════════════════════════════════════════\nfunction getSelectedTitres() {\n  const vals = [];\n  for (let i = 1; i <= 5; i++) {\n    const cb = document.getElementById('c' + i);\n    if (cb.checked) {\n      const tEl = document.getElementById('t' + i);\n      const v = parseFloat(tEl.textContent);\n      if (!isNaN(v)) vals.push({ idx: i, val: v });\n    }\n  }\n  return vals;\n}\n\nfunction updateConcordance() {\n  const sel = getSelectedTitres();\n  const ci = document.getElementById('concordance-info');\n  const avgBox = document.getElementById('avg-box');\n\n  if (sel.length < 2) {\n    ci.style.display = 'none';\n    avgBox.style.display = 'none';\n    return;\n  }\n\n  const vals = sel.map(s => s.val);\n  const range = (Math.max(...vals) - Math.min(...vals)).toFixed(2);\n  const concordant = parseFloat(range) <= 0.20;\n  const avg = (vals.reduce((a,b)=>a+b,0) / vals.length).toFixed(2);\n\n  // Coloured dots\n  for (let i = 1; i <= 5; i++) {\n    const tEl = document.getElementById('t' + i);\n    const existingDot = tEl.querySelector('.dot');\n    if (existingDot) existingDot.remove();\n  }\n  sel.forEach(s => {\n    const tEl = document.getElementById('t' + s.idx);\n    const dot = document.createElement('span');\n    dot.className = 'dot ' + (concordant ? 'dot-green' : 'dot-red');\n    tEl.appendChild(dot);\n  });\n\n  ci.style.display = 'block';\n  if (concordant) {\n    ci.className = 'ok';\n    ci.textContent = `✅ Range = ${range} cm³ — within ±0.20 cm³. Results are concordant.`;\n  } else {\n    ci.className = 'warn';\n    ci.textContent = `⚠ Range = ${range} cm³ — exceeds ±0.20 cm³. Results are NOT concordant. Review your selections.`;\n  }\n\n  avgBox.style.display = 'block';\n  avgBox.innerHTML = `📐 <strong>Average volume of P</strong> from selected titrations = <strong>${avg} cm³</strong>`;\n}\n\n// ═══════════════════════════════════════════\n// CHECKLIST\n// ═══════════════════════════════════════════\nfunction updateChecklist() {\n  const all = ['chk1','chk2','chk3'].every(id => document.getElementById(id).checked);\n  const count = ['chk1','chk2','chk3'].filter(id => document.getElementById(id).checked).length;\n  document.getElementById('checklist-score').textContent = `Checklist: ${count} / 3 ticked`;\n\n  if (all && !state.correctSteps.checklist) {\n    state.correctSteps.checklist = true;\n    pushLog('ok', 'Self-check checklist completed (3/3)');\n    updateProgress();\n  } else if (!all) {\n    state.correctSteps.checklist = false;\n    updateProgress();\n  }\n}\n\n// ═══════════════════════════════════════════\n// HINT TOGGLE\n// ═══════════════════════════════════════════\nfunction toggleHint(id) {\n  const el = document.getElementById(id);\n  const key = id.replace('hint-','');\n  const isOpen = el.style.display === 'block';\n  el.style.display = isOpen ? 'none' : 'block';\n  if (!isOpen && !state.hintsUsed[key]) {\n    state.hintsUsed[key] = true;\n    pushLog('hint', `Hint revealed for Step ${key}`);\n  }\n}\n\n// ═══════════════════════════════════════════\n// TOLERANCE CHECKER\n// ═══════════════════════════════════════════\nfunction withinTolerance(student, expected, tol) {\n  return Math.abs(parseFloat(student) - parseFloat(expected)) <= tol;\n}\n\n// ═══════════════════════════════════════════\n// STEP a(ii) — AVERAGE VOLUME\n// ═══════════════════════════════════════════\nfunction checkAii() {\n  const sel = getSelectedTitres();\n  if (sel.length < 2) {\n    showFeedback('fb-aii', 'err', 'Please tick at least 2 concordant titration results in the table first.');\n    return;\n  }\n\n  const vals = sel.map(s => s.val);\n  const range = Math.max(...vals) - Math.min(...vals);\n  if (range > 0.20) {\n    showFeedback('fb-aii', 'err', 'Your selected titrations are not concordant (range > 0.20 cm³). Go back and review your \"Best titration results\" selection.');\n    return;\n  }\n\n  const expected = vals.reduce((a,b)=>a+b,0) / vals.length;\n  const studentAns = parseFloat(document.getElementById('ans-aii').value);\n  state.attempts.aii++;\n  document.getElementById('att-aii').textContent = `Attempts: ${state.attempts.aii}`;\n\n  if (isNaN(studentAns)) {\n    showFeedback('fb-aii', 'err', 'Please enter a numerical value.');\n    return;\n  }\n\n  if (withinTolerance(studentAns, expected, 0.01)) {\n    state.answers.aii = studentAns;\n    state.correctSteps.aii = true;\n    document.getElementById('ans-aii').classList.add('correct');\n    document.getElementById('card-aii').classList.add('correct');\n    showFeedback('fb-aii', 'ok', `✔ Correct! Average volume of P = ${expected.toFixed(2)} cm³`);\n    pushLog('ok', `a(ii) correct: ${studentAns} cm³ (attempt ${state.attempts.aii})`);\n    unlockStep('bi');\n    updateProgress();\n  } else {\n    document.getElementById('ans-aii').classList.add('wrong');\n    showFeedback('fb-aii', 'err', `✘ Not quite. Check: sum ÷ number of selected titres. Do not round intermediate values.`);\n    pushLog('err', `a(ii) wrong: entered ${studentAns}, expected ≈${expected.toFixed(2)} (attempt ${state.attempts.aii})`);\n    setTimeout(()=>document.getElementById('ans-aii').classList.remove('wrong'), 1500);\n  }\n}\n\n// ═══════════════════════════════════════════\n// STEP b(i) — MOLES OF NaOH\n// ═══════════════════════════════════════════\nfunction checkBi() {\n  if (!state.correctSteps.aii) return;\n  const avgVol = state.answers.aii;\n  const expected = 0.200 * avgVol / 1000;\n  const studentAns = parseFloat(document.getElementById('ans-bi').value);\n  state.attempts.bi++;\n  document.getElementById('att-bi').textContent = `Attempts: ${state.attempts.bi}`;\n\n  if (isNaN(studentAns)) { showFeedback('fb-bi','err','Please enter a numerical value.'); return; }\n\n  if (withinTolerance(studentAns, expected, expected * 0.005 + 0.00005)) {\n    state.answers.bi = studentAns;\n    state.correctSteps.bi = true;\n    document.getElementById('ans-bi').classList.add('correct');\n    document.getElementById('card-bi').classList.add('correct');\n    showFeedback('fb-bi', 'ok', `✔ Correct! Moles of NaOH = concentration × volume ÷ 1000 = 0.200 × ${avgVol.toFixed(2)} ÷ 1000 = ${expected.toFixed(5)} mol`);\n    pushLog('ok', `b(i) correct: ${studentAns} mol (attempt ${state.attempts.bi})`);\n    unlockStep('bi2');\n    updateProgress();\n  } else {\n    document.getElementById('ans-bi').classList.add('wrong');\n    showFeedback('fb-bi', 'err', `✘ Not quite. Recall: moles = concentration × volume (cm³) ÷ 1000. Use your average volume from Step a(ii).`);\n    pushLog('err', `b(i) wrong: entered ${studentAns}, expected ≈${expected.toFixed(5)} (attempt ${state.attempts.bi})`);\n    setTimeout(()=>document.getElementById('ans-bi').classList.remove('wrong'), 1500);\n  }\n}\n\n// ═══════════════════════════════════════════\n// STEP b(i) cont. — MOLES OF HA\n// ═══════════════════════════════════════════\nfunction checkBi2() {\n  if (!state.correctSteps.bi) return;\n  const expected = state.answers.bi; // 1:1 ratio\n  const studentAns = parseFloat(document.getElementById('ans-bi2').value);\n  state.attempts.bi2++;\n  document.getElementById('att-bi2').textContent = `Attempts: ${state.attempts.bi2}`;\n\n  if (isNaN(studentAns)) { showFeedback('fb-bi2','err','Please enter a numerical value.'); return; }\n\n  if (withinTolerance(studentAns, expected, expected * 0.005 + 0.00005)) {\n    state.answers.bi2 = studentAns;\n    state.correctSteps.bi2 = true;\n    document.getElementById('ans-bi2').classList.add('correct');\n    document.getElementById('card-bi2').classList.add('correct');\n    showFeedback('fb-bi2', 'ok', `✔ Correct! Since HA : NaOH = 1 : 1, moles of HA = ${expected.toFixed(5)} mol`);\n    pushLog('ok', `b(i)-HA correct: ${studentAns} mol (attempt ${state.attempts.bi2})`);\n    unlockStep('bii');\n    updateProgress();\n  } else {\n    document.getElementById('ans-bi2').classList.add('wrong');\n    showFeedback('fb-bi2', 'err', `✘ Not quite. Check the mole ratio: HA : NaOH = 1 : 1. Your answer for moles of HA should equal moles of NaOH.`);\n    pushLog('err', `b(i)-HA wrong: entered ${studentAns}, expected ≈${expected.toFixed(5)} (attempt ${state.attempts.bi2})`);\n    setTimeout(()=>document.getElementById('ans-bi2').classList.remove('wrong'), 1500);\n  }\n}\n\n// ═══════════════════════════════════════════\n// STEP b(ii) — CONCENTRATION IN CLEANING PRODUCT\n// ═══════════════════════════════════════════\nfunction checkBii() {\n  if (!state.correctSteps.bi2) return;\n  const molesHA = state.answers.bi2;\n  // Concentration in Q = moles / 0.025 dm³; then × 10 for dilution factor\n  const concInQ = molesHA / 0.025;\n  const expected = concInQ * 10;\n  const studentAns = parseFloat(document.getElementById('ans-bii').value);\n  state.attempts.bii++;\n  document.getElementById('att-bii').textContent = `Attempts: ${state.attempts.bii}`;\n\n  if (isNaN(studentAns)) { showFeedback('fb-bii','err','Please enter a numerical value.'); return; }\n\n  if (withinTolerance(studentAns, expected, expected * 0.005 + 0.0005)) {\n    state.answers.bii = studentAns;\n    state.correctSteps.bii = true;\n    document.getElementById('ans-bii').classList.add('correct');\n    document.getElementById('card-bii').classList.add('correct');\n    showFeedback('fb-bii', 'ok',\n      `✔ Correct! Concentration in Q = ${molesHA.toFixed(5)} ÷ 0.025 = ${concInQ.toFixed(4)} mol/dm³. ` +\n      `Concentration in cleaning product = ${concInQ.toFixed(4)} × 10 = ${expected.toFixed(3)} mol/dm³`);\n    pushLog('ok', `b(ii) correct: ${studentAns} mol/dm³ (attempt ${state.attempts.bii})`);\n    updateProgress();\n    checkCompletion();\n  } else {\n    document.getElementById('ans-bii').classList.add('wrong');\n    showFeedback('fb-bii', 'err',\n      `✘ Not quite. Remember two things: (1) convert 25.0 cm³ to dm³ (÷ 1000), and (2) apply the dilution factor — Q was made by diluting 100 cm³ to 1000 cm³, so multiply by 10.`);\n    pushLog('err', `b(ii) wrong: entered ${studentAns}, expected ≈${expected.toFixed(4)} (attempt ${state.attempts.bii})`);\n    setTimeout(()=>document.getElementById('ans-bii').classList.remove('wrong'), 1500);\n  }\n}\n\n// ═══════════════════════════════════════════\n// HELPERS\n// ═══════════════════════════════════════════\nfunction showFeedback(id, type, msg) {\n  const el = document.getElementById(id);\n  el.className = 'feedback ' + type;\n  el.textContent = msg;\n  el.style.display = 'block';\n}\n\nfunction unlockStep(key) {\n  const card = document.getElementById('card-' + key);\n  const lock = document.getElementById('lock-' + key);\n  card.classList.remove('locked');\n  lock.style.display = 'none';\n}\n\n// ═══════════════════════════════════════════\n// PROGRESS BAR\n// ═══════════════════════════════════════════\nfunction updateProgress() {\n  const done = Object.values(state.correctSteps).filter(Boolean).length;\n  const pct = Math.round((done / TOTAL_STEPS) * 100);\n  document.getElementById('prog-fill').style.width = pct + '%';\n  document.getElementById('prog-text').textContent = `${done} / ${TOTAL_STEPS} · ${pct}%`;\n}\n\n// ═══════════════════════════════════════════\n// COMPLETION\n// ═══════════════════════════════════════════\nfunction checkCompletion() {\n  const allCalcDone = state.correctSteps.aii && state.correctSteps.bi && state.correctSteps.bi2 && state.correctSteps.bii;\n  if (!allCalcDone) return;\n  const card = document.getElementById('completion-card');\n  card.style.display = 'block';\n\n  document.getElementById('sum-aii').textContent = state.answers.aii.toFixed(2);\n  document.getElementById('sum-bi').textContent = state.answers.bi.toFixed(5);\n  document.getElementById('sum-bi2').textContent = state.answers.bi2.toFixed(5);\n  document.getElementById('sum-bii').textContent = state.answers.bii.toFixed(3);\n  document.getElementById('conclusion-box').innerHTML =\n    `📌 The concentration of sulfamic acid (HA) in the cleaning product is <strong>${state.answers.bii.toFixed(3)} mol/dm³</strong>.`;\n  card.scrollIntoView({ behavior: 'smooth', block: 'start' });\n}\n\n// ═══════════════════════════════════════════\n// RESET\n// ═══════════════════════════════════════════\nfunction resetAll() {\n  if (!confirm('Reset all answers? This cannot be undone.')) return;\n  location.reload();\n}\n\n// ═══════════════════════════════════════════\n// TEACHER REPORT\n// ═══════════════════════════════════════════\nfunction toggleTeacherReport() {\n  const rpt = document.getElementById('teacher-report');\n  if (rpt.style.display === 'none' || rpt.style.display === '') {\n    rpt.style.display = 'block';\n    renderReport();\n  } else {\n    rpt.style.display = 'none';\n  }\n}\n\nfunction renderReport() {\n  const name = document.getElementById('stu-name').value || '(not entered)';\n  const cls = document.getElementById('stu-class').value || '(not entered)';\n  const date = document.getElementById('stu-date').value;\n  const elapsed = Math.round((Date.now() - state.startTime) / 60000);\n  const now = new Date().toLocaleString('en-GB');\n\n  const scoreMap = { aii: 'a(ii)', bi: 'b(i) NaOH', bi2: 'b(i) HA', bii: 'b(ii) Conc.' };\n  let scoreBadges = '';\n  Object.entries(state.correctSteps).forEach(([k,v]) => {\n    const label = scoreMap[k] || 'Checklist';\n    scoreBadges += `<span class=\"${v?'badge-ok':'badge-pend'}\" style=\"margin-right:6px\">${v?'✅':'⏳'} ${label}</span>`;\n  });\n  const totalScore = Object.values(state.correctSteps).filter(Boolean).length;\n\n  // Concerns\n  let concerns = '';\n  ['aii','bi','bi2','bii'].forEach(k => {\n    if (state.attempts[k] >= 3 || (state.hintsUsed[k] && !state.correctSteps[k])) {\n      concerns += `<div class=\"concern-box\">⚠ Step ${scoreMap[k]}: ${state.attempts[k]} attempt(s), hint used: ${state.hintsUsed[k]?'Yes':'No'}, completed: ${state.correctSteps[k]?'Yes':'No'}</div>`;\n    }\n  });\n  if (!concerns) concerns = '<p style=\"color:var(--md-dark);font-size:0.82rem\">No concerns flagged ✅</p>';\n\n  // Titration table\n  let titRows = '';\n  for (let i = 1; i <= 5; i++) {\n    const fv = document.getElementById('f'+i).value || '—';\n    const iv = document.getElementById('i'+i).value || '—';\n    const tv = document.getElementById('t'+i).textContent || '—';\n    const cb = document.getElementById('c'+i).checked ? '✓' : '';\n    const hasErr = document.getElementById('f'+i).classList.contains('precision-err') || document.getElementById('i'+i).classList.contains('precision-err');\n    titRows += `<tr><td>${i}</td><td>${fv}</td><td>${iv}</td><td>${tv}</td><td>${cb}</td><td>${hasErr?'<span class=\"badge-err\">Error</span>':'<span class=\"badge-ok\">OK</span>'}</td></tr>`;\n  }\n\n  // Calculation table\n  const calcRows = [\n    { part: 'a(ii)', ans: state.answers.aii, unit: 'cm³', key: 'aii' },\n    { part: 'b(i) NaOH', ans: state.answers.bi, unit: 'mol', key: 'bi' },\n    { part: 'b(i) HA', ans: state.answers.bi2, unit: 'mol', key: 'bi2' },\n    { part: 'b(ii) Conc.', ans: state.answers.bii, unit: 'mol/dm³', key: 'bii' },\n  ].map(r => {\n    const done = state.correctSteps[r.key];\n    const expVal = done ? (r.ans !== null ? Number(r.ans).toFixed(5) : '—') : '—';\n    return `<tr>\n      <td>${r.part}</td>\n      <td>${r.ans !== null ? Number(r.ans) : '—'}</td>\n      <td>${expVal}</td>\n      <td>${r.unit}</td>\n      <td>${done ? '<span class=\"badge-ok\">✅ Correct</span>' : '<span class=\"badge-pend\">⏳ Pending</span>'}</td>\n      <td>${state.attempts[r.key]}</td>\n      <td>${state.hintsUsed[r.key] ? 'Yes' : 'No'}</td>\n    </tr>`;\n  }).join('');\n\n  // Checklist\n  const chkStatus = ['chk1','chk2','chk3'].map((id,i) =>\n    `<div style=\"margin:2px 0\">${document.getElementById(id).checked?'☑':'☐'} Item ${i+1}</div>`\n  ).join('');\n\n  // Log\n  const logHtml = state.log.length ? state.log.map(l =>\n    `<div class=\"log-entry ${l.type}\">[${l.time}] ${l.msg}</div>`\n  ).join('') : '<div class=\"log-entry\" style=\"color:var(--tm)\">No events logged yet.</div>';\n\n  document.getElementById('report-content').innerHTML = `\n    <h3>Student Info</h3>\n    <table class=\"report-tbl\">\n      <tr><th>Name</th><td>${name}</td><th>Class</th><td>${cls}</td></tr>\n      <tr><th>Date</th><td>${date}</td><th>Time Elapsed</th><td>${elapsed} min</td></tr>\n      <tr><th>Generated</th><td colspan=\"3\">${now}</td></tr>\n    </table>\n\n    <h3>Score Overview</h3>\n    <div style=\"margin-bottom:8px\">${scoreBadges}</div>\n    <p style=\"font-weight:700;font-size:0.85rem\">Total: ${totalScore} / ${TOTAL_STEPS}</p>\n\n    <h3>Concern Flags</h3>\n    ${concerns}\n\n    <h3>Titration Data</h3>\n    <table class=\"report-tbl\">\n      <thead><tr><th>#</th><th>Final (cm³)</th><th>Initial (cm³)</th><th>Volume (cm³)</th><th>Included</th><th>Precision</th></tr></thead>\n      <tbody>${titRows}</tbody>\n    </table>\n\n    <h3>Calculation Attempts</h3>\n    <table class=\"report-tbl\">\n      <thead><tr><th>Part</th><th>Student Answer</th><th>Expected</th><th>Unit</th><th>Result</th><th>Attempts</th><th>Hint Used?</th></tr></thead>\n      <tbody>${calcRows}</tbody>\n    </table>\n\n    <h3>Self-Check Checklist</h3>\n    ${chkStatus}\n\n    <h3>Key Events Log</h3>\n    <div style=\"max-height:200px;overflow-y:auto;padding:6px;border:1px solid var(--border);border-radius:8px\">${logHtml}</div>\n  `;\n}\n\nfunction copyReport() {\n  const name = document.getElementById('stu-name').value || 'Student';\n  const cls = document.getElementById('stu-class').value || '';\n  const date = document.getElementById('stu-date').value;\n  const elapsed = Math.round((Date.now() - state.startTime) / 60000);\n  let txt = `TEACHER REPORT — 2020 O-Level Practical Q1 Titration\\n`;\n  txt += `Student: ${name} | Class: ${cls} | Date: ${date} | Time: ${elapsed} min\\n\\n`;\n  txt += `SCORES:\\n`;\n  ['aii','bi','bi2','bii','checklist'].forEach(k => {\n    txt += `  ${k}: ${state.correctSteps[k] ? 'Correct' : 'Pending'}\\n`;\n  });\n  txt += `\\nATTEMPTS:\\n`;\n  ['aii','bi','bi2','bii'].forEach(k => {\n    txt += `  ${k}: ${state.attempts[k]} attempt(s), hint: ${state.hintsUsed[k]?'Yes':'No'}\\n`;\n  });\n  txt += `\\nKEY EVENTS:\\n`;\n  state.log.forEach(l => { txt += `  [${l.time}] ${l.msg}\\n`; });\n  const notes = document.getElementById('teacher-notes').value;\n  if (notes) txt += `\\nTEACHER NOTES:\\n${notes}\\n`;\n  navigator.clipboard.writeText(txt).then(()=>alert('Report copied to clipboard!')).catch(()=>alert('Copy failed — please copy manually.'));\n}\n\nfunction saveReportImage() {\n  const name = document.getElementById('stu-name').value || 'Student';\n  const date = document.getElementById('stu-date').value.replace(/\\s/g,'_');\n  const filename = `report_${name}_${date}.png`;\n\n  if (typeof html2canvas === 'undefined') {\n    const script = document.createElement('script');\n    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';\n    script.onload = () => captureImage(filename);\n    document.head.appendChild(script);\n  } else {\n    captureImage(filename);\n  }\n}\n\nfunction captureImage(filename) {\n  const el = document.getElementById('teacher-report');\n  html2canvas(el, { backgroundColor: '#ffffff', scale: 2 }).then(canvas => {\n    const link = document.createElement('a');\n    link.download = filename;\n    link.href = canvas.toDataURL('image/png');\n    link.click();\n  });\n}\n<\/script>\n</body>\n</html>\n"}]}; const GOOD=CFG.good, MIXED=CFG.mixed;
function band(f){if(f===null||f===undefined)return{cls:"b-na",lab:"Not assessed"};if(f>=GOOD)return{cls:"b-good",lab:"Did well "+f+"%"};if(f>=MIXED)return{cls:"b-mix",lab:"Mixed "+f+"%"};return{cls:"b-bad",lab:"Struggled "+f+"%"};}
function fc(f){return f>=GOOD?"var(--good)":f>=MIXED?"var(--mix)":"var(--bad)";}
// tabs
let tabsH='<button class="tab active" data-p="ov">📊 Overview</button>';
CFG.questions.forEach((q,i)=>{tabsH+=`<button class="tab" data-p="${q.id}">${q.tab||q.id}</button>`;});
(CFG.embeds||[]).forEach(e=>{tabsH+=`<button class="tab" data-p="${e.id}">${e.tab}</button>`;});
tabsH+='<button class="btn" id="toggleAll">Reveal all answers</button>';
document.getElementById("tabs").innerHTML=tabsH;
// question pages
let idc=0, pagesH="";
CFG.questions.forEach(q=>{
  let h=`<div class="page" id="${q.id}"><div class="card"><div class="qtag">${q.name}</div></div>`;
  q.parts.forEach(p=>{const b=band(p.fac);const id="a"+(idc++);
    h+=`<div class="card"><div class="qhead"><div><span class="qtag">${p.t}</span> <span class="marks">[${p.m}]</span></div><span class="badge ${b.cls}">${b.lab}</span></div>
      <button class="reveal" onclick="tog('${id}',this,0)">Reveal model answer</button>
      <div class="answer" id="${id}"><h4>Model answer</h4><div>${p.ans}</div>${p.err?`<div class="err"><b>Common slip:</b> ${p.err}</div>`:``}</div>`;
    if(p.ex&&p.ex.length){h+=`<button class="reveal ex-btn" onclick="tog('${id}x',this,1)">🔍 Class examples (${p.ex.length})</button>
      <div class="examples" id="${id}x" data-n="${p.ex.length}">`+p.ex.map(e=>`<div class="exrow">${e.s?`<div class="exlab">Script ${e.s}</div>`:``}
        <div class="strip w">✍️ <b>Wrote:</b> ${e.w}</div><div class="strip y">❌ <b>Why it’s wrong:</b> ${e.y}</div><div class="strip c">✅ <b>Model answer:</b> ${e.c}</div></div>`).join("")+`</div>`;}
    h+=`</div>`;});
  h+=`</div>`; pagesH+=h;
});
document.getElementById("qpages").innerHTML=pagesH;
// embedded tools (isolated iframes)
(CFG.embeds||[]).forEach(e=>{
  const pg=document.createElement("div");pg.className="page";pg.id=e.id;
  const cap=document.createElement("div");cap.className="card";cap.innerHTML=`<div class="qtag">${e.tab}</div><p class="note">${e.caption||"Interactive worksheet — opens embedded below. Students can type into it here."}</p>`;pg.appendChild(cap);
  const fr=document.createElement("iframe");fr.title=e.tab;fr.setAttribute("sandbox","allow-scripts allow-same-origin allow-popups allow-forms");
  fr.style.cssText="width:100%;height:82vh;border:0;border-radius:16px;background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.08)";fr.srcdoc=e.html;
  pg.appendChild(fr);document.getElementById("qpages").appendChild(pg);
});
function tog(id,btn,isEx){const a=document.getElementById(id);const s=a.classList.toggle("show");
  if(isEx)btn.textContent=s?"Hide class examples":("🔍 Class examples ("+a.dataset.n+")");else btn.textContent=s?"Hide model answer":"Reveal model answer";}
// overview
(function(){const all=[];CFG.questions.forEach(q=>q.parts.forEach(p=>{if(p.fac!==null&&p.fac!==undefined)all.push({t:p.t,f:p.fac,err:p.err});}));
  const good=all.filter(x=>x.f>=GOOD).sort((a,b)=>b.f-a.f),bad=all.filter(x=>x.f<MIXED).sort((a,b)=>a.f-b.f),mix=all.filter(x=>x.f>=MIXED&&x.f<GOOD).sort((a,b)=>a.f-b.f);
  let h=`<div class="card"><div class="qtag">📊 How the class did</div><p class="note">${CFG.avg?("Average <b>"+CFG.avg+"</b>. "):""}Green = strong, red = needs re-teaching.</p>
    <div class="board"><div class="col g"><h3>✅ Done well</h3><ul>${good.map(x=>`<li>${x.t} <span class="chip">${x.f}%</span></li>`).join("")}</ul></div>
    <div class="col b"><h3>⚠️ Struggled — re-teach</h3><ul>${bad.map(x=>`<li>${x.t} <span class="chip">${x.f}%</span><br><span class="note">${x.err||""}</span></li>`).join("")}</ul></div></div></div>`;
  h+=`<div class="card"><div class="qtag">Facility by part <span class="note">(% of marks earned)</span></div><div>`;
  all.forEach(x=>{h+=`<div class="row"><div class="lab">${x.t.split(" ")[0]}</div><div class="track"><div class="fill" style="width:${Math.max(x.f,8)}%;background:${fc(x.f)}">${x.f}%</div></div></div>`;});
  h+=`</div><div class="legend">🟢 ≥${GOOD}% did well&nbsp;&nbsp;🟡 ${MIXED}–${GOOD-1}% mixed&nbsp;&nbsp;🔴 &lt;${MIXED}% struggled</div></div>`;
  if(mix.length)h+=`<div class="card"><div class="qtag">🟡 In between</div><ul>${mix.map(x=>`<li>${x.t} <span class="chip">${x.f}%</span></li>`).join("")}</ul></div>`;
  document.getElementById("ov").innerHTML=h;})();
// tab switching + reveal all
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));t.classList.add("active");document.getElementById(t.dataset.p).classList.add("active");window.scrollTo({top:0,behavior:"smooth"});}));
let allShown=false;document.getElementById("toggleAll").addEventListener("click",function(){allShown=!allShown;document.querySelectorAll(".answer").forEach(a=>a.classList.toggle("show",allShown));document.querySelectorAll(".reveal:not(.ex-btn)").forEach(b=>b.textContent=allShown?"Hide model answer":"Reveal model answer");this.textContent=allShown?"Hide all answers":"Reveal all answers";});
</script></body></html>
