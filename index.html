   <span class=\\\"badge badge-green\\\">\ud83c\udf89 All Steps Complete!</span>\\n    <h2 style=\\\"font-family:'Nunito',sans-serif;font-size:1.1rem;margin-bottom:12px;color:var(--md-dark);\\\">Summary of Your Answers</h2>\\n    <table class=\\\"summary-tbl\\\">\\n      <thead>\\n        <tr>\\n          <th>Part</th>\\n          <th>What You Calculated</th>\\n          <th>Your Answer</th>\\n          <th>Unit</th>\\n        </tr>\\n      </thead>\\n      <tbody>\\n        <tr>\\n          <td><strong>a(ii)</strong></td>\\n          <td>Average volume of P (NaOH)</td>\\n          <td id=\\\"sum-aii\\\">\u2014</td>\\n          <td>cm\u00b3</td>\\n        </tr>\\n        <tr>\\n          <td><strong>b(i)</strong></td>\\n          <td>Moles of NaOH used</td>\\n          <td id=\\\"sum-bi\\\">\u2014</td>\\n          <td>mol</td>\\n        </tr>\\n        <tr>\\n          <td><strong>b(i) cont.</strong></td>\\n          <td>Moles of sulfamic acid (HA) in 25.0 cm\u00b3 of Q</td>\\n          <td id=\\\"sum-bi2\\\">\u2014</td>\\n          <td>mol</td>\\n        </tr>\\n        <tr>\\n          <td><strong>b(ii)</strong></td>\\n          <td>Concentration of HA in cleaning product</td>\\n          <td id=\\\"sum-bii\\\">\u2014</td>\\n          <td>mol/dm\u00b3</td>\\n        </tr>\\n      </tbody>\\n    </table>\\n    <div class=\\\"conclusion-box\\\" id=\\\"conclusion-box\\\"></div>\\n    <button class=\\\"btn btn-reset\\\" onclick=\\\"resetAll()\\\">\ud83d\udd04 Reset All Answers</button>\\n  </div>\\n\\n  <!-- \u2500\u2500 TEACHER REPORT \u2500\u2500 -->\\n  <div id=\\\"teacher-btn-wrap\\\">\\n    <button id=\\\"teacher-btn\\\" onclick=\\\"toggleTeacherReport()\\\">\ud83d\udd10 Teacher Report</button>\\n  </div>\\n  <div id=\\\"teacher-report\\\">\\n    <h2>\ud83d\udd10 Teacher Feedback Report</h2>\\n    <div id=\\\"report-content\\\"></div>\\n    <h3>Teacher Notes</h3>\\n    <textarea class=\\\"teacher-notes\\\" id=\\\"teacher-notes\\\" placeholder=\\\"Add your observations here\u2026\\\"></textarea>\\n    <div class=\\\"report-btns\\\">\\n      <button class=\\\"btn-report\\\" onclick=\\\"renderReport()\\\">\ud83d\udd04 Refresh Report</button>\\n      <button class=\\\"btn-report\\\" onclick=\\\"copyReport()\\\">\ud83d\udccb Copy as Text</button>\\n      <button class=\\\"btn-report\\\" onclick=\\\"saveReportImage()\\\">\ud83d\udcf8 Save as Image</button>\\n      <button class=\\\"btn-report\\\" onclick=\\\"window.print()\\\">\ud83d\udda8\ufe0f Print Report</button>\\n    </div>\\n  </div>\\n\\n</div><!-- /container -->\\n\\n<script>\\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\\n// STATE\\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\\nconst state = {\\n  startTime: Date.now(),\\n  correctSteps: { aii: false, bi: false, bi2: false, bii: false, checklist: false },\\n  answers: { aii: null, bi: null, bi2: null, bii: null },\\n  attempts: { aii: 0, bi: 0, bi2: 0, bii: 0 },\\n  hintsUsed: { aii: false, bi: false, bi2: false, bii: false },\\n  hintOpen: { aii: false, bi: false, bi2: false, bii: false },\\n  log: []\\n};\\nconst TOTAL_STEPS = 5; // aii, bi, bi2, bii, checklist\\n\\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\\n// LOGGING\\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\\nfunction pushLog(type, msg) {\\n  if (type === 'info') return;\\n  state.log.push({ type, msg, time: new Date().toLocaleTimeString() });\\n}\\n\\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\\n// INIT\\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\\nwindow.onload = function() {\\n  const d = new Date();\\n  document.getElementById('stu-date').value = d.toLocaleDateString('en-GB', {day:'2-digit',month:'short',year:'numeric'});\\n\\n  // Burette blur handlers\\n  for (let i = 1; i <= 5; i++) {\\n    ['f','i'].forEach(prefix => {\\n      const el = document.getElementById(prefix + i);\\n      el.addEventListener('blur', () => handleBuretteBlur(prefix + i));\\n      el.addEventListener('input', () => calcTitre(i));\\n    });\\n  }\\n  updateProgress();\\n};\\n\\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\\n// BURETTE PRECISION\\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\\nfunction isPrecisionOk(val) {\\n  const r = Math.round(val * 100) % 5;\\n  return r === 0;\\n}\\n\\nfunction handleBuretteBlur(id) {\\n  const el = document.getElementById(id);\\n  const warnEl = document.getElementById('pw-' + id);\\n  if (el.value === '' || el.value === null) return;\\n  const v = parseFloat(el.value);\\n  if (isNaN(v)) return;\\n  el.value = v.toFixed(2);\\n  if (!isPrecisionOk(v)) {\\n    el.classList.add('precision-err');\\n    warnEl.style.display = 'block';\\n    pushLog('err', `Precision error: ${id} = ${el.value} (not a multiple of 0.05)`);\\n  } else {\\n    el.classList.remove('precision-err');\\n    warnEl.style.display = 'none';\\n  }\\n  const idx = parseInt(id.slice(1));\\n  calcTitre(idx);\\n}\\n\\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\\n// TITRE CALCULATION\\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\\nfunction calcTitre(idx) {\\n  const fEl = document.getElementById('f' + idx);\\n  const iEl = document.getElementById('i' + idx);\\n  const tEl = document.getElementById('t' + idx);\\n  const fv = parseFloat(fEl.value);\\n  const iv = parseFloat(iEl.value);\\n  if (!isNaN(fv) && !isNaN(iv) && fv > iv) {\\n    const titre = (fv - iv).toFixed(2);\\n    tEl.textContent = titre;\\n  } else {\\n    tEl.textContent = '\u2014';\\n  }\\n  updateConcordance();\\n}\\n\\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\\n// CONCORDANCE & AVERAGE\\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\\nfunction getSelectedTitres() {\\n  const vals = [];\\n  for (let i = 1; i <= 5; i++) {\\n    const cb = document.getElementById('c' + i);\\n    if (cb.checked) {\\n      const tEl = document.getElementById('t' + i);\\n      const v = parseFloat(tEl.textContent);\\n      if (!isNaN(v)) vals.push({ idx: i, val: v });\\n    }\\n  }\\n  return vals;\\n}\\n\\nfunction updateConcordance() {\\n  const sel = getSelectedTitres();\\n  const ci = document.getElementById('concordance-info');\\n  const avgBox = document.getElementById('avg-box');\\n\\n  if (sel.length < 2) {\\n    ci.style.display = 'none';\\n    avgBox.style.display = 'none';\\n    return;\\n  }\\n\\n  const vals = sel.map(s => s.val);\\n  const range = (Math.max(...vals) - Math.min(...vals)).toFixed(2);\\n  const concordant = parseFloat(range) <= 0.20;\\n  const avg = (vals.reduce((a,b)=>a+b,0) / vals.length).toFixed(2);\\n\\n  // Coloured dots\\n  for (let i = 1; i <= 5; i++) {\\n    const tEl = document.getElementById('t' + i);\\n    const existingDot = tEl.querySelector('.dot');\\n    if (existingDot) existingDot.remove();\\n  }\\n  sel.forEach(s => {\\n    const tEl = document.getElementById('t' + s.idx);\\n    const dot = document.createElement('span');\\n    dot.className = 'dot ' + (concordant ? 'dot-green' : 'dot-red');\\n    tEl.appendChild(dot);\\n  });\\n\\n  ci.style.display = 'block';\\n  if (concordant) {\\n    ci.className = 'ok';\\n    ci.textContent = `\u2705 Range = ${range} cm\u00b3 \u2014 within \u00b10.20 cm\u00b3. Results are concordant.`;\\n  } else {\\n    ci.className = 'warn';\\n    ci.textContent = `\u26a0 Range = ${range} cm\u00b3 \u2014 exceeds \u00b10.20 cm\u00b3. Results are NOT concordant. Review your selections.`;\\n  }\\n\\n  avgBox.style.display = 'block';\\n  avgBox.innerHTML = `\ud83d\udcd0 <strong>Average volume of P</strong> from selected titrations = <strong>${avg} cm\u00b3</strong>`;\\n}\\n\\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\\n// CHECKLIST\\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\\nfunction updateChecklist() {\\n  const all = ['chk1','chk2','chk3'].every(id => document.getElementById(id).checked);\\n  const count = ['chk1','chk2','chk3'].filter(id => document.getElementById(id).checked).length;\\n  document.getElementById('checklist-score').textContent = `Checklist: ${count} / 3 ticked`;\\n\\n  if (all && !state.correctSteps.checklist) {\\n    state.correctSteps.checklist = true;\\n    pushLog('ok', 'Self-check checklist completed (3/3)');\\n    updateProgress();\\n  } else if (!all) {\\n    state.correctSteps.checklist = false;\\n    updateProgress();\\n  }\\n}\\n\\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\\n// HINT TOGGLE\\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\\nfunction toggleHint(id) {\\n  const el = document.getElementById(id);\\n  const key = id.replace('hint-','');\\n  const isOpen = el.style.display === 'block';\\n  el.style.display = isOpen ? 'none' : 'block';\\n  if (!isOpen && !state.hintsUsed[key]) {\\n    state.hintsUsed[key] = true;\\n    pushLog('hint', `Hint revealed for Step ${key}`);\\n  }\\n}\\n\\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\\n// TOLERANCE CHECKER\\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\\nfunction withinTolerance(student, expected, tol) {\\n  return Math.abs(parseFloat(student) - parseFloat(expected)) <= tol;\\n}\\n\\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\\n// STEP a(ii) \u2014 AVERAGE VOLUME\\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\\nfunction checkAii() {\\n  const sel = getSelectedTitres();\\n  if (sel.length < 2) {\\n    showFeedback('fb-aii', 'err', 'Please tick at least 2 concordant titration results in the table first.');\\n    return;\\n  }\\n\\n  const vals = sel.map(s => s.val);\\n  const range = Math.max(...vals) - Math.min(...vals);\\n  if (range > 0.20) {\\n    showFeedback('fb-aii', 'err', 'Your selected titrations are not concordant (range > 0.20 cm\u00b3). Go back and review your \\\"Best titration results\\\" selection.');\\n    return;\\n  }\\n\\n  const expected = vals.reduce((a,b)=>a+b,0) / vals.length;\\n  const studentAns = parseFloat(document.getElementById('ans-aii').value);\\n  state.attempts.aii++;\\n  document.getElementById('att-aii').textContent = `Attempts: ${state.attempts.aii}`;\\n\\n  if (isNaN(studentAns)) {\\n    showFeedback('fb-aii', 'err', 'Please enter a numerical value.');\\n    return;\\n  }\\n\\n  if (withinTolerance(studentAns, expected, 0.01)) {\\n    state.answers.aii = studentAns;\\n    state.correctSteps.aii = true;\\n    document.getElementById('ans-aii').classList.add('correct');\\n    document.getElementById('card-aii').classList.add('correct');\\n    showFeedback('fb-aii', 'ok', `\u2714 Correct! Average volume of P = ${expected.toFixed(2)} cm\u00b3`);\\n    pushLog('ok', `a(ii) correct: ${studentAns} cm\u00b3 (attempt ${state.attempts.aii})`);\\n    unlockStep('bi');\\n    updateProgress();\\n  } else {\\n    document.getElementById('ans-aii').classList.add('wrong');\\n    showFeedback('fb-aii', 'err', `\u2718 Not quite. Check: sum \u00f7 number of selected titres. Do not round intermediate values.`);\\n    pushLog('err', `a(ii) wrong: entered ${studentAns}, expected \u2248${expected.toFixed(2)} (attempt ${state.attempts.aii})`);\\n    setTimeout(()=>document.getElementById('ans-aii').classList.remove('wrong'), 1500);\\n  }\\n}\\n\\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\\n// STEP b(i) \u2014 MOLES OF NaOH\\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\\nfunction checkBi() {\\n  if (!state.correctSteps.aii) return;\\n  const avgVol = state.answers.aii;\\n  const expected = 0.200 * avgVol / 1000;\\n  const studentAns = parseFloat(document.getElementById('ans-bi').value);\\n  state.attempts.bi++;\\n  document.getElementById('att-bi').textContent = `Attempts: ${state.attempts.bi}`;\\n\\n  if (isNaN(studentAns)) { showFeedback('fb-bi','err','Please enter a numerical value.'); return; }\\n\\n  if (withinTolerance(studentAns, expected, expected * 0.005 + 0.00005)) {\\n    state.answers.bi = studentAns;\\n    state.correctSteps.bi = true;\\n    document.getElementById('ans-bi').classList.add('correct');\\n    document.getElementById('card-bi').classList.add('correct');\\n    showFeedback('fb-bi', 'ok', `\u2714 Correct! Moles of NaOH = concentration \u00d7 volume \u00f7 1000 = 0.200 \u00d7 ${avgVol.toFixed(2)} \u00f7 1000 = ${expected.toFixed(5)} mol`);\\n    pushLog('ok', `b(i) correct: ${studentAns} mol (attempt ${state.attempts.bi})`);\\n    unlockStep('bi2');\\n    updateProgress();\\n  } else {\\n    document.getElementById('ans-bi').classList.add('wrong');\\n    showFeedback('fb-bi', 'err', `\u2718 Not quite. Recall: moles = concentration \u00d7 volume (cm\u00b3) \u00f7 1000. Use your average volume from Step a(ii).`);\\n    pushLog('err', `b(i) wrong: entered ${studentAns}, expected \u2248${expected.toFixed(5)} (attempt ${state.attempts.bi})`);\\n    setTimeout(()=>document.getElementById('ans-bi').classList.remove('wrong'), 1500);\\n  }\\n}\\n\\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\\n// STEP b(i) cont. \u2014 MOLES OF HA\\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\\nfunction checkBi2() {\\n  if (!state.correctSteps.bi) return;\\n  const expected = state.answers.bi; // 1:1 ratio\\n  const studentAns = parseFloat(document.getElementById('ans-bi2').value);\\n  state.attempts.bi2++;\\n  document.getElementById('att-bi2').textContent = `Attempts: ${state.attempts.bi2}`;\\n\\n  if (isNaN(studentAns)) { showFeedback('fb-bi2','err','Please enter a numerical value.'); return; }\\n\\n  if (withinTolerance(studentAns, expected, expected * 0.005 + 0.00005)) {\\n    state.answers.bi2 = studentAns;\\n    state.correctSteps.bi2 = true;\\n    document.getElementById('ans-bi2').classList.add('correct');\\n    document.getElementById('card-bi2').classList.add('correct');\\n    showFeedback('fb-bi2', 'ok', `\u2714 Correct! Since HA : NaOH = 1 : 1, moles of HA = ${expected.toFixed(5)} mol`);\\n    pushLog('ok', `b(i)-HA correct: ${studentAns} mol (attempt ${state.attempts.bi2})`);\\n    unlockStep('bii');\\n    updateProgress();\\n  } else {\\n    document.getElementById('ans-bi2').classList.add('wrong');\\n    showFeedback('fb-bi2', 'err', `\u2718 Not quite. Check the mole ratio: HA : NaOH = 1 : 1. Your answer for moles of HA should equal moles of NaOH.`);\\n    pushLog('err', `b(i)-HA wrong: entered ${studentAns}, expected \u2248${expected.toFixed(5)} (attempt ${state.attempts.bi2})`);\\n    setTimeout(()=>document.getElementById('ans-bi2').classList.remove('wrong'), 1500);\\n  }\\n}\\n\\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\\n// STEP b(ii) \u2014 CONCENTRATION IN CLEANING PRODUCT\\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\\nfunction checkBii() {\\n  if (!state.correctSteps.bi2) return;\\n  const molesHA = state.answers.bi2;\\n  // Concentration in Q = moles / 0.025 dm\u00b3; then \u00d7 10 for dilution factor\\n  const concInQ = molesHA / 0.025;\\n  const expected = concInQ * 10;\\n  const studentAns = parseFloat(document.getElementById('ans-bii').value);\\n  state.attempts.bii++;\\n  document.getElementById('att-bii').textContent = `Attempts: ${state.attempts.bii}`;\\n\\n  if (isNaN(studentAns)) { showFeedback('fb-bii','err','Please enter a numerical value.'); return; }\\n\\n  if (withinTolerance(studentAns, expected, expected * 0.005 + 0.0005)) {\\n    state.answers.bii = studentAns;\\n    state.correctSteps.bii = true;\\n    document.getElementById('ans-bii').classList.add('correct');\\n    document.getElementById('card-bii').classList.add('correct');\\n    showFeedback('fb-bii', 'ok',\\n      `\u2714 Correct! Concentration in Q = ${molesHA.toFixed(5)} \u00f7 0.025 = ${concInQ.toFixed(4)} mol/dm\u00b3. ` +\\n      `Concentration in cleaning product = ${concInQ.toFixed(4)} \u00d7 10 = ${expected.toFixed(3)} mol/dm\u00b3`);\\n    pushLog('ok', `b(ii) correct: ${studentAns} mol/dm\u00b3 (attempt ${state.attempts.bii})`);\\n    updateProgress();\\n    checkCompletion();\\n  } else {\\n    document.getElementById('ans-bii').classList.add('wrong');\\n    showFeedback('fb-bii', 'err',\\n      `\u2718 Not quite. Remember two things: (1) convert 25.0 cm\u00b3 to dm\u00b3 (\u00f7 1000), and (2) apply the dilution factor \u2014 Q was made by diluting 100 cm\u00b3 to 1000 cm\u00b3, so multiply by 10.`);\\n    pushLog('err', `b(ii) wrong: entered ${studentAns}, expected \u2248${expected.toFixed(4)} (attempt ${state.attempts.bii})`);\\n    setTimeout(()=>document.getElementById('ans-bii').classList.remove('wrong'), 1500);\\n  }\\n}\\n\\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\\n// HELPERS\\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\\nfunction showFeedback(id, type, msg) {\\n  const el = document.getElementById(id);\\n  el.className = 'feedback ' + type;\\n  el.textContent = msg;\\n  el.style.display = 'block';\\n}\\n\\nfunction unlockStep(key) {\\n  const card = document.getElementById('card-' + key);\\n  const lock = document.getElementById('lock-' + key);\\n  card.classList.remove('locked');\\n  lock.style.display = 'none';\\n}\\n\\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\\n// PROGRESS BAR\\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\\nfunction updateProgress() {\\n  const done = Object.values(state.correctSteps).filter(Boolean).length;\\n  const pct = Math.round((done / TOTAL_STEPS) * 100);\\n  document.getElementById('prog-fill').style.width = pct + '%';\\n  document.getElementById('prog-text').textContent = `${done} / ${TOTAL_STEPS} \u00b7 ${pct}%`;\\n}\\n\\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\\n// COMPLETION\\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\\nfunction checkCompletion() {\\n  const allCalcDone = state.correctSteps.aii && state.correctSteps.bi && state.correctSteps.bi2 && state.correctSteps.bii;\\n  if (!allCalcDone) return;\\n  const card = document.getElementById('completion-card');\\n  card.style.display = 'block';\\n\\n  document.getElementById('sum-aii').textContent = state.answers.aii.toFixed(2);\\n  document.getElementById('sum-bi').textContent = state.answers.bi.toFixed(5);\\n  document.getElementById('sum-bi2').textContent = state.answers.bi2.toFixed(5);\\n  document.getElementById('sum-bii').textContent = state.answers.bii.toFixed(3);\\n  document.getElementById('conclusion-box').innerHTML =\\n    `\ud83d\udccc The concentration of sulfamic acid (HA) in the cleaning product is <strong>${state.answers.bii.toFixed(3)} mol/dm\u00b3</strong>.`;\\n  card.scrollIntoView({ behavior: 'smooth', block: 'start' });\\n}\\n\\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\\n// RESET\\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\\nfunction resetAll() {\\n  if (!confirm('Reset all answers? This cannot be undone.')) return;\\n  location.reload();\\n}\\n\\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\\n// TEACHER REPORT\\n// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\\nfunction toggleTeacherReport() {\\n  const rpt = document.getElementById('teacher-report');\\n  if (rpt.style.display === 'none' || rpt.style.display === '') {\\n    rpt.style.display = 'block';\\n    renderReport();\\n  } else {\\n    rpt.style.display = 'none';\\n  }\\n}\\n\\nfunction renderReport() {\\n  const name = document.getElementById('stu-name').value || '(not entered)';\\n  const cls = document.getElementById('stu-class').value || '(not entered)';\\n  const date = document.getElementById('stu-date').value;\\n  const elapsed = Math.round((Date.now() - state.startTime) / 60000);\\n  const now = new Date().toLocaleString('en-GB');\\n\\n  const scoreMap = { aii: 'a(ii)', bi: 'b(i) NaOH', bi2: 'b(i) HA', bii: 'b(ii) Conc.' };\\n  let scoreBadges = '';\\n  Object.entries(state.correctSteps).forEach(([k,v]) => {\\n    const label = scoreMap[k] || 'Checklist';\\n    scoreBadges += `<span class=\\\"${v?'badge-ok':'badge-pend'}\\\" style=\\\"margin-right:6px\\\">${v?'\u2705':'\u23f3'} ${label}</span>`;\\n  });\\n  const totalScore = Object.values(state.correctSteps).filter(Boolean).length;\\n\\n  // Concerns\\n  let concerns = '';\\n  ['aii','bi','bi2','bii'].forEach(k => {\\n    if (state.attempts[k] >= 3 || (state.hintsUsed[k] && !state.correctSteps[k])) {\\n      concerns += `<div class=\\\"concern-box\\\">\u26a0 Step ${scoreMap[k]}: ${state.attempts[k]} attempt(s), hint used: ${state.hintsUsed[k]?'Yes':'No'}, completed: ${state.correctSteps[k]?'Yes':'No'}</div>`;\\n    }\\n  });\\n  if (!concerns) concerns = '<p style=\\\"color:var(--md-dark);font-size:0.82rem\\\">No concerns flagged \u2705</p>';\\n\\n  // Titration table\\n  let titRows = '';\\n  for (let i = 1; i <= 5; i++) {\\n    const fv = document.getElementById('f'+i).value || '\u2014';\\n    const iv = document.getElementById('i'+i).value || '\u2014';\\n    const tv = document.getElementById('t'+i).textContent || '\u2014';\\n    const cb = document.getElementById('c'+i).checked ? '\u2713' : '';\\n    const hasErr = document.getElementById('f'+i).classList.contains('precision-err') || document.getElementById('i'+i).classList.contains('precision-err');\\n    titRows += `<tr><td>${i}</td><td>${fv}</td><td>${iv}</td><td>${tv}</td><td>${cb}</td><td>${hasErr?'<span class=\\\"badge-err\\\">Error</span>':'<span class=\\\"badge-ok\\\">OK</span>'}</td></tr>`;\\n  }\\n\\n  // Calculation table\\n  const calcRows = [\\n    { part: 'a(ii)', ans: state.answers.aii, unit: 'cm\u00b3', key: 'aii' },\\n    { part: 'b(i) NaOH', ans: state.answers.bi, unit: 'mol', key: 'bi' },\\n    { part: 'b(i) HA', ans: state.answers.bi2, unit: 'mol', key: 'bi2' },\\n    { part: 'b(ii) Conc.', ans: state.answers.bii, unit: 'mol/dm\u00b3', key: 'bii' },\\n  ].map(r => {\\n    const done = state.correctSteps[r.key];\\n    const expVal = done ? (r.ans !== null ? Number(r.ans).toFixed(5) : '\u2014') : '\u2014';\\n    return `<tr>\\n      <td>${r.part}</td>\\n      <td>${r.ans !== null ? Number(r.ans) : '\u2014'}</td>\\n      <td>${expVal}</td>\\n      <td>${r.unit}</td>\\n      <td>${done ? '<span class=\\\"badge-ok\\\">\u2705 Correct</span>' : '<span class=\\\"badge-pend\\\">\u23f3 Pending</span>'}</td>\\n      <td>${state.attempts[r.key]}</td>\\n      <td>${state.hintsUsed[r.key] ? 'Yes' : 'No'}</td>\\n    </tr>`;\\n  }).join('');\\n\\n  // Checklist\\n  const chkStatus = ['chk1','chk2','chk3'].map((id,i) =>\\n    `<div style=\\\"margin:2px 0\\\">${document.getElementById(id).checked?'\u2611':'\u2610'} Item ${i+1}</div>`\\n  ).join('');\\n\\n  // Log\\n  const logHtml = state.log.length ? state.log.map(l =>\\n    `<div class=\\\"log-entry ${l.type}\\\">[${l.time}] ${l.msg}</div>`\\n  ).join('') : '<div class=\\\"log-entry\\\" style=\\\"color:var(--tm)\\\">No events logged yet.</div>';\\n\\n  document.getElementById('report-content').innerHTML = `\\n    <h3>Student Info</h3>\\n    <table class=\\\"report-tbl\\\">\\n      <tr><th>Name</th><td>${name}</td><th>Class</th><td>${cls}</td></tr>\\n      <tr><th>Date</th><td>${date}</td><th>Time Elapsed</th><td>${elapsed} min</td></tr>\\n      <tr><th>Generated</th><td colspan=\\\"3\\\">${now}</td></tr>\\n    </table>\\n\\n    <h3>Score Overview</h3>\\n    <div style=\\\"margin-bottom:8px\\\">${scoreBadges}</div>\\n    <p style=\\\"font-weight:700;font-size:0.85rem\\\">Total: ${totalScore} / ${TOTAL_STEPS}</p>\\n\\n    <h3>Concern Flags</h3>\\n    ${concerns}\\n\\n    <h3>Titration Data</h3>\\n    <table class=\\\"report-tbl\\\">\\n      <thead><tr><th>#</th><th>Final (cm\u00b3)</th><th>Initial (cm\u00b3)</th><th>Volume (cm\u00b3)</th><th>Included</th><th>Precision</th></tr></thead>\\n      <tbody>${titRows}</tbody>\\n    </table>\\n\\n    <h3>Calculation Attempts</h3>\\n    <table class=\\\"report-tbl\\\">\\n      <thead><tr><th>Part</th><th>Student Answer</th><th>Expected</th><th>Unit</th><th>Result</th><th>Attempts</th><th>Hint Used?</th></tr></thead>\\n      <tbody>${calcRows}</tbody>\\n    </table>\\n\\n    <h3>Self-Check Checklist</h3>\\n    ${chkStatus}\\n\\n    <h3>Key Events Log</h3>\\n    <div style=\\\"max-height:200px;overflow-y:auto;padding:6px;border:1px solid var(--border);border-radius:8px\\\">${logHtml}</div>\\n  `;\\n}\\n\\nfunction copyReport() {\\n  const name = document.getElementById('stu-name').value || 'Student';\\n  const cls = document.getElementById('stu-class').value || '';\\n  const date = document.getElementById('stu-date').value;\\n  const elapsed = Math.round((Date.now() - state.startTime) / 60000);\\n  let txt = `TEACHER REPORT \u2014 2020 O-Level Practical Q1 Titration\\\\n`;\\n  txt += `Student: ${name} | Class: ${cls} | Date: ${date} | Time: ${elapsed} min\\\\n\\\\n`;\\n  txt += `SCORES:\\\\n`;\\n  ['aii','bi','bi2','bii','checklist'].forEach(k => {\\n    txt += `  ${k}: ${state.correctSteps[k] ? 'Correct' : 'Pending'}\\\\n`;\\n  });\\n  txt += `\\\\nATTEMPTS:\\\\n`;\\n  ['aii','bi','bi2','bii'].forEach(k => {\\n    txt += `  ${k}: ${state.attempts[k]} attempt(s), hint: ${state.hintsUsed[k]?'Yes':'No'}\\\\n`;\\n  });\\n  txt += `\\\\nKEY EVENTS:\\\\n`;\\n  state.log.forEach(l => { txt += `  [${l.time}] ${l.msg}\\\\n`; });\\n  const notes = document.getElementById('teacher-notes').value;\\n  if (notes) txt += `\\\\nTEACHER NOTES:\\\\n${notes}\\\\n`;\\n  navigator.clipboard.writeText(txt).then(()=>alert('Report copied to clipboard!')).catch(()=>alert('Copy failed \u2014 please copy manually.'));\\n}\\n\\nfunction saveReportImage() {\\n  const name = document.getElementById('stu-name').value || 'Student';\\n  const date = document.getElementById('stu-date').value.replace(/\\\\s/g,'_');\\n  const filename = `report_${name}_${date}.png`;\\n\\n  if (typeof html2canvas === 'undefined') {\\n    const script = document.createElement('script');\\n    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';\\n    script.onload = () => captureImage(filename);\\n    document.head.appendChild(script);\\n  } else {\\n    captureImage(filename);\\n  }\\n}\\n\\nfunction captureImage(filename) {\\n  const el = document.getElementById('teacher-report');\\n  html2canvas(el, { backgroundColor: '#ffffff', scale: 2 }).then(canvas => {\\n    const link = document.createElement('a');\\n    link.download = filename;\\n    link.href = canvas.toDataURL('image/png');\\n    link.click();\\n  });\\n}\\n<\\/script>\\n</body>\\n</html>\\n\"}]}; const GOOD=CFG.good, MIXED=CFG.mixed;\nfunction band(f){if(f===null||f===undefined)return{cls:\"b-na\",lab:\"Not assessed\"};if(f>=GOOD)return{cls:\"b-good\",lab:\"Did well \"+f+\"%\"};if(f>=MIXED)return{cls:\"b-mix\",lab:\"Mixed \"+f+\"%\"};return{cls:\"b-bad\",lab:\"Struggled \"+f+\"%\"};}\nfunction fc(f){return f>=GOOD?\"var(--good)\":f>=MIXED?\"var(--mix)\":\"var(--bad)\";}\n// tabs\nlet tabsH='<button class=\"tab active\" data-p=\"ov\">\ud83d\udcca Overview</button>';\nCFG.questions.forEach((q,i)=>{tabsH+=`<button class=\"tab\" data-p=\"${q.id}\">${q.tab||q.id}</button>`;});\n(CFG.embeds||[]).forEach(e=>{tabsH+=`<button class=\"tab\" data-p=\"${e.id}\">${e.tab}</button>`;});\ntabsH+='<button class=\"btn\" id=\"toggleAll\">Reveal all answers</button>';\ndocument.getElementById(\"tabs\").innerHTML=tabsH;\n// question pages\nlet idc=0, pagesH=\"\";\nCFG.questions.forEach(q=>{\n  let h=`<div class=\"page\" id=\"${q.id}\"><div class=\"card\"><div class=\"qtag\">${q.name}</div></div>`;\n  q.parts.forEach(p=>{const b=band(p.fac);const id=\"a\"+(idc++);\n    h+=`<div class=\"card\"><div class=\"qhead\"><div><span class=\"qtag\">${p.t}</span> <span class=\"marks\">[${p.m}]</span></div><span class=\"badge ${b.cls}\">${b.lab}</span></div>\n      <button class=\"reveal\" onclick=\"tog('${id}',this,0)\">Reveal model answer</button>\n      <div class=\"answer\" id=\"${id}\"><h4>Model answer</h4><div>${p.ans}</div>${p.err?`<div class=\"err\"><b>Common slip:</b> ${p.err}</div>`:``}</div>`;\n    if(p.ex&&p.ex.length){h+=`<button class=\"reveal ex-btn\" onclick=\"tog('${id}x',this,1)\">\ud83d\udd0d Class examples (${p.ex.length})</button>\n      <div class=\"examples\" id=\"${id}x\" data-n=\"${p.ex.length}\">`+p.ex.map(e=>`<div class=\"exrow\">${e.s?`<div class=\"exlab\">Script ${e.s}</div>`:``}\n        <div class=\"strip w\">\u270d\ufe0f <b>Wrote:</b> ${e.w}</div><div class=\"strip y\">\u274c <b>Why it\u2019s wrong:</b> ${e.y}</div><div class=\"strip c\">\u2705 <b>Model answer:</b> ${e.c}</div></div>`).join(\"\")+`</div>`;}\n    h+=`</div>`;});\n  h+=`</div>`; pagesH+=h;\n});\ndocument.getElementById(\"qpages\").innerHTML=pagesH;\n// embedded tools (isolated iframes)\n(CFG.embeds||[]).forEach(e=>{\n  const pg=document.createElement(\"div\");pg.className=\"page\";pg.id=e.id;\n  const cap=document.createElement(\"div\");cap.className=\"card\";cap.innerHTML=`<div class=\"qtag\">${e.tab}</div><p class=\"note\">${e.caption||\"Interactive worksheet \u2014 opens embedded below. Students can type into it here.\"}</p>`;pg.appendChild(cap);\n  const fr=document.createElement(\"iframe\");fr.title=e.tab;fr.setAttribute(\"sandbox\",\"allow-scripts allow-same-origin allow-popups allow-forms\");\n  fr.style.cssText=\"width:100%;height:82vh;border:0;border-radius:16px;background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.08)\";fr.srcdoc=e.html;\n  pg.appendChild(fr);document.getElementById(\"qpages\").appendChild(pg);\n});\nfunction tog(id,btn,isEx){const a=document.getElementById(id);const s=a.classList.toggle(\"show\");\n  if(isEx)btn.textContent=s?\"Hide class examples\":(\"\ud83d\udd0d Class examples (\"+a.dataset.n+\")\");else btn.textContent=s?\"Hide model answer\":\"Reveal model answer\";}\n// overview\n(function(){const all=[];CFG.questions.forEach(q=>q.parts.forEach(p=>{if(p.fac!==null&&p.fac!==undefined)all.push({t:p.t,f:p.fac,err:p.err});}));\n  const good=all.filter(x=>x.f>=GOOD).sort((a,b)=>b.f-a.f),bad=all.filter(x=>x.f<MIXED).sort((a,b)=>a.f-b.f),mix=all.filter(x=>x.f>=MIXED&&x.f<GOOD).sort((a,b)=>a.f-b.f);\n  let h=`<div class=\"card\"><div class=\"qtag\">\ud83d\udcca How the class did</div><p class=\"note\">${CFG.avg?(\"Average <b>\"+CFG.avg+\"</b>. \"):\"\"}Green = strong, red = needs re-teaching.</p>\n    <div class=\"board\"><div class=\"col g\"><h3>\u2705 Done well</h3><ul>${good.map(x=>`<li>${x.t} <span class=\"chip\">${x.f}%</span></li>`).join(\"\")}</ul></div>\n    <div class=\"col b\"><h3>\u26a0\ufe0f Struggled \u2014 re-teach</h3><ul>${bad.map(x=>`<li>${x.t} <span class=\"chip\">${x.f}%</span><br><span class=\"note\">${x.err||\"\"}</span></li>`).join(\"\")}</ul></div></div></div>`;\n  h+=`<div class=\"card\"><div class=\"qtag\">Facility by part <span class=\"note\">(% of marks earned)</span></div><div>`;\n  all.forEach(x=>{h+=`<div class=\"row\"><div class=\"lab\">${x.t.split(\" \")[0]}</div><div class=\"track\"><div class=\"fill\" style=\"width:${Math.max(x.f,8)}%;background:${fc(x.f)}\">${x.f}%</div></div></div>`;});\n  h+=`</div><div class=\"legend\">\ud83d\udfe2 \u2265${GOOD}% did well&nbsp;&nbsp;\ud83d\udfe1 ${MIXED}\u2013${GOOD-1}% mixed&nbsp;&nbsp;\ud83d\udd34 &lt;${MIXED}% struggled</div></div>`;\n  if(mix.length)h+=`<div class=\"card\"><div class=\"qtag\">\ud83d\udfe1 In between</div><ul>${mix.map(x=>`<li>${x.t} <span class=\"chip\">${x.f}%</span></li>`).join(\"\")}</ul></div>`;\n  document.getElementById(\"ov\").innerHTML=h;})();\n// tab switching + reveal all\ndocument.querySelectorAll(\".tab\").forEach(t=>t.addEventListener(\"click\",()=>{document.querySelectorAll(\".tab\").forEach(x=>x.classList.remove(\"active\"));document.querySelectorAll(\".page\").forEach(x=>x.classList.remove(\"active\"));t.classList.add(\"active\");document.getElementById(t.dataset.p).classList.add(\"active\");window.scrollTo({top:0,behavior:\"smooth\"});}));\nlet allShown=false;document.getElementById(\"toggleAll\").addEventListener(\"click\",function(){allShown=!allShown;document.querySelectorAll(\".answer\").forEach(a=>a.classList.toggle(\"show\",allShown));document.querySelectorAll(\".reveal:not(.ex-btn)\").forEach(b=>b.textContent=allShown?\"Hide model answer\":\"Reveal model answer\");this.textContent=allShown?\"Hide all answers\":\"Reveal all answers\";});\n<\/script></body></html>";
document.getElementById("t2021").srcdoc = "<!DOCTYPE html><html lang=\"en\"><head><meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"><title>\u2697\ufe0f 2021 O-Level Chemistry Practical (Paper 3) \u2014 Review Walkthrough</title>\n<link href=\"https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap\" rel=\"stylesheet\">\n<style>\n:root{--bg:#f0f4ff;--card:#fff;--ink:#1a1a2e;--pink:#ffb3c6;--purple:#c9b8f0;--teal:#b2e8e0;--mint:#c3f0d4;--yellow:#fff1b0;\n--good:#3aa76d;--goodbg:#e5f6ec;--mix:#c9962b;--mixbg:#fff6df;--bad:#d9556b;--badbg:#fce8ec;--na:#9aa0b3;--nabg:#eef0f6;}\n*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito',sans-serif;line-height:1.55}\n.wrap{max-width:960px;margin:0 auto;padding:16px}header{text-align:center;padding:18px 12px 6px}\nh1{font-family:'Fredoka One',cursive;font-size:clamp(1.5rem,5vw,2.3rem);margin:0;color:#5b4b8a}\n.sub{font-weight:700;color:#6a6f85;margin-top:4px;font-size:.95rem}.credit{font-style:italic;color:#8b6fc7;font-size:.8rem;margin-top:6px}\n.bar-top{position:sticky;top:0;z-index:20;background:rgba(240,244,255,.92);backdrop-filter:blur(6px);display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:10px;margin:8px 0;border-radius:16px}\n.tab,.btn,.reveal{font-family:'Nunito';font-weight:800;color:var(--ink);cursor:pointer;min-height:44px;transition:transform .05s,box-shadow .05s}\n.tab{background:#fff;border:2px solid var(--purple);box-shadow:0 4px 0 var(--purple);border-radius:12px;padding:9px 16px;font-size:.95rem}\n.tab:active{transform:translateY(4px);box-shadow:0 0 0 var(--purple)}.tab.active{background:var(--purple)}\n.btn{background:#fff;border:2px solid var(--purple);box-shadow:0 4px 0 var(--purple);border-radius:12px;padding:9px 16px;font-weight:700}\n.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--purple)}\n.page{display:none}.page.active{display:block}\n.card{background:var(--card);border-radius:18px;box-shadow:0 4px 12px rgba(0,0,0,.08);padding:16px 18px;margin:14px 0}\n.qhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}\n.qtag{font-family:'Fredoka One';color:#5b4b8a;font-size:1.05rem}.marks{font-weight:800;color:#6a6f85;font-size:.85rem}\n.badge{font-weight:800;font-size:.8rem;padding:4px 10px;border-radius:999px;white-space:nowrap}\n.b-good{background:var(--goodbg);color:var(--good)}.b-mix{background:var(--mixbg);color:var(--mix)}.b-bad{background:var(--badbg);color:var(--bad)}.b-na{background:var(--nabg);color:var(--na)}\n.reveal{background:#fff;border:2px solid var(--teal);box-shadow:0 4px 0 var(--teal);border-radius:12px;font-weight:700;padding:8px 14px;margin-top:8px}\n.reveal:active{transform:translateY(4px);box-shadow:0 0 0 var(--teal)}\n.reveal.ex-btn{border-color:var(--pink);box-shadow:0 4px 0 var(--pink)}.reveal.ex-btn:active{box-shadow:0 0 0 var(--pink)}\n.reveal.why-btn{border-color:#f2d16b;box-shadow:0 4px 0 #f2d16b;font-size:.88rem}.reveal.why-btn:active{box-shadow:0 0 0 #f2d16b}\n.answer,.examples,.whywrap{display:none}.answer.show,.examples.show,.whywrap.show{display:block}\n.answer{margin-top:12px;background:#f7f9ff;border-left:6px solid var(--purple);border-radius:10px;padding:12px 14px}\n.answer h4{margin:.2rem 0 .4rem;color:#5b4b8a;font-family:'Fredoka One';font-weight:400;font-size:.95rem}\n.err{margin-top:10px;background:var(--badbg);border-radius:10px;padding:10px 12px;font-size:.92rem}.err b{color:var(--bad)}\n.examples{margin-top:10px}\n.exrow{border:1px solid #eef0f6;border-radius:12px;padding:10px;margin:10px 0;background:#fcfdff}\n.exlab{font-weight:800;color:#6a6f85;font-size:.78rem;margin-bottom:6px}\n.strip{border-radius:8px;padding:7px 10px;margin:5px 0;font-size:.92rem}\n.strip.w{background:var(--badbg)}.strip.y{background:var(--mixbg)}.strip.c{background:var(--goodbg)}\n.chip{display:inline-block;background:var(--nabg);border-radius:8px;padding:1px 7px;font-size:.8rem;font-weight:700;margin-left:4px}\n.board{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:640px){.board{grid-template-columns:1fr}}\n.col{border-radius:16px;padding:14px 16px}.col.g{background:var(--goodbg)}.col.b{background:var(--badbg)}\n.col h3{margin:.2rem 0 .6rem;font-family:'Fredoka One';font-weight:400}.col.g h3{color:var(--good)}.col.b h3{color:var(--bad)}\n.col ul{margin:0;padding-left:18px}.col li{margin:5px 0}\n.row{display:flex;align-items:center;gap:8px;margin:7px 0}.row .lab{flex:0 0 92px;font-weight:700;font-size:.85rem}\n.track{flex:1;background:#eef0f6;border-radius:999px;height:20px;overflow:hidden}\n.fill{height:100%;border-radius:999px;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;color:#fff;font-weight:800;font-size:.72rem}\n.legend,.note{font-size:.83rem;color:#6a6f85;margin-top:8px}\nfooter{text-align:center;color:#9aa0b3;font-size:.8rem;padding:20px}\n</style></head><body><div class=\"wrap\">\n<header><h1>\u2697\ufe0f 2021 O-Level Chemistry Practical (Paper 3) \u2014 Review Walkthrough</h1><div class=\"sub\">Model answers, class performance & real examples | 6092 | Evergreen Secondary School</div></header>\n<div class=\"bar-top\" id=\"tabs\"></div>\n<div id=\"ov\" class=\"page active\"></div>\n<div id=\"qpages\"></div>\n<footer>Examples are anonymised by script number only \u2014 use the index number to pull the paper if you need the original.</footer></div>\n<script>\nconst CFG={\"title\": \"\u2697\ufe0f 2021 O-Level Chemistry Practical (Paper 3) \u2014 Review Walkthrough\", \"subtitle\": \"Model answers, class performance & real examples | 6092 | Evergreen Secondary School\", \"credit\": \"\", \"avg\": \"24.85 / 40 (62%) class average across all 34 scripts\", \"note\": \"Examples are anonymised by script number only \u2014 use the index number to pull the paper if you need the original.\", \"good\": 75, \"mixed\": 60, \"questions\": [{\"id\": \"Q1\", \"tab\": \"Question 1\", \"name\": \"Question 1 \u2014 Mohr's Salt (Qualitative Analysis)\", \"parts\": [{\"t\": \"1(a) Heating solid X \u2014 observations\", \"m\": 2, \"fac\": 54, \"ans\": \"Gas produced turns damp red litmus paper blue (ammonia gas). Colourless droplets of liquid (water vapour) form at the cooler part of the tube. Solid X changes into a mixture of white, yellow and light brown solid/powder. <i>(Any 2 of these 3 points score full marks.)</i>\", \"err\": \"Loose colour description instead of the full sequence; some skip the water-vapour observation.\", \"ex\": [{\"s\": \"1252\", \"w\": \"green->white->brown; NH3 gas turns litmus blue\", \"y\": \"no water droplets seen; colour change not the white/yellow/brown mix\", \"c\": \"also need: colourless liquid droplets at cooler part of tube\"}, {\"s\": \"1253\", \"w\": \"solid turned green to white, litmus blue\", \"y\": \"missing water droplets; no white/yellow/brown mix\", \"c\": \"mixture white/yellow/light brown + water droplets\"}, {\"s\": \"1254\", \"w\": \"litmus turns blue; solid turns black\", \"y\": \"no water droplets noted; solid should whiten/yellow not blacken\", \"c\": \"droplets at cool end; X turns white/yellow/light brown mix\"}]}, {\"t\": \"1(b)(i) Tests 1-5 table\", \"m\": 5, \"fac\": 66, \"ans\": \"<b>Test 1:</b> pale green solution turns reddish/orange-brown; gas evolved rekindles a glowing splint (oxygen).<br><b>Test 2:</b> (dirty-)green precipitate forms with NaOH, insoluble in excess.<br><b>Test 3:</b> gas turns moist red litmus paper blue (ammonia).<br><b>Test 4:</b> reddish-brown precipitate forms with NaOH, insoluble in excess.<br><b>Test 5:</b> white precipitate forms with dilute HNO<sub>3</sub> then Ba(NO<sub>3</sub>)<sub>2</sub>.\", \"err\": \"Test 2/4 give the precipitate colour but skip 'insoluble in excess'; Test 1/3 gas tests often skipped entirely.\", \"ex\": [{\"s\": \"1251\", \"w\": \"T2 blue ppt; T3 no gas test; T4 excess=effervescence\", \"y\": \"Fe2+ needs green ppt; T1/3 need gas tests; excess pt is solubility\", \"c\": \"Green ppt insoluble in excess NaOH; NH3 turns litmus blue\"}, {\"s\": \"1252\", \"w\": \"T1: colourless solution turns red-brown\", \"y\": \"solution X itself is pale green, not colourless\", \"c\": \"pale green solution turns reddish/orange-brown\"}, {\"s\": \"1253\", \"w\": \"T1 'colourless'; T2 no ppt wording; T3 no gas test\", \"y\": \"soln is pale green not colourless; T2/T3 missing required wording/tests\", \"c\": \"pale green->orange + O2 test; green ppt insol.; NH3 turns litmus blue\"}]}, {\"t\": \"1(b)(ii) Formulae of ions in X\", \"m\": 2, \"fac\": 54, \"ans\": \"Cations: Fe<sup>2+</sup> and NH<sub>4</sub><sup>+</sup>. Anion: SO<sub>4</sub><sup>2-</sup>.\", \"err\": \"Names given instead of ion formulae (explicitly rejected by the scheme).\", \"ex\": [{\"s\": \"1253\", \"w\": \"cations Iron, Copper; anion Carbonate\", \"y\": \"wrong ions given as names, not formulae\", \"c\": \"Fe2+ and NH4+ cations; SO4 2- anion\"}, {\"s\": \"1254\", \"w\": \"Iron(II), ammonium, sulfate\", \"y\": \"scheme requires formulae, not names\", \"c\": \"Fe2+, NH4+, SO4 2-\"}, {\"s\": \"1255\", \"w\": \"Iron(II), ammonium, sulfate (names)\", \"y\": \"scheme requires ionic formulae, not names \u2014 explicit reject\", \"c\": \"Fe2+, NH4+, SO4 2-\"}]}, {\"t\": \"1(b)(iii) Type of reaction in Test 1\", \"m\": 2, \"fac\": 21, \"ans\": \"Redox reaction. Fe<sup>2+</sup> is oxidised to Fe<sup>3+</sup> (solution turns reddish/orange-brown). H<sub>2</sub>O<sub>2</sub> is reduced, losing oxygen (O<sub>2</sub> gas produced rekindles a glowing splint).\", \"err\": \"Only one half-reaction explained (usually the oxidation); H2O2's own reduction almost never covered.\", \"ex\": [{\"s\": \"1251\", \"w\": \"Fe2+ oxidised to Fe3+, colour change explained\", \"y\": \"H2O2's own reduction not explained\", \"c\": \"H2O2 reduced (loses O), shown by O2 rekindling splint\"}, {\"s\": \"1252\", \"w\": \"H2O2 reduced to form water\", \"y\": \"no link to O2 gas rekindling splint as evidence\", \"c\": \"H2O2 reduced, shown by O2 gas rekindling glowing splint\"}, {\"s\": \"1253\", \"w\": \"displacement reaction, iron displaced from salt\", \"y\": \"wrong reaction type, not redox/oxidation states\", \"c\": \"Fe2+ oxidised to Fe3+; H2O2 reduced, O2 rekindles splint\"}]}]}, {\"id\": \"Q2\", \"tab\": \"Question 2\", \"name\": \"Question 2 \u2014 Titration (Copper in Brass)\", \"parts\": [{\"t\": \"2(a)(i) Titration results table\", \"m\": 5, \"fac\": 79, \"ans\": \"Results table with proper headings/units; burette readings to 2 d.p.; at least 2 concordant titres within 0.20 cm&sup3;; consistent, well-executed titration technique.\", \"err\": \"Burette readings not to 2 d.p., or repeat titres too scattered to be concordant.\", \"ex\": [{\"s\": \"1252\", \"w\": \"trial 2 readings 48.2, 24.0 (1 d.p.)\", \"y\": \"not all burette readings recorded to 2 d.p.\", \"c\": \"record every burette reading as x.x0 or x.x5 cm3\"}, {\"s\": \"1253\", \"w\": \"readings to 1 d.p. (27.3, 23.5, 23.5)\", \"y\": \"burette readings need 2 d.p. precision\", \"c\": \"record as x.x0/x.x5 cm3, e.g. 23.50\"}, {\"s\": \"1254\", \"w\": \"titres to 1dp/whole no., range 23-25\", \"y\": \"not 2dp precision; 3/5 trials scattered beyond 0.2cm3\", \"c\": \"record burette to 2dp; tighter repeats\"}]}, {\"t\": \"2(a)(ii) Average volume of P\", \"m\": 1, \"fac\": 85, \"ans\": \"Average = mean of the concordant titre values, e.g. (22.10 + 22.20) / 2 = 22.15 &asymp; 22.2 cm&sup3;.\", \"err\": \"Averaging the wrong (non-concordant) titres, or an arithmetic slip.\", \"ex\": [{\"s\": \"1254\", \"w\": \"23.9 = mean of all 5 titres\", \"y\": \"should avg only concordant titres\", \"c\": \"avg 23.5 & 23.5 = 23.5 cm3\"}, {\"s\": \"1260\", \"w\": \"average = 23.5 cm3\", \"y\": \"arithmetic slip: correct sum/2 = 23.25, not 23.5\", \"c\": \"average volume = 23.25 cm3\"}, {\"s\": \"1268\", \"w\": \"averaged all 4 before/after partial readings = 11.5cm3\", \"y\": \"should sum before+after per trial for full titre first\", \"c\": \"titre = before+after per trial (23.0,23.0cm3), avg = 23.0cm3\"}]}, {\"t\": \"2(b)(i) Moles of thiosulfate ions\", \"m\": 1, \"fac\": 100, \"ans\": \"mol S<sub>2</sub>O<sub>3</sub><sup>2-</sup> = (average volume of P &divide; 1000) &times; 0.120.\", \"err\": \"No significant issues &mdash; the whole class scored full marks here.\"}, {\"t\": \"2(b)(ii) Moles of Cu2+ in 1.00 dm3 of Q\", \"m\": 2, \"fac\": 60, \"ans\": \"Using S<sub>2</sub>O<sub>3</sub><sup>2-</sup> : I<sub>2</sub> = 2:1 then I<sub>2</sub> : Cu<sup>2+</sup> = 1:2, so Cu<sup>2+</sup> : S<sub>2</sub>O<sub>3</sub><sup>2-</sup> = 1:1 &rarr; mol Cu<sup>2+</sup> in 25.0 cm&sup3; = mol S<sub>2</sub>O<sub>3</sub><sup>2-</sup>. Then scale &times;40 to get mol Cu<sup>2+</sup> in 1.00 dm&sup3; of Q.\", \"err\": \"Dividing mol thiosulfate by the volume of P (this just recovers P's own given concentration) instead of the 1:1 mole ratio + &times;40 scale-up.\", \"ex\": [{\"s\": \"1251\", \"w\": \"0.002658/(22.15/1000)=0.12mol\", \"y\": \"Wrong method, not mol ratio+scale-up\", \"c\": \"0.00266mol x40 = 0.106mol\"}, {\"s\": \"1254\", \"w\": \"0.00287/0.0250=0.115mol\", \"y\": \"recomputes P's own 0.120mol/dm3, not ratio+scale-up\", \"c\": \"mol Cu2+ = mol I2 x2, then x40 scale-up\"}, {\"s\": \"1257\", \"w\": \"0.00283 mol (same as 25cm3 value)\", \"y\": \"forgot x40 scale-up to 1.00 dm3\", \"c\": \"multiply by 40 for 1.00 dm3 total\"}]}, {\"t\": \"2(b)(iii) Mass of copper in the screw\", \"m\": 1, \"fac\": 82, \"ans\": \"mass of Cu = mol Cu<sup>2+</sup> (from (b)(ii)) &times; 64.\", \"err\": \"Wrong A&#7523; used (63.5 instead of the given 64), or an arithmetic slip.\", \"ex\": [{\"s\": \"1251\", \"w\": \"0.12x0.100x64=0.768g\", \"y\": \"Spurious x0.100 factor\", \"c\": \"mass = (b)(ii) answer x 64\"}, {\"s\": \"1269\", \"w\": \"used 63.5, not given Ar=64\", \"y\": \"paper states Ar=64\", \"c\": \"0.001302x64=0.0833g\"}, {\"s\": \"1275\", \"w\": \"mass = 7.567 g\", \"y\": \"arithmetic error, 64x0.11808=7.557g\", \"c\": \"mass = 7.56 g (64 x 0.11808)\"}]}, {\"t\": \"2(b)(iv) Percentage by mass of copper\", \"m\": 3, \"fac\": 80, \"ans\": \"% by mass = (mass of Cu &divide; 9.50) &times; 100%. Keep significant figures consistent throughout (b)(i)&ndash;(iv); units: g in (iii), % in (iv).\", \"err\": \"Missing unit (g) on the mass answer, or sig figs inconsistent with earlier parts.\", \"ex\": [{\"s\": \"1251\", \"w\": \"(b)(ii) given as 0.12mol, 2 s.f.\", \"y\": \"Sig figs inconsistent (b)(i)-(iv)\", \"c\": \"State as 0.120mol (3 s.f.)\"}, {\"s\": \"1253\", \"w\": \"mass = 7.22 (no unit), % = 76.0%\", \"y\": \"missing g unit on the mass answer\", \"c\": \"state mass of Cu as 7.22 g\"}, {\"s\": \"1254\", \"w\": \"76.8%, method+sig figs ok\", \"y\": \"(b)(iii) missing 'g' unit\", \"c\": \"write mass = 7.30 g\"}]}, {\"t\": \"2(c) Effect of insufficient KI\", \"m\": 2, \"fac\": 50, \"ans\": \"Cu<sup>2+</sup> ions are left unreacted (KI not in excess), so less I<sub>2</sub> forms &mdash; meaning a smaller volume of thiosulfate is needed &mdash; hence a lower calculated mass/percentage of copper.\", \"err\": \"States the direction (lower) correctly but skips the causal chain (why it's lower).\", \"ex\": [{\"s\": \"1251\", \"w\": \"% Cu would be lower than actual\", \"y\": \"No explanation given\", \"c\": \"Cu2+ unreacted -> lower titre -> lower % Cu\"}, {\"s\": \"1252\", \"w\": \"less copper formed so % Cu decreases\", \"y\": \"skips the intermediate step (lower thiosulfate titre)\", \"c\": \"Cu2+ unreacted -> less I2 -> lower titre -> lower % Cu\"}, {\"s\": \"1254\", \"w\": \"%Cu too low; less I2, smaller titre\", \"y\": \"cause omitted (Cu2+ unreacted)\", \"c\": \"KI not excess -> Cu2+ unreacted -> lower %Cu\"}]}]}, {\"id\": \"Q3\", \"tab\": \"Question 3\", \"name\": \"Question 3 \u2014 Carbonates and Thermochemistry\", \"parts\": [{\"t\": \"3(a) Preparing the dilute acid\", \"m\": 3, \"fac\": 30, \"ans\": \"<b>Method 1:</b> using a burette, measure 10.00 cm&sup3; of the acid; using another burette, measure 90.00 cm&sup3; of distilled water; mix.<br><b>Method 2:</b> 0.365 g of acid (electronic balance) + 100.00 cm&sup3; water (burette).\", \"err\": \"Almost everyone used a measuring-cylinder/volumetric-flask method instead of the scheme's burette method.\", \"ex\": [{\"s\": \"1251\", \"w\": \"10.0cm3 acid (cylinder), topped up to 100cm3 mark\", \"y\": \"Scheme needs burette + explicit 90.00cm3 water\", \"c\": \"Burette: 10.00cm3 acid + burette: 90.00cm3 water\"}, {\"s\": \"1252\", \"w\": \"measuring cylinders for both acid and water\", \"y\": \"scheme requires burette for both volumes\", \"c\": \"use burette to measure 10.00cm3 acid and 90.00cm3 water\"}, {\"s\": \"1253\", \"w\": \"10.0cm3 acid (cylinder), topped up to 100cm3 mark\", \"y\": \"scheme needs burette + explicit 90.00cm3 water\", \"c\": \"burette: 10.00cm3 acid + burette: 90.00cm3 water\"}]}, {\"t\": \"3(b)(i) Graph\", \"m\": 4, \"fac\": 74, \"ans\": \"Plot all points; draw two straight lines of best fit (0&ndash;3 min data, and 3&ndash;8 min data), extend both to 3 min, then join with a vertical line at 3 min.\", \"err\": \"0&ndash;2 min line of best fit or the vertical join at 3 min often missing.\", \"ex\": [{\"s\": \"1252\", \"w\": \"only 4-8min line and vertical line at 3min drawn\", \"y\": \"0-2min points left unconnected, no line of best fit\", \"c\": \"draw a (flat) line of best fit through 0-2min points too\"}, {\"s\": \"1255\", \"w\": \"single best-fit line only for 4-8 min data\", \"y\": \"missing best-fit line for 0-3 min points and missing vertical connector at 3 min\", \"c\": \"draw two extrapolated lines (0-3 min and 4-8 min) joined by a vertical line at 3 min\"}, {\"s\": \"1257\", \"w\": \"only one line (4-8min) drawn, extrapolated to 3min\", \"y\": \"0-2min line of best fit missing\", \"c\": \"draw second line joining 0-2min points, extended to 3min\"}]}, {\"t\": \"3(b)(ii) Maximum temperature rise\", \"m\": 1, \"fac\": 68, \"ans\": \"Maximum temperature rise = extrapolated temperature at 3 min minus the initial 22.0&deg;C, to the nearest 0.5&deg;C (specimen: 4.5&deg;C).\", \"err\": \"Gives the peak temperature reached, not the temperature RISE.\", \"ex\": [{\"s\": \"1257\", \"w\": \"26.5C (the temp reached, not the rise)\", \"y\": \"gave max temp reached instead of the rise\", \"c\": \"26.5 - 22.0 = 4.5C\"}, {\"s\": \"1258\", \"w\": \"26.4\u00b0C (graph's extrapolated max temp)\", \"y\": \"did not subtract initial temp 22.0\u00b0C\", \"c\": \"rise = extrapolated max temp \u2212 22.0\u00b0C\"}, {\"s\": \"1259\", \"w\": \"gave 26.5C (the peak temp, not the rise)\", \"y\": \"26.5 is the max temp reached, not the rise\", \"c\": \"rise = 26.5 - 22.0 = 4.5 C\"}]}, {\"t\": \"3(b)(iii) Heat released (J)\", \"m\": 1, \"fac\": 59, \"ans\": \"heat released (J) = mass of solution (50.0 g) &times; temperature rise &times; 4.2 (specimen: 945 J).\", \"err\": \"Wrong mass substituted into the heat expression (adds the solid's mass, or omits a term).\", \"ex\": [{\"s\": \"1254\", \"w\": \"16.8J = 1.0x4.0x4.2\", \"y\": \"used 1.0g not 50.0g solution mass\", \"c\": \"50.0x4.0x4.2 = 840J\"}, {\"s\": \"1255\", \"w\": \"total mass = 50g+(24.8-21.3)=53.5g used in formula\", \"y\": \"formula requires mass of solution = 50.0 g only, not plus solid mass\", \"c\": \"heat released = 50.0 x 4.5 x 4.2 = 945 J\"}, {\"s\": \"1257\", \"w\": \"(mass 53.5g) x 26.5 x 4.2 = 5950J\", \"y\": \"wrong mass (added solid) and wrong temp (not the rise)\", \"c\": \"50.0 x 4.5 x 4.2 = 945 J\"}]}, {\"t\": \"3(b)(iv) Moles of CaCO3\", \"m\": 1, \"fac\": 82, \"ans\": \"mol CaCO<sub>3</sub> = (mass of container with CaCO<sub>3</sub> &minus; mass after adding to cup) &divide; 100 (specimen: 0.035 mol).\", \"err\": \"Arithmetic slip in the mass difference or the &divide;100 step.\", \"ex\": [{\"s\": \"1255\", \"w\": \"3.5/100 = 0.0035 mol\", \"y\": \"arithmetic slip, should be 0.035 mol (10x error)\", \"c\": \"mol CaCO3 = 3.5/100 = 0.035 mol\"}, {\"s\": \"1258\", \"w\": \"mol CaCO3 = 0.0025 mol (from total mol HCl \u00f7 2)\", \"y\": \"HCl is in excess - cannot assume it all reacted\", \"c\": \"(24.8\u221221.3)/100 = 0.035 mol from mass loss\"}, {\"s\": \"1266\", \"w\": \"mass CaCO3 = 24.8-21.3 = 2.7g (2 errors)\", \"y\": \"24.8-21.3=3.5g not 2.7g; also division miscalculated\", \"c\": \"3.5/100 = 0.035 mol\"}]}, {\"t\": \"3(b)(v) Heat released (kJ/mol)\", \"m\": 1, \"fac\": 62, \"ans\": \"heat released (kJ/mol) = heat released (in kJ) &divide; mol CaCO<sub>3</sub> (specimen: 27.0 kJ/mol).\", \"err\": \"Forgets to convert J to kJ before dividing by moles.\", \"ex\": [{\"s\": \"1254\", \"w\": \"480 = 16.8/0.035\", \"y\": \"J not converted to kJ (missing /1000)\", \"c\": \"own heat(J)/1000, then / mol CaCO3\"}, {\"s\": \"1257\", \"w\": \"5954.6/0.035 = 170 000 kJ/mol\", \"y\": \"forgot to divide by 1000 (J to kJ)\", \"c\": \"(5954.6/1000)/0.035 = 170 kJ/mol\"}, {\"s\": \"1259\", \"w\": \"recomputed heat using 21.3g instead of (iii)'s 5565J\", \"y\": \"should reuse own heat value from (iii), not remass with 21.3g\", \"c\": \"5.565kJ / 0.035mol = 159 kJ/mol\"}]}, {\"t\": \"3(b)(vi) Why the graph method is more accurate\", \"m\": 1, \"fac\": 74, \"ans\": \"Using a graph lets you monitor the temperature throughout and extrapolate back to the true maximum (allowing for heat lost to the surroundings), rather than relying on a single spot reading.\", \"err\": \"Paraphrases the question stem instead of explaining monitoring/heat-loss.\", \"ex\": [{\"s\": \"1254\", \"w\": \"best fit line = more accurate value\", \"y\": \"restates question; no monitoring/heat-loss reasoning\", \"c\": \"graph tracks temp continuously, finds true highest point before heat loss\"}, {\"s\": \"1255\", \"w\": \"graph estimates max temp instead of measuring highest temp\", \"y\": \"paraphrases the question stem, doesn't explain why graph is more accurate\", \"c\": \"graph allows continuous monitoring, so extrapolated peak avoids missing true max due to heat loss\"}, {\"s\": \"1260\", \"w\": \"shows rise not just temperature, more varied\", \"y\": \"paraphrases the question, doesn't explain continuous monitoring/heat loss reasoning\", \"c\": \"graph allows extrapolation, correcting for heat lost to surroundings before/after peak\"}]}, {\"t\": \"3(c) Testing for zinc carbonate\", \"m\": 2, \"fac\": 21, \"ans\": \"Add dilute nitric acid to dissolve the solid, then add a few drops of aqueous ammonia to the resulting solution. Colourless solution = no ZnCO<sub>3</sub>; white precipitate (that dissolves in excess ammonia) = ZnCO<sub>3</sub> present.\", \"err\": \"Uses sodium hydroxide instead of the scheme's aqueous ammonia.\", \"ex\": [{\"s\": \"1252\", \"w\": \"excess NH3 -> colourless = Zn present; separately test for carbonate gas\", \"y\": \"doesn't match scheme's dissolve-in-HNO3-then-few-drops-NH3 method\", \"c\": \"add HNO3 to dissolve solid, then few drops NH3: white ppt = Zn present\"}, {\"s\": \"1253\", \"w\": \"HCl then NaOH dropwise/excess to filtrate\", \"y\": \"scheme requires HNO3 then aqueous ammonia test\", \"c\": \"add HNO3 to dissolve, add few drops aqueous ammonia\"}, {\"s\": \"1254\", \"w\": \"acid then NaOH; white ppt dissolves in excess\", \"y\": \"scheme specifies nitric acid + aqueous ammonia, not NaOH\", \"c\": \"add dilute HNO3, then aqueous ammonia; white ppt=ZnCO3 present\"}]}]}]}; const GOOD=CFG.good, MIXED=CFG.mixed;\nfunction band(f){if(f===null||f===undefined)return{cls:\"b-na\",lab:\"Not assessed\"};if(f>=GOOD)return{cls:\"b-good\",lab:\"Did well \"+f+\"%\"};if(f>=MIXED)return{cls:\"b-mix\",lab:\"Mixed \"+f+\"%\"};return{cls:\"b-bad\",lab:\"Struggled \"+f+\"%\"};}\nfunction fc(f){return f>=GOOD?\"var(--good)\":f>=MIXED?\"var(--mix)\":\"var(--bad)\";}\n// tabs\nlet tabsH='<button class=\"tab active\" data-p=\"ov\">\ud83d\udcca Overview</button>';\nCFG.questions.forEach((q,i)=>{tabsH+=`<button class=\"tab\" data-p=\"${q.id}\">${q.tab||q.id}</button>`;});\ntabsH+='<button class=\"btn\" id=\"toggleAll\">Reveal all answers</button>';\ndocument.getElementById(\"tabs\").innerHTML=tabsH;\n// question pages\nlet idc=0, pagesH=\"\";\nCFG.questions.forEach(q=>{\n  let h=`<div class=\"page\" id=\"${q.id}\"><div class=\"card\"><div class=\"qtag\">${q.name}</div></div>`;\n  q.parts.forEach(p=>{const b=band(p.fac);const id=\"a\"+(idc++);\n    h+=`<div class=\"card\"><div class=\"qhead\"><div><span class=\"qtag\">${p.t}</span> <span class=\"marks\">[${p.m}]</span></div><span class=\"badge ${b.cls}\">${b.lab}</span></div>\n      <button class=\"reveal\" onclick=\"tog('${id}',this,0)\">Reveal model answer</button>\n      <div class=\"answer\" id=\"${id}\"><h4>Model answer</h4><div>${p.ans}</div>${p.err?`<div class=\"err\"><b>Common slip:</b> ${p.err}</div>`:``}</div>`;\n    if(p.ex&&p.ex.length){h+=`<button class=\"reveal ex-btn\" onclick=\"tog('${id}x',this,1)\">\ud83d\udd0d Class examples (${p.ex.length})</button>\n      <div class=\"examples\" id=\"${id}x\" data-n=\"${p.ex.length}\">`+p.ex.map(e=>{const xid=\"x\"+(idc++);return `<div class=\"exrow\">${e.s?`<div class=\"exlab\">Script ${e.s}</div>`:``}\n        <div class=\"strip w\">\u270d\ufe0f <b>Wrote:</b> ${e.w}</div>\n        <button class=\"reveal why-btn\" onclick=\"togWhy('${xid}',this)\">\ud83e\udd14 What's wrong with this?</button>\n        <div class=\"whywrap\" id=\"${xid}\"><div class=\"strip y\">\u274c <b>Why it\u2019s wrong:</b> ${e.y}</div><div class=\"strip c\">\u2705 <b>Model answer:</b> ${e.c}</div></div></div>`;}).join(\"\")+`</div>`;}\n    h+=`</div>`;});\n  h+=`</div>`; pagesH+=h;\n});\ndocument.getElementById(\"qpages\").innerHTML=pagesH;\nfunction tog(id,btn,isEx){const a=document.getElementById(id);const s=a.classList.toggle(\"show\");\n  if(isEx)btn.textContent=s?\"Hide class examples\":(\"\ud83d\udd0d Class examples (\"+a.dataset.n+\")\");else btn.textContent=s?\"Hide model answer\":\"Reveal model answer\";}\n// Staged exemplar reveal: the \u270d\ufe0f Wrote strip is always visible; the \u274c why + \u2705 model answer\n// stay hidden behind this button so the class can discuss each exemplar before the reveal.\nfunction togWhy(id,btn){const a=document.getElementById(id);const s=a.classList.toggle(\"show\");\n  btn.textContent=s?\"Hide explanation\":\"\ud83e\udd14 What's wrong with this?\";}\n// overview\n(function(){const all=[];CFG.questions.forEach(q=>q.parts.forEach(p=>{if(p.fac!==null&&p.fac!==undefined)all.push({t:p.t,f:p.fac,err:p.err});}));\n  const good=all.filter(x=>x.f>=GOOD).sort((a,b)=>b.f-a.f),bad=all.filter(x=>x.f<MIXED).sort((a,b)=>a.f-b.f),mix=all.filter(x=>x.f>=MIXED&&x.f<GOOD).sort((a,b)=>a.f-b.f);\n  let h=`<div class=\"card\"><div class=\"qtag\">\ud83d\udcca How the class did</div><p class=\"note\">${CFG.avg?(\"Average <b>\"+CFG.avg+\"</b>. \"):\"\"}Green = strong, red = needs re-teaching.</p>\n    <div class=\"board\"><div class=\"col g\"><h3>\u2705 Done well</h3><ul>${good.map(x=>`<li>${x.t} <span class=\"chip\">${x.f}%</span></li>`).join(\"\")}</ul></div>\n    <div class=\"col b\"><h3>\u26a0\ufe0f Struggled \u2014 re-teach</h3><ul>${bad.map(x=>`<li>${x.t} <span class=\"chip\">${x.f}%</span><br><span class=\"note\">${x.err||\"\"}</span></li>`).join(\"\")}</ul></div></div></div>`;\n  h+=`<div class=\"card\"><div class=\"qtag\">Facility by part <span class=\"note\">(% of marks earned)</span></div><div>`;\n  all.forEach(x=>{h+=`<div class=\"row\"><div class=\"lab\">${x.t.split(\" \")[0]}</div><div class=\"track\"><div class=\"fill\" style=\"width:${Math.max(x.f,8)}%;background:${fc(x.f)}\">${x.f}%</div></div></div>`;});\n  h+=`</div><div class=\"legend\">\ud83d\udfe2 \u2265${GOOD}% did well&nbsp;&nbsp;\ud83d\udfe1 ${MIXED}\u2013${GOOD-1}% mixed&nbsp;&nbsp;\ud83d\udd34 &lt;${MIXED}% struggled</div></div>`;\n  if(mix.length)h+=`<div class=\"card\"><div class=\"qtag\">\ud83d\udfe1 In between</div><ul>${mix.map(x=>`<li>${x.t} <span class=\"chip\">${x.f}%</span></li>`).join(\"\")}</ul></div>`;\n  document.getElementById(\"ov\").innerHTML=h;})();\n// tab switching + reveal all\ndocument.querySelectorAll(\".tab\").forEach(t=>t.addEventListener(\"click\",()=>{document.querySelectorAll(\".tab\").forEach(x=>x.classList.remove(\"active\"));document.querySelectorAll(\".page\").forEach(x=>x.classList.remove(\"active\"));t.classList.add(\"active\");document.getElementById(t.dataset.p).classList.add(\"active\");window.scrollTo({top:0,behavior:\"smooth\"});}));\nlet allShown=false;document.getElementById(\"toggleAll\").addEventListener(\"click\",function(){allShown=!allShown;document.querySelectorAll(\".answer\").forEach(a=>a.classList.toggle(\"show\",allShown));document.querySelectorAll(\".reveal:not(.ex-btn)\").forEach(b=>b.textContent=allShown?\"Hide model answer\":\"Reveal model answer\");this.textContent=allShown?\"Hide all answers\":\"Reveal all answers\";});\n<\/script></body></html>";
